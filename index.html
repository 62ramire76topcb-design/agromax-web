<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGROMAX PRO</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
.hero-bg {
  background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), 
              url('https://images.unsplash.com/photo-1625246333195-78d9c38ad449') center/cover no-repeat;
}
.product-card {
  transition: all 0.3s ease;
}
.product-card:hover {
  transform: translateY(-8px);
  box-shadow: 0 20px 40px rgba(0,0,0,0.15);
}
.cat-tab.active {
  background-color: #166534;
  color: white;
}
</style>
</head>

<body class="bg-gray-50">

<!-- HEADER -->
<header class="bg-white shadow sticky top-0 z-50">
<div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">

<div>
<h1 class="text-2xl font-bold text-green-700">AGROMAX</h1>
<p class="text-xs text-gray-500">Aldea El Durazno, Amatitlán</p>
</div>

<div class="flex gap-4">
<button onclick="contactarWhatsApp()" class="bg-green-600 text-white px-5 py-2 rounded-xl">
WhatsApp
</button>

<button onclick="mostrarCarrito()" class="relative">
🛒
<span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs w-5 h-5 flex items-center justify-center rounded-full">0</span>
</button>
</div>

</div>
</header>

<!-- HERO -->
<section class="hero-bg h-[60vh] flex items-center justify-center text-white text-center">
<div>
<h2 class="text-4xl font-bold">Insumos Agrícolas</h2>
<p>Producción con pasión</p>
</div>
</section>

<!-- CATEGORÍAS -->
<section class="py-10 bg-white">
<div class="max-w-7xl mx-auto px-6">

<div class="flex flex-wrap justify-center gap-3 mb-8">
<button onclick="cambiarCategoria(0)" class="cat-tab active px-6 py-3 border rounded-xl">Fertilizantes</button>
<button onclick="cambiarCategoria(1)" class="cat-tab px-6 py-3 border rounded-xl">Foliares</button>
<button onclick="cambiarCategoria(2)" class="cat-tab px-6 py-3 border rounded-xl">Protección</button>
<button onclick="cambiarCategoria(3)" class="cat-tab px-6 py-3 border rounded-xl">Herramientas</button>
</div>

<div id="productos" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>

</div>
</section>

<script>
let carrito = JSON.parse(localStorage.getItem('carritoAgromax')) || [];

/* ==== CATÁLOGO ORIGINAL ==== */
const catalogos = [
[
{id:101,nombre:"Urea 46-0-0",precio:245,unidad:"50 kg",oferta:true},
{id:102,nombre:"NPK 10-20-20",precio:285,unidad:"50 kg"},
{id:103,nombre:"DAP 18-46-0",precio:320,unidad:"50 kg"}
],
[
{id:201,nombre:"Foliar Calcio + Boro",precio:95,unidad:"1L"},
{id:202,nombre:"Foliar NPK 20-20-20",precio:85,unidad:"1L"}
],
[
{id:301,nombre:"Glifosato 480 SL",precio:135,unidad:"5L"},
{id:302,nombre:"Mancozeb 80%",precio:125,unidad:"1kg"}
],
[
{id:401,nombre:"Machete Profesional",precio:85,unidad:"Unidad"},
{id:402,nombre:"Aspersora 20L",precio:245,unidad:"Unidad"}
]
];

/* ==== FUNCIONES ==== */

function cambiarCategoria(index){
document.querySelectorAll('.cat-tab').forEach((b,i)=>{
b.classList.toggle('active', i===index);
});

const cont = document.getElementById("productos");
cont.innerHTML = "";

catalogos[index].forEach(p=>{
const div = document.createElement("div");
div.className = "product-card bg-white p-4 rounded-xl";

div.innerHTML = `
${p.oferta ? '<span class="bg-red-500 text-white text-xs px-2 py-1 rounded-full">🔥 Oferta</span>' : ''}
<h3 class="font-bold mt-2">${p.nombre}</h3>
<p class="text-sm text-gray-500">${p.unidad}</p>
<p class="text-green-600 text-2xl font-bold mt-2">Q${p.precio.toLocaleString()}</p>

<div class="flex gap-2 mt-4">
<button onclick='agregar(${JSON.stringify(p)})' class="bg-green-600 text-white w-full py-2 rounded">
Añadir
</button>
</div>
`;

cont.appendChild(div);
});
}

function agregar(producto){
const existe = carrito.find(p=>p.id===producto.id);

if(existe){
existe.cantidad++;
}else{
carrito.push({...producto, cantidad:1});
}

localStorage.setItem('carritoAgromax', JSON.stringify(carrito));
actualizarContador();
}

function actualizarContador(){
const total = carrito.reduce((sum,p)=>sum+p.cantidad,0);
document.getElementById("cart-count").textContent = total;
}

function contactarWhatsApp(){
if(carrito.length===0){
window.open("https://wa.me/50242664744?text=Hola AGROMAX, quiero información");
return;
}

let msg="Hola AGROMAX 👨‍🌾,%0AQuiero cotizar:%0A";

carrito.forEach(p=>{
msg+=`- ${p.nombre} x${p.cantidad} Q${p.precio}%0A`;
});

window.open(`https://wa.me/50242664744?text=${msg}`);
}

function mostrarCarrito(){
contactarWhatsApp();
}

/* INIT */
window.onload=()=>{
actualizarContador();
cambiarCategoria(0);
};
</script>

</body>
</html>
