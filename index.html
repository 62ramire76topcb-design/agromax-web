<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGROMAXGTM | Catálogo Guatemala</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-50">

  <!-- HEADER -->
  <header class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 bg-green-700 rounded-2xl flex items-center justify-center text-white text-3xl font-bold">🌱</div>
        <div>
          <h1 class="text-2xl font-bold text-green-700">AGROMAXGTM</h1>
          <p class="text-xs text-green-600">Producimos con pasión, trabajamos por el futuro</p>
        </div>
      </div>
      
      <div class="flex items-center gap-4">
        <button onclick="toggleCart()" class="relative flex items-center gap-2 bg-gray-100 hover:bg-gray-200 px-6 py-3 rounded-2xl font-medium">
          <i class="fas fa-shopping-cart text-2xl"></i>
          <span id="cart-count" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold w-6 h-6 flex items-center justify-center rounded-full">0</span>
          Carrito
        </button>
        <button onclick="contactarWhatsApp()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-2xl font-medium flex items-center gap-2">
          <i class="fab fa-whatsapp text-xl"></i> WhatsApp
        </button>
      </div>
    </div>
  </header>

  <!-- HERO -->
  <section class="bg-gradient-to-br from-green-700 to-green-800 text-white py-16">
    <div class="max-w-7xl mx-auto px-6 text-center">
      <h2 class="text-5xl md:text-6xl font-bold mb-4">Catálogo de Insumos Agrícolas</h2>
      <p class="text-xl mb-8">Calidad profesional para el campo guatemalteco</p>
      
      <div class="max-w-2xl mx-auto">
        <input id="buscador" type="text" placeholder="Buscar productos..." 
               class="w-full pl-14 pr-6 py-5 rounded-3xl text-lg focus:outline-none text-gray-900"
               onkeyup="filtrarProductos()">
      </div>
    </div>
  </section>

  <!-- FILTROS -->
  <section class="py-8 bg-white border-b">
    <div class="max-w-7xl mx-auto px-6">
      <div class="flex flex-wrap gap-3 justify-center" id="tabs">
        <button onclick="filtrarCategoria('all')" class="cat-tab active px-8 py-3 rounded-2xl font-semibold border-2 border-green-600 text-green-600">Todos</button>
        <button onclick="filtrarCategoria('Fertilizantes')" class="cat-tab px-8 py-3 rounded-2xl font-semibold border-2">Fertilizantes</button>
        <button onclick="filtrarCategoria('Foliares')" class="cat-tab px-8 py-3 rounded-2xl font-semibold border-2">Foliares</button>
        <button onclick="filtrarCategoria('Protección')" class="cat-tab px-8 py-3 rounded-2xl font-semibold border-2">Protección</button>
        <button onclick="filtrarCategoria('Herramientas')" class="cat-tab px-8 py-3 rounded-2xl font-semibold border-2">Herramientas</button>
        <button onclick="filtrarCategoria('Accesorios')" class="cat-tab px-8 py-3 rounded-2xl font-semibold border-2">Accesorios</button>
      </div>
    </div>
  </section>

  <!-- PRODUCTOS -->
  <section class="py-12">
    <div class="max-w-7xl mx-auto px-6">
      <div id="lista-productos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></div>
    </div>
  </section>

  <!-- CARRITO -->
  <div id="cart-modal" class="hidden fixed inset-0 bg-black/70 z-[100] flex items-center justify-center">
    <div class="bg-white w-full max-w-2xl rounded-3xl max-h-[90vh] flex flex-col">
      <div class="p-6 border-b flex justify-between items-center">
        <h2 class="text-2xl font-bold">🛒 Tu Carrito</h2>
        <button onclick="toggleCart()" class="text-4xl text-gray-400 hover:text-black">×</button>
      </div>
      <div id="cart-items" class="flex-1 overflow-auto p-6 space-y-6"></div>
      <div class="p-6 border-t">
        <div class="flex justify-between text-2xl font-bold mb-6">
          <span>Total:</span>
          <span id="cart-total" class="text-green-600">Q0.00</span>
        </div>

        <button onclick="pagarConStripe()" id="btn-stripe"
                class="w-full bg-blue-600 hover:bg-blue-700 py-5 rounded-2xl text-white font-bold text-lg mb-3 flex items-center justify-center gap-2">
          <i class="fas fa-credit-card"></i> Pagar con Tarjeta
        </button>

        <button onclick="enviarPedidoWhatsApp()" class="w-full bg-green-600 hover:bg-green-700 py-5 rounded-2xl text-white font-bold text-lg">
          <i class="fab fa-whatsapp"></i> Enviar Pedido por WhatsApp
        </button>
      </div>
    </div>
  </div>

  <!-- Scripts modulares -->
  <script src="./js/firebase-config.js"></script>
  <script src="./js/catalogo.js"></script>
</body>
</html>
