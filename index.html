<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGROMAXGTM | Catálogo Guatemala</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-50">

  <header class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-3 sm:px-4 py-3 sm:py-4 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2 sm:gap-3 min-w-0">
        <div class="w-9 h-9 sm:w-12 sm:h-12 bg-green-700 rounded-xl sm:rounded-2xl flex items-center justify-center text-white text-xl sm:text-3xl font-bold shrink-0">🌱</div>
        <div class="min-w-0">
          <h1 class="text-lg sm:text-2xl font-bold text-green-700 truncate">AGROMAXGTM</h1>
          <p class="text-[10px] sm:text-xs text-green-600 hidden sm:block">Producimos con pasión, trabajamos por el futuro</p>
        </div>
      </div>
      <div class="flex items-center gap-2 sm:gap-4 shrink-0">
        <button onclick="toggleCart()" class="relative flex items-center gap-1 sm:gap-2 bg-gray-100 hover:bg-gray-200 px-3 sm:px-6 py-2 sm:py-3 rounded-xl sm:rounded-2xl font-medium text-sm sm:text-base">
          <i class="fas fa-shopping-cart text-lg sm:text-2xl"></i>
          <span id="cart-count" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold w-5 h-5 sm:w-6 sm:h-6 flex items-center justify-center rounded-full">0</span>
          <span class="hidden sm:inline">Carrito</span>
        </button>
        <button onclick="contactarWhatsApp()" class="bg-green-600 hover:bg-green-700 text-white px-3 sm:px-6 py-2 sm:py-3 rounded-xl sm:rounded-2xl font-medium flex items-center gap-1 sm:gap-2 text-sm sm:text-base">
          <i class="fab fa-whatsapp text-lg sm:text-xl"></i>
          <span class="hidden sm:inline">WhatsApp</span>
        </button>
      </div>
    </div>
  </header>

  <section class="bg-gradient-to-br from-green-700 to-green-800 text-white py-8 sm:py-12 md:py-16">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 text-center">
      <h2 class="text-2xl sm:text-4xl md:text-5xl lg:text-6xl font-bold mb-2 sm:mb-4 leading-tight">Catálogo de Insumos Agrícolas</h2>
      <p class="text-sm sm:text-lg md:text-xl mb-4 sm:mb-8 opacity-90">Calidad profesional para el campo guatemalteco</p>
      <div class="max-w-2xl mx-auto">
        <input id="buscador" type="text" placeholder="Buscar productos..."
               class="w-full px-4 sm:pl-14 sm:pr-6 py-3 sm:py-5 rounded-2xl sm:rounded-3xl text-base sm:text-lg focus:outline-none text-gray-900"
               onkeyup="filtrarProductos()">
      </div>
    </div>
  </section>

  <section class="py-4 sm:py-8 bg-white border-b">
    <div class="max-w-7xl mx-auto px-3 sm:px-6">
      <div class="flex flex-wrap gap-2 sm:gap-3 justify-center" id="tabs">
        <button onclick="filtrarCategoria('all')" class="cat-tab active px-3 sm:px-8 py-2 sm:py-3 rounded-xl sm:rounded-2xl font-semibold border-2 border-green-600 text-green-600 text-xs sm:text-base">Todos</button>
        <button onclick="filtrarCategoria('Fertilizantes')" class="cat-tab px-3 sm:px-8 py-2 sm:py-3 rounded-xl sm:rounded-2xl font-semibold border-2 text-xs sm:text-base">Fertilizantes</button>
        <button onclick="filtrarCategoria('Foliares')" class="cat-tab px-3 sm:px-8 py-2 sm:py-3 rounded-xl sm:rounded-2xl font-semibold border-2 text-xs sm:text-base">Foliares</button>
        <button onclick="filtrarCategoria('Protección')" class="cat-tab px-3 sm:px-8 py-2 sm:py-3 rounded-xl sm:rounded-2xl font-semibold border-2 text-xs sm:text-base">Protección</button>
        <button onclick="filtrarCategoria('Herramientas')" class="cat-tab px-3 sm:px-8 py-2 sm:py-3 rounded-xl sm:rounded-2xl font-semibold border-2 text-xs sm:text-base">Herramientas</button>
        <button onclick="filtrarCategoria('Accesorios')" class="cat-tab px-3 sm:px-8 py-2 sm:py-3 rounded-xl sm:rounded-2xl font-semibold border-2 text-xs sm:text-base">Accesorios</button>
      </div>
    </div>
  </section>

  <section class="py-6 sm:py-12">
    <div class="max-w-7xl mx-auto px-3 sm:px-6">
      <div id="lista-productos" class="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 sm:gap-6 md:gap-8"></div>
    </div>
  </section>

  <!-- CARRITO -->
  <div id="cart-modal" class="hidden fixed inset-0 bg-black/70 z-[100] flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full sm:max-w-2xl rounded-t-3xl sm:rounded-3xl max-h-[92vh] sm:max-h-[90vh] flex flex-col">
      <div class="p-4 sm:p-6 border-b flex justify-between items-center">
        <h2 class="text-xl sm:text-2xl font-bold">🛒 Tu Carrito</h2>
        <button onclick="toggleCart()" class="text-3xl sm:text-4xl text-gray-400 hover:text-black leading-none">×</button>
      </div>
      <div id="cart-items" class="flex-1 overflow-auto p-4 sm:p-6 space-y-4 sm:space-y-6"></div>
      <div class="p-4 sm:p-6 border-t">
        <div class="flex justify-between text-xl sm:text-2xl font-bold mb-4 sm:mb-6">
          <span>Total:</span>
          <span id="cart-total" class="text-green-600">Q0.00</span>
        </div>
        <button onclick="abrirFormularioCheckout('stripe')" id="btn-stripe"
                class="w-full bg-blue-600 hover:bg-blue-700 py-3.5 sm:py-5 rounded-2xl text-white font-bold text-base sm:text-lg mb-2 sm:mb-3 flex items-center justify-center gap-2">
          <i class="fas fa-credit-card"></i> Pagar con Tarjeta
        </button>
        <button onclick="abrirFormularioCheckout('whatsapp')" class="w-full bg-green-600 hover:bg-green-700 py-3.5 sm:py-5 rounded-2xl text-white font-bold text-base sm:text-lg">
          <i class="fab fa-whatsapp"></i> Enviar por WhatsApp
        </button>
      </div>
    </div>
  </div>

  <!-- FORMULARIO DATOS DE CONTACTO / ENVÍO -->
  <div id="checkout-modal" class="hidden fixed inset-0 bg-black/70 z-[110] flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full sm:max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[92vh] flex flex-col">
      <div class="p-4 sm:p-5 border-b flex justify-between items-center">
        <div>
          <h2 class="text-lg sm:text-xl font-bold">Datos para envío y factura</h2>
          <p class="text-xs text-gray-500">Completa para continuar con el pedido</p>
        </div>
        <button onclick="cerrarFormularioCheckout()" class="text-3xl text-gray-400 leading-none">×</button>
      </div>
      <div class="flex-1 overflow-auto p-4 sm:p-5 space-y-3">
        <div>
          <label class="text-xs text-gray-600">Nombre completo *</label>
          <input id="ck-nombre" type="text" class="w-full p-3 border rounded-xl text-sm" placeholder="Nombre y apellido">
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="text-xs text-gray-600">Teléfono *</label>
            <input id="ck-telefono" type="tel" class="w-full p-3 border rounded-xl text-sm" placeholder="502 0000 0000">
          </div>
          <div>
            <label class="text-xs text-gray-600">NIT (factura)</label>
            <input id="ck-nit" type="text" class="w-full p-3 border rounded-xl text-sm" placeholder="CF o NIT">
          </div>
        </div>
        <div>
          <label class="text-xs text-gray-600">Correo</label>
          <input id="ck-email" type="email" class="w-full p-3 border rounded-xl text-sm" placeholder="correo@ejemplo.com">
        </div>
        <div>
          <label class="text-xs text-gray-600">Dirección de envío *</label>
          <textarea id="ck-direccion" rows="2" class="w-full p-3 border rounded-xl text-sm" placeholder="Calle, colonia, municipio, departamento"></textarea>
        </div>
        <div>
          <label class="text-xs text-gray-600">Referencia / notas</label>
          <input id="ck-referencia" type="text" class="w-full p-3 border rounded-xl text-sm" placeholder="Ej. Portón verde, llamar al llegar">
        </div>
        <p id="ck-error" class="hidden text-red-600 text-sm"></p>
      </div>
      <div class="p-4 sm:p-5 border-t">
        <button id="ck-continuar" onclick="continuarCheckout()" class="w-full py-3.5 rounded-2xl text-white font-bold bg-green-600 hover:bg-green-700">
          Continuar
        </button>
      </div>
    </div>
  </div>

  <script src="./js/firebase-config.js"></script>
  <script src="./js/catalogo.js"></script>
</body>
</html>
