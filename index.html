<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGROMAX | Catálogo Guatemala</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  
  <style>
    .hero-bg {
      background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), 
                  url('https://images.unsplash.com/photo-1625246333195-78d9c38ad449') center/cover no-repeat;
    }
    .product-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.15);
    }
    .cat-tab.active {
      background-color: #166534;
      color: white;
      border-color: #166534;
    }
  </style>
</head>
<body class="bg-gray-50">

  <!-- HEADER -->
  <header class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 bg-green-700 rounded-2xl flex items-center justify-center text-white text-3xl font-bold">🌱</div>
        <div>
          <h1 class="text-2xl font-bold text-green-700">AGROMAX</h1>
          <p class="text-xs text-green-600">Producimos con pasión, trabajamos por el futuro</p>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <button onclick="contactarWhatsApp()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-2xl font-medium flex items-center gap-2">
          <i class="fab fa-whatsapp"></i> WhatsApp
        </button>
        <button onclick="mostrarCarrito()" class="relative p-3 text-gray-700 hover:text-green-600">
          <i class="fa-solid fa-cart-shopping text-2xl"></i>
          <span id="cart-count" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero-bg h-screen flex items-center text-white">
    <div class="max-w-7xl mx-auto px-6 text-center">
      <h2 class="text-5xl md:text-6xl font-bold mb-4">Catálogo de Insumos Agrícolas</h2>
      <p class="text-2xl mb-10">Producimos con pasión, trabajamos por el futuro</p>
      <button onclick="document.getElementById('categorias').scrollIntoView({behavior:'smooth'})" 
              class="bg-green-600 hover:bg-green-700 px-12 py-6 rounded-3xl text-xl font-bold">
        Ver Catálogos
      </button>
    </div>
  </section>

  <!-- CATÁLOGOS -->
  <section id="categorias" class="py-12 bg-white">
    <div class="max-w-7xl mx-auto px-6">
      <h2 class="text-4xl font-bold text-center mb-10">Nuestros Catálogos</h2>
      
      <div class="flex flex-wrap justify-center gap-3 mb-10" id="tabs">
        <button onclick="cambiarCategoria(0)" class="cat-tab active px-8 py-4 rounded-2xl font-semibold border-2 border-green-700">Fertilizantes</button>
        <button onclick="cambiarCategoria(1)" class="cat-tab px-8 py-4 rounded-2xl font-semibold border-2 border-gray-300">Foliares</button>
        <button onclick="cambiarCategoria(2)" class="cat-tab px-8 py-4 rounded-2xl font-semibold border-2 border-gray-300">Protección</button>
        <button onclick="cambiarCategoria(3)" class="cat-tab px-8 py-4 rounded-2xl font-semibold border-2 border-gray-300">Herramientas</button>
      </div>

      <div id="catalogo-productos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
        <!-- Productos se cargan aquí -->
      </div>
    </div>
  </section>

  <!-- WhatsApp flotante -->
  <a onclick="contactarWhatsApp()" class="fixed bottom-6 right-6 bg-[#25D366] text-white w-16 h-16 rounded-full flex items-center justify-center shadow-2xl z-50 text-4xl hover:scale-110 transition-all">
    <i class="fab fa-whatsapp"></i>
  </a>

  <script>
    const whatsappNumber = "50242664744";

    let carrito = JSON.parse(localStorage.getItem('carritoAgromax')) || [];

    const catalogos = [
      // Fertilizantes
      [
        {id:101, nombre:"Urea 46-0-0", precio:245, unidad:"50 kg", img:"https://picsum.photos/id/201/400/300"},
        {id:102, nombre:"NPK 10-20-20", precio:285, unidad:"50 kg", img:"https://picsum.photos/id/237/400/300"},
        {id:103, nombre:"DAP 18-46-0", precio:320, unidad:"50 kg", img:"https://picsum.photos/id/180/400/300"},
        {id:104, nombre:"Sulfato de Amonio", precio:235, unidad:"50 kg", img:"https://picsum.photos/id/251/400/300"},
        {id:105, nombre:"Nitrato de Potasio", precio:395, unidad:"25 kg", img:"https://picsum.photos/id/870/400/300"},
        {id:106, nombre:"Triple 15", precio:265, unidad:"50 kg", img:"https://picsum.photos/id/201/400/300"}
      ],
      // Foliares
      [
        {id:201, nombre:"Foliar Calcio + Boro", precio:95, unidad:"1 L", img:"https://picsum.photos/id/237/400/300"},
        {id:202, nombre:"Foliar NPK 20-20-20", precio:85, unidad:"1 L", img:"https://picsum.photos/id/180/400/300"},
        {id:203, nombre:"Foliar Magnesio", precio:78, unidad:"1 L", img:"https://picsum.photos/id/251/400/300"},
        {id:204, nombre:"Aminoácidos + Algas", precio:115, unidad:"1 L", img:"https://picsum.photos/id/870/400/300"},
        {id:205, nombre:"Foliar Potasio", precio:92, unidad:"1 L", img:"https://picsum.photos/id/201/400/300"}
      ],
      // Protección
      [
        {id:301, nombre:"Lambda Cyhalothrin", precio:165, unidad:"1 L", img:"https://picsum.photos/id/180/400/300"},
        {id:302, nombre:"Glifosato 480 SL", precio:135, unidad:"5 L", img:"https://picsum.photos/id/201/400/300"},
        {id:303, nombre:"Mancozeb 80%", precio:125, unidad:"1 kg", img:"https://picsum.photos/id/237/400/300"},
        {id:304, nombre:"Imidacloprid", precio:195, unidad:"1 L", img:"https://picsum.photos/id/251/400/300"},
        {id:305, nombre:"Clorpirifos", precio:145, unidad:"1 L", img:"https://picsum.photos/id/870/400/300"}
      ],
      // Herramientas
      [
        {id:401, nombre:"Machete Profesional", precio:85, unidad:"1 unidad", img:"https://picsum.photos/id/180/400/300"},
        {id:402, nombre:"Aspersora Manual 20L", precio:245, unidad:"1 unidad", img:"https://picsum.photos/id/201/400/300"},
        {id:403, nombre:"Tijeras de Podar", precio:65, unidad:"1 unidad", img:"https://picsum.photos/id/237/400/300"},
        {id:404, nombre:"Guantes de Trabajo", precio:25, unidad:"Par", img:"https://picsum.photos/id/251/400/300"},
        {id:405, nombre:"Pala Ancha", precio:95, unidad:"1 unidad", img:"https://picsum.photos/id/870/400/300"}
      ]
    ];

    function actualizarContador() {
      document.getElementById('cart-count').textContent = carrito.length;
    }

    function agregarAlCarrito(producto) {
      carrito.push(producto);
      localStorage.setItem('carritoAgromax', JSON.stringify(carrito));
      actualizarContador();

      const notif = document.createElement('div');
      notif.className = "fixed bottom-24 right-6 bg-green-600 text-white px-6 py-4 rounded-2xl shadow-2xl z-50";
      notif.innerHTML = `✅ ${producto.nombre}<br><small>Añadido al carrito</small>`;
      document.body.appendChild(notif);
      setTimeout(() => notif.remove(), 2500);
    }

    function contactarWhatsApp() {
      if (carrito.length === 0) {
        window.open(`https://wa.me/${whatsappNumber}?text=Hola%20AGROMAX,%20quiero%20información`, '_blank');
        return;
      }

      let mensaje = "Hola AGROMAX, mi carrito contiene:\n\n";
      carrito.forEach(p => {
        mensaje += `- ${p.nombre} (${p.unidad}) - Q${p.precio}\n`;
      });
      mensaje += "\nPor favor cotización y disponibilidad.";

      window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(mensaje)}`, '_blank');
    }

    function mostrarCarrito() {
      contactarWhatsApp();
    }

    function cambiarCategoria(index) {
      // Activar pestaña
      document.querySelectorAll('.cat-tab').forEach((btn, i) => {
        btn.classList.toggle('active', i === index);
      });

      const grid = document.getElementById('catalogo-productos');
      grid.innerHTML = '';

      catalogos[index].forEach(p => {
        const card = document.createElement('div');
        card.className = "product-card bg-white rounded-3xl overflow-hidden border border-gray-100";
        
        card.innerHTML = `
          <img src="${p.img}" class="w-full h-48 object-cover" alt="${p.nombre}">
          <div class="p-6">
            <h3 class="font-semibold text-lg leading-tight min-h-[50px]">${p.nombre}</h3>
            <p class="text-sm text-gray-500">${p.unidad}</p>
            <p class="text-green-600 font-bold text-3xl mt-4">Q${p.precio}</p>
            
            <div class="grid grid-cols-2 gap-3 mt-8">
              <button onclick="agregarAlCarritoFromButton(${p.id}, ${index}); event.stopImmediatePropagation()" 
                      class="bg-green-600 text-white py-4 rounded-2xl text-sm font-medium hover:bg-green-700">
                Añadir al carrito
              </button>
              <button onclick="comprarRapidoFromButton(${p.id}, ${index}); event.stopImmediatePropagation()" 
                      class="border border-green-600 text-green-700 py-4 rounded-2xl text-sm font-medium hover:bg-green-50">
                Comprar ya
              </button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Funciones auxiliares para evitar problemas con objetos en onclick
    function agregarAlCarritoFromButton(id, catIndex) {
      const producto = catalogos[catIndex].find(p => p.id === id);
      if (producto) agregarAlCarrito(producto);
    }

    function comprarRapidoFromButton(id, catIndex) {
      const producto = catalogos[catIndex].find(p => p.id === id);
      if (producto) {
        const mensaje = `Quiero comprar: ${producto.nombre} (${producto.unidad}) - Q${producto.precio}`;
        window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(mensaje)}`, '_blank');
      }
    }

    // Inicializar
    window.onload = () => {
      actualizarContador();
      cambiarCategoria(0);
    };
  </script>
</body>
</html>
