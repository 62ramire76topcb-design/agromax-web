<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGROMAX PRO</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
.product-card { transition: all .3s ease; }
.product-card:hover { transform: translateY(-8px); }
</style>

</head>
<body class="bg-gray-50">

<!-- HEADER -->
<header class="bg-white shadow sticky top-0 z-50">
<div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">

<div class="flex items-center gap-3">
<img src="LOGO_AQUI" class="w-14 h-14 rounded-xl">
<div>
<h1 class="text-xl font-bold text-green-700">AGROMAX</h1>
<p class="text-xs text-gray-500">Amatitlán, Guatemala</p>
</div>
</div>

<button onclick="enviarWhatsApp()" class="bg-green-600 text-white px-5 py-2 rounded-xl">
WhatsApp
</button>

</div>
</header>

<!-- INFO -->
<section class="text-center py-6">
<p>📍 Aldea El Durazno, Amatitlán</p>
<p>📞 502 4266 4744</p>
<p class="text-green-700 font-semibold">Envíos y recolección en tienda</p>
</section>

<!-- PRODUCTOS -->
<section class="max-w-7xl mx-auto px-6 py-10">
<h2 class="text-3xl font-bold mb-6 text-center">Productos</h2>

<div id="productos" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
</section>

<!-- CARRITO -->
<div class="fixed bottom-4 right-4">
<button onclick="enviarWhatsApp()" class="bg-green-600 text-white px-6 py-4 rounded-full shadow-xl">
🛒 Enviar pedido (<span id="count">0</span>)
</button>
</div>

<script>
let productos = JSON.parse(localStorage.getItem("productosAgromax")) || [];
let carrito = [];

function render() {
const cont = document.getElementById("productos");
cont.innerHTML = "";

productos.forEach(p => {
const div = document.createElement("div");
div.className = "product-card bg-white p-4 rounded-xl shadow";

div.innerHTML = `
<h3 class="font-bold text-lg">${p.nombre}</h3>
<p class="text-sm text-gray-500">${p.descripcion || ''}</p>
<p class="text-green-600 text-2xl mt-2">Q${p.precio}</p>

${p.oferta ? '<span class="text-red-500 text-sm">🔥 Oferta</span>' : ''}

<button onclick="add(${p.id})" class="mt-4 w-full bg-green-600 text-white py-2 rounded">
Agregar
</button>
`;

cont.appendChild(div);
});
}

function add(id){
const prod = productos.find(p => p.id === id);
carrito.push(prod);
document.getElementById("count").textContent = carrito.length;
}

function enviarWhatsApp(){
let msg = "Hola AGROMAX 👨‍🌾,%0AQuiero pedir:%0A";

carrito.forEach(p=>{
msg += `- ${p.nombre} Q${p.precio}%0A`;
});

window.open(`https://wa.me/50242664744?text=${msg}`);
}

/* PANEL ADMIN */
document.addEventListener("keydown", e=>{
if(e.ctrlKey && e.shiftKey && e.key === "A"){
admin();
}
});

function admin(){
const nombre = prompt("Nombre producto");
const precio = prompt("Precio");
const desc = prompt("Descripción");
const oferta = confirm("¿Es oferta?");

const nuevo = {
id: Date.now(),
nombre,
precio,
descripcion: desc,
oferta
};

productos.push(nuevo);
localStorage.setItem("productosAgromax", JSON.stringify(productos));
render();
}

render();
</script>

</body>
</html>
