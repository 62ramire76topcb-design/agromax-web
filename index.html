<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGROMAX | Producimos con Pasión</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  
  <style>
    .hero-bg {
      background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), 
                  url('https://images.unsplash.com/photo-1625246333195-78d9c38ad449') center/cover no-repeat;
    }
    .product-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- HEADER -->
  <header class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 bg-green-700 rounded-2xl flex items-center justify-center text-white text-3xl font-bold shadow">
          🌱
        </div>
        <div>
          <h1 class="text-2xl font-bold text-green-700">AGROMAX</h1>
          <p class="text-xs text-green-600 -mt-1">Producimos con pasión, trabajamos por el futuro</p>
        </div>
      </div>
      
      <div class="flex items-center gap-4">
        <button onclick="contactarWhatsApp()" 
                class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-2xl font-medium flex items-center gap-2">
          <i class="fab fa-whatsapp text-xl"></i>
          WhatsApp
        </button>
        <button onclick="toggleCart()" class="relative p-3 text-gray-700 hover:text-green-600">
          <i class="fa-solid fa-cart-shopping text-2xl"></i>
          <span id="cart-count" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero-bg h-screen flex items-center text-white">
    <div class="max-w-7xl mx-auto px-6 text-center">
      <h2 class="text-5xl md:text-6xl font-bold mb-4 leading-tight">
        Insumos agrícolas<br>de alta calidad
      </h2>
      <p class="text-2xl mb-10">Producimos con pasión, trabajamos por el futuro</p>
      
      <div class="flex flex-col sm:flex-row gap-4 justify-center">
        <button onclick="document.getElementById('productos').scrollIntoView({behavior:'smooth'})" 
                class="bg-green-600 hover:bg-green-700 px-10 py-5 rounded-2xl text-xl font-semibold">
          Explorar Productos
        </button>
        <button onclick="contactarWhatsApp()" 
                class="bg-[#25D366] hover:bg-[#128C7E] px-10 py-5 rounded-2xl text-xl font-semibold flex items-center gap-2">
          <i class="fab fa-whatsapp text-2xl"></i>
          Pedir por WhatsApp
        </button>
      </div>
    </div>
  </section>

  <!-- PRODUCTOS DESTACADOS -->
  <section id="productos" class="py-16 bg-gray-50">
    <div class="max-w-7xl mx-auto px-6">
      <h2 class="text-4xl font-bold text-center mb-12">Productos Destacados</h2>
      
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8" id="productos-grid">
        <!-- Se llenan con JavaScript -->
      </div>
    </div>
  </section>

  <!-- WhatsApp flotante -->
  <a href="#" onclick="contactarWhatsApp()" 
     class="fixed bottom-6 right-6 bg-[#25D366] text-white w-16 h-16 rounded-full flex items-center justify-center shadow-2xl z-50 text-4xl hover:scale-110 transition-transform">
    <i class="fab fa-whatsapp"></i>
  </a>

  <script>
    // === CONFIGURA AQUÍ TU NÚMERO DE WHATSAPP ===
    const whatsappNumber = "50242664744";   // ←←← CAMBIA ESTE NÚMERO por el tuyo real

    let carrito = [];

    const productos = [
      {
        id: 1,
        nombre: "Fertilizante Urea 46-0-0",
        precio: 89000,
        img: "https://picsum.photos/id/201/400/300"
      },
      {
        id: 2,
        nombre: "Foliar Calcio + Boro 1L",
        precio: 65000,
        img: "https://picsum.photos/id/237/400/300"
      },
      {
        id: 3,
        nombre: "Insecticida Lambda Cyhalothrin",
        precio: 125000,
        img: "https://picsum.photos/id/180/400/300"
      },
      {
        id: 4,
        nombre: "Herbicida Glifosato 480",
        precio: 95000,
        img: "https://picsum.photos/id/251/400/300"
      }
    ];

    function actualizarContador() {
      document.getElementById('cart-count').textContent = carrito.length;
    }

    function agregarAlCarrito(id) {
      const producto = productos.find(p => p.id === id);
      carrito.push(producto);
      actualizarContador();

      const notif = document.createElement('div');
      notif.className = "fixed bottom-24 right-6 bg-green-600 text-white px-6 py-4 rounded-2xl shadow-xl z-50";
      notif.innerHTML = `✅ ${producto.nombre}<br><small>Añadido al carrito</small>`;
      document.body.appendChild(notif);
      setTimeout(() => notif.remove(), 2500);
    }

    function contactarWhatsApp() {
      let mensaje = "Hola AGROMAX, quiero información sobre insumos agrícolas.";
      if (carrito.length > 0) {
        mensaje = "Hola AGROMAX, mi carrito contiene:\n";
        carrito.forEach(p => {
          mensaje += `- ${p.nombre} - $${p.precio.toLocaleString('es-CO')}\n`;
        });
      }
      window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(mensaje)}`, '_blank');
    }

    function toggleCart() {
      if (carrito.length === 0) {
        alert("🛒 Tu carrito está vacío");
        return;
      }
      contactarWhatsApp(); // Envía el carrito por WhatsApp
    }

    // Renderizar productos
    function renderProductos() {
      const grid = document.getElementById('productos-grid');
      grid.innerHTML = '';

      productos.forEach(p => {
        const card = document.createElement('div');
        card.className = "product-card bg-white rounded-3xl overflow-hidden border border-gray-100";
        card.innerHTML = `
          <img src="${p.img}" class="w-full h-56 object-cover">
          <div class="p-6">
            <h3 class="font-semibold text-lg">${p.nombre}</h3>
            <p class="text-green-600 font-bold text-3xl mt-4">$${p.precio.toLocaleString('es-CO')}</p>
            <div class="grid grid-cols-2 gap-3 mt-8">
              <button onclick="agregarAlCarrito(${p.id}); event.stopImmediatePropagation()" 
                      class="bg-green-600 text-white py-4 rounded-2xl text-sm font-medium">
                Añadir al carrito
              </button>
              <button onclick="comprarRapido(${p.id}); event.stopImmediatePropagation()" 
                      class="border border-green-600 text-green-700 py-4 rounded-2xl text-sm font-medium">
                Comprar rápido
              </button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function comprarRapido(id) {
      const producto = productos.find(p => p.id === id);
      const mensaje = `Quiero comprar: ${producto.nombre} - $${producto.precio.toLocaleString('es-CO')}`;
      window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(mensaje)}`, '_blank');
    }

    // Inicializar
    window.onload = () => {
      renderProductos();
      actualizarContador();
    };
  </script>
</body>
</html>
