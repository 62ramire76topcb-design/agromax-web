<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGROMAXGTM | Catálogo Guatemala</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-50">
  <!-- ... (Mantengo el header, hero, filtros y estructura anterior) ... -->

  <script>
    const whatsappNumber = "50242664744";
    let allProductos = [];
    let carrito = JSON.parse(localStorage.getItem('carritoAGROMAXGTM')) || [];

    const firebaseConfig = { /* tu config */ };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ... (mantengo funciones de carrito, agregar, toggleCart, mostrarCarrito, cambiarCantidad, etc.)

    async function enviarPedidoWhatsApp() {
      if (carrito.length === 0) return;

      let mensaje = "Hola AGROMAXGTM, este es mi pedido:\n\n";
      let total = 0;
      const productosPedido = [];

      carrito.forEach(item => {
        const subtotal = item.precio * item.cantidad;
        mensaje += `• ${item.nombre} × ${item.cantidad} = Q${subtotal}\n`;
        total += subtotal;
        productosPedido.push({nombre: item.nombre, cantidad: item.cantidad, precio: item.precio});
      });

      mensaje += `\nTotal: Q${total.toFixed(2)}`;

      // GUARDAR PEDIDO EN FIREBASE
      try {
        await db.collection('pedidos').add({
          cliente: "Cliente WhatsApp",
          productos: productosPedido,
          total: total,
          fecha: new Date(),
          estado: "Pendiente"
        });
        console.log("Pedido guardado en Firebase");
      } catch (e) {
        console.error("Error guardando pedido:", e);
      }

      window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(mensaje)}`, '_blank');
      
      carrito = [];
      localStorage.setItem('carritoAGROMAXGTM', JSON.stringify(carrito));
      actualizarContador();
      toggleCart();
    }

    // ... resto del código (renderProductos, onload, etc.)
  </script>
</body>
</html>
