<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGROMAX | Catálogo Guatemala</title>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  
  <style>
    .hero-bg { background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('https://images.unsplash.com/photo-1625246333195-78d9c38ad449') center/cover no-repeat; }
    .product-card:hover { transform: translateY(-10px); box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.15); }
    .cat-tab.active { background-color: #166534; color: white; border-color: #166534; }
    .product-img { height: 190px; object-fit: cover; }
  </style>
</head>
<body class="bg-gray-50">

  <div id="app">
    <!-- El contenido se cargará dinámicamente -->
  </div>

  <script>
    // ==================== CONFIGURACIÓN FIREBASE ====================
    const firebaseConfig = {
      apiKey: "AIzaSyAEj22gE5UySwWVwIec6jpBiZ2nb1OBftM",
      authDomain: "agromaxgt-app.firebaseapp.com",
      projectId: "agromaxgt-app",
      storageBucket: "agromaxgt-app.firebasestorage.app",
      messagingSenderId: "648144313047",
      appId: "1:648144313047:web:118a67464d99f2d0462e92"
    };

    // Inicializar Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();

    let currentUser = null;

    // ==================== FUNCIONES BÁSICAS ====================
    function mostrarLogin() {
      document.getElementById('app').innerHTML = `
        <div class="min-h-screen flex items-center justify-center bg-gray-100">
          <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md">
            <h2 class="text-3xl font-bold text-center mb-8">Panel AGROMAX</h2>
            <input id="email" type="email" placeholder="Correo electrónico" class="w-full p-4 border rounded-2xl mb-4">
            <input id="password" type="password" placeholder="Contraseña" class="w-full p-4 border rounded-2xl mb-6">
            <button onclick="login()" class="w-full bg-green-600 text-white py-4 rounded-2xl font-semibold">Iniciar Sesión</button>
            <p class="text-center text-sm text-gray-500 mt-6">Usuario: tuemail@gmail.com</p>
          </div>
        </div>
      `;
    }

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      try {
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        currentUser = userCredential.user;
        mostrarPanelAdmin();
      } catch (error) {
        alert("Error: " + error.message);
      }
    }

    function mostrarPanelAdmin() {
      document.getElementById('app').innerHTML = `
        <div class="p-6">
          <h1 class="text-3xl font-bold">Panel de Administrador</h1>
          <p class="text-green-600">Bienvenido, ${currentUser.email}</p>
          <button onclick="logout()" class="mt-4 text-red-600">Cerrar Sesión</button>
          <p class="mt-8 text-lg">Funcionalidad de agregar productos en desarrollo...</p>
        </div>
      `;
    }

    function logout() {
      auth.signOut();
      mostrarLogin();
    }

    // Inicializar
    window.onload = () => {
      auth.onAuthStateChanged(user => {
        if (user) {
          currentUser = user;
          mostrarPanelAdmin();
        } else {
          mostrarLogin();
        }
      });
    };
  </script>
</body>
</html>
