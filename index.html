<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGROMAX | Catálogo Guatemala</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  
  <style>
    .hero-bg { background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('https://images.unsplash.com/photo-1625246333195-78d9c38ad449') center/cover no-repeat; }
    .product-card:hover { transform: translateY(-10px); box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.15); }
    .cat-tab.active { background-color: #166534; color: white; border-color: #166534; }
    .product-img { height: 190px; object-fit: cover; background-color: #f3f4f6; }
  </style>
</head>
<body class="bg-gray-50">

  <!-- HEADER y HERO se mantienen igual (omitidos por brevedad) -->

  <!-- NAVEGACIÓN DE CATÁLOGOS -->
  <section id="categorias" class="py-12 bg-white">
    <div class="max-w-7xl mx-auto px-6">
      <h2 class="text-4xl font-bold text-center mb-10">Nuestros Catálogos</h2>
      
      <div class="flex flex-wrap justify-center gap-3 mb-12" id="tabs">
        <button onclick="cambiarCategoria(0)" class="cat-tab px-6 py-3 rounded-2xl font-semibold border-2 border-gray-300">Fertilizantes</button>
        <button onclick="cambiarCategoria(1)" class="cat-tab px-6 py-3 rounded-2xl font-semibold border-2 border-gray-300">Foliares</button>
        <button onclick="cambiarCategoria(2)" class="cat-tab px-6 py-3 rounded-2xl font-semibold border-2 border-gray-300">Protección</button>
        <button onclick="cambiarCategoria(3)" class="cat-tab px-6 py-3 rounded-2xl font-semibold border-2 border-gray-300">Herramientas</button>
        <button onclick="cambiarCategoria(4)" class="cat-tab active px-6 py-3 rounded-2xl font-semibold border-2 border-green-700">Accesorios de Trabajo</button>
      </div>

      <div id="catalogo-productos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></div>
    </div>
  </section>

  <script>
    const whatsappNumber = "50242664744";
    let carrito = JSON.parse(localStorage.getItem('carritoAgromax')) || [];

    const catalogos = [
      // ... (mantengo las otras 4 categorías cortas para no alargar)
      Array(8).fill(0).map((_, i) => ({id:100+i, nombre:"Urea 46-0-0", precio:245, unidad:"50 kg", img:"https://picsum.photos/id/201/600/400"})),
      Array(8).fill(0).map((_, i) => ({id:200+i, nombre:"Foliar Calcio + Boro", precio:95, unidad:"1 L", img:"https://picsum.photos/id/237/600/400"})),
      Array(8).fill(0).map((_, i) => ({id:300+i, nombre:"Lambda Cyhalothrin", precio:165, unidad:"1 L", img:"https://picsum.photos/id/180/600/400"})),
      Array(8).fill(0).map((_, i) => ({id:400+i, nombre:"Machete Profesional", precio:85, unidad:"1 unidad", img:"https://picsum.photos/id/251/600/400"})),
      
      // 4 - ACCESORIOS DE TRABAJO (Mejorado)
      [
        {id:501, nombre:"Gorra de Trabajo Azul", precio:65, unidad:"1 unidad", img:"images/IMG_1247.jpeg"},
        {id:502, nombre:"Gorra de Trabajo Negra", precio:65, unidad:"1 unidad", img:"images/IMG_1248.jpeg"},
        {id:503, nombre:"Gorra de Trabajo Verde", precio:65, unidad:"1 unidad", img:"images/IMG_1249.jpeg"},
        {id:504, nombre:"Gorra de Trabajo Gris", precio:65, unidad:"1 unidad", img:"images/IMG_1250.jpeg"},
        {id:505, nombre:"Gorra de Trabajo con Visera", precio:75, unidad:"1 unidad", img:"images/IMG_1251.jpeg"},
        {id:506, nombre:"Camiseta de Trabajo", precio:95, unidad:"1 unidad", img:"https://picsum.photos/id/201/600/400"},
        {id:507, nombre:"Chaleco Reflectivo", precio:145, unidad:"1 unidad", img:"https://picsum.photos/id/237/600/400"},
        {id:508, nombre:"Cinturón de Herramientas", precio:85, unidad:"1 unidad", img:"https://picsum.photos/id/180/600/400"},
        {id:509, nombre:"Rodilleras de Protección", precio:120, unidad:"Par", img:"https://picsum.photos/id/251/600/400"},
        {id:510, nombre:"Casco de Seguridad", precio:185, unidad:"1 unidad", img:"https://picsum.photos/id/870/600/400"}
      ]
    ];

    // (El resto del script se mantiene igual al anterior)

    function actualizarContador() { /* ... */ }
    function agregarAlCarrito(producto, cantidad = 1) { /* ... */ }
    function contactarWhatsApp() { /* ... */ }
    function mostrarCarrito() { contactarWhatsApp(); }

    function cambiarCategoria(index) {
      document.querySelectorAll('.cat-tab').forEach((btn, i) => btn.classList.toggle('active', i === index));
      const grid = document.getElementById('catalogo-productos');
      grid.innerHTML = '';

      catalogos[index].forEach(p => {
        const card = document.createElement('div');
        card.className = "product-card bg-white rounded-3xl overflow-hidden border border-gray-100";
        card.innerHTML = `
          <img src="${p.img}" class="product-img w-full" alt="${p.nombre}">
          <div class="p-6">
            <h3 class="font-semibold text-lg">${p.nombre}</h3>
            <p class="text-sm text-gray-500">${p.unidad}</p>
            <p class="text-green-600 font-bold text-3xl mt-4">Q${p.precio}</p>
            
            <div class="flex items-center gap-3 mt-6 mb-4">
              <button onclick="cambiarCantidad(this, -1)" class="w-8 h-8 border rounded-lg flex items-center justify-center text-lg font-bold">-</button>
              <span class="cantidad text-xl font-semibold w-8 text-center">1</span>
              <button onclick="cambiarCantidad(this, 1)" class="w-8 h-8 border rounded-lg flex items-center justify-center text-lg font-bold">+</button>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <button onclick="agregarDesdeCard(this)" class="bg-green-600 text-white py-4 rounded-2xl text-sm font-medium">Añadir</button>
              <button onclick="comprarRapido(this)" class="border border-green-600 text-green-700 py-4 rounded-2xl text-sm font-medium">Comprar ya</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Funciones de cantidad y carrito (mantener las mismas del código anterior)
    function cambiarCantidad(btn, cambio) {
      const span = btn.parentElement.querySelector('.cantidad');
      let qty = parseInt(span.textContent);
      qty = Math.max(1, qty + cambio);
      span.textContent = qty;
    }

    function agregarDesdeCard(btn) {
      const card = btn.closest('.product-card');
      const nombre = card.querySelector('h3').textContent;
      const cantidad = parseInt(card.querySelector('.cantidad').textContent);
      const producto = { nombre, precio: 0, unidad: "1 unidad" };
      agregarAlCarrito(producto, cantidad);
    }

    function comprarRapido(btn) {
      const card = btn.closest('.product-card');
      const nombre = card.querySelector('h3').textContent;
      const cantidad = parseInt(card.querySelector('.cantidad').textContent);
      const mensaje = `Quiero comprar ${cantidad} unidades de: ${nombre}`;
      window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(mensaje)}`, '_blank');
    }

    window.onload = () => {
      actualizarContador();
      cambiarCategoria(4); // Abre directamente en Accesorios de Trabajo
    };
  </script>
</body>
</html>
