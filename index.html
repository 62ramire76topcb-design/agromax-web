<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGROMAXGTM | Catálogo Guatemala</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-50">

  <!-- HEADER -->
  <header class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 bg-green-700 rounded-2xl flex items-center justify-center text-white text-3xl font-bold">🌱</div>
        <div>
          <h1 class="text-2xl font-bold text-green-700">AGROMAXGTM</h1>
          <p class="text-xs text-green-600">Producimos con pasión, trabajamos por el futuro</p>
        </div>
      </div>
      
      <div class="flex items-center gap-4">
        <button onclick="toggleCart()" class="relative flex items-center gap-2 bg-gray-100 hover:bg-gray-200 px-6 py-3 rounded-2xl font-medium transition">
          <i class="fas fa-shopping-cart text-2xl"></i>
          <span id="cart-count" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold w-6 h-6 flex items-center justify-center rounded-full">0</span>
          Carrito
        </button>
        <button onclick="contactarWhatsApp()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-2xl font-medium flex items-center gap-2">
          <i class="fab fa-whatsapp text-xl"></i> WhatsApp
        </button>
      </div>
    </div>
  </header>

  <!-- HERO + BUSCADOR -->
  <section class="bg-gradient-to-br from-green-700 to-green-800 text-white py-16">
    <div class="max-w-7xl mx-auto px-6 text-center">
      <h2 class="text-5xl font-bold mb-4">Catálogo de Insumos Agrícolas</h2>
      <div class="max-w-2xl mx-auto mt-8">
        <input id="buscador" type="text" placeholder="Buscar productos..." 
               class="w-full pl-14 pr-6 py-5 rounded-3xl text-lg focus:outline-none text-gray-900"
               onkeyup="filtrarProductos()">
      </div>
    </div>
  </section>

  <!-- FILTROS -->
  <section class="py-8 bg-white border-b">
    <div class="max-w-7xl mx-auto px-6">
      <div class="flex flex-wrap gap-3 justify-center" id="tabs">
        <button onclick="filtrarCategoria('all')" class="cat-tab active px-8 py-3 rounded-2xl font-semibold border-2 border-green-600 text-green-600">Todos</button>
        <button onclick="filtrarCategoria('Fertilizantes')" class="cat-tab px-8 py-3 rounded-2xl font-semibold border-2">Fertilizantes</button>
        <button onclick="filtrarCategoria('Foliares')" class="cat-tab px-8 py-3 rounded-2xl font-semibold border-2">Foliares</button>
        <button onclick="filtrarCategoria('Protección')" class="cat-tab px-8 py-3 rounded-2xl font-semibold border-2">Protección</button>
        <button onclick="filtrarCategoria('Herramientas')" class="cat-tab px-8 py-3 rounded-2xl font-semibold border-2">Herramientas</button>
        <button onclick="filtrarCategoria('Accesorios')" class="cat-tab px-8 py-3 rounded-2xl font-semibold border-2">Accesorios</button>
      </div>
    </div>
  </section>

  <!-- PRODUCTOS -->
  <section class="py-12">
    <div class="max-w-7xl mx-auto px-6">
      <div id="lista-productos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></div>
    </div>
  </section>

  <!-- CARRITO MODAL -->
  <div id="cart-modal" class="hidden fixed inset-0 bg-black/70 z-[100] flex items-center justify-center">
    <div class="bg-white w-full max-w-2xl rounded-3xl max-h-[90vh] flex flex-col">
      <div class="p-6 border-b flex justify-between items-center">
        <h2 class="text-2xl font-bold">🛒 Tu Carrito</h2>
        <button onclick="toggleCart()" class="text-4xl text-gray-400 hover:text-black">×</button>
      </div>
      <div id="cart-items" class="flex-1 overflow-auto p-6 space-y-6"></div>
      <div class="p-6 border-t">
        <div class="flex justify-between text-2xl font-bold mb-6">
          <span>Total:</span>
          <span id="cart-total" class="text-green-600">Q0.00</span>
        </div>
        <button onclick="enviarPedidoWhatsApp()" class="w-full bg-green-600 hover:bg-green-700 py-5 rounded-2xl text-white font-bold text-lg">
          Enviar Pedido por WhatsApp
        </button>
      </div>
    </div>
  </div>

  <script>
    const whatsappNumber = "50242664744";
    let allProductos = [];
    let carrito = JSON.parse(localStorage.getItem('carritoAGROMAXGTM')) || [];

    const firebaseConfig = {
      apiKey: "AIzaSyAEj22gE5UySwWVwIec6jpBiZ2nb1OBftM",
      authDomain: "agromaxgt-app.firebaseapp.com",
      projectId: "agromaxgt-app",
      storageBucket: "agromaxgt-app.firebasestorage.app",
      messagingSenderId: "648144313047",
      appId: "1:648144313047:web:118a67464d99f2d0462e92"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function actualizarContador() {
      const total = carrito.reduce((sum, item) => sum + item.cantidad, 0);
      document.getElementById('cart-count').textContent = total;
    }

    function agregarAlCarrito(index) {
      const producto = allProductos[index];
      const existente = carrito.find(item => item.nombre === producto.nombre);
      
      if (existente) {
        existente.cantidad++;
      } else {
        carrito.push({ ...producto, cantidad: 1 });
      }

      localStorage.setItem('carritoAGROMAXGTM', JSON.stringify(carrito));
      actualizarContador();
      alert(`✅ ${producto.nombre} agregado al carrito`);
    }

    function toggleCart() {
      const modal = document.getElementById('cart-modal');
      modal.classList.toggle('hidden');
      if (!modal.classList.contains('hidden')) mostrarCarrito();
    }

    function mostrarCarrito() {
      const container = document.getElementById('cart-items');
      let html = '';
      let total = 0;

      carrito.forEach((item, index) => {
        const subtotal = item.precio * item.cantidad;
        total += subtotal;
        html += `
          <div class="flex gap-4 border-b pb-6">
            <img src="${item.imageUrl || 'https://picsum.photos/id/201/600/400'}" class="w-24 h-24 object-cover rounded-2xl">
            <div class="flex-1">
              <h4 class="font-bold">${item.nombre}</h4>
              <p class="text-green-600">Q${item.precio} × ${item.cantidad}</p>
            </div>
            <div class="text-right">
              <p class="font-bold">Q${subtotal}</p>
              <div class="flex gap-3 mt-4">
                <button onclick="cambiarCantidad(${index}, -1)" class="px-3 py-1 border rounded">-</button>
                <span class="px-3">${item.cantidad}</span>
                <button onclick="cambiarCantidad(${index}, 1)" class="px-3 py-1 border rounded">+</button>
              </div>
            </div>
          </div>`;
      });

      container.innerHTML = html || `<p class="text-center py-16 text-gray-400">El carrito está vacío</p>`;
      document.getElementById('cart-total').textContent = `Q${total.toFixed(2)}`;
    }

    function cambiarCantidad(index, delta) {
      carrito[index].cantidad += delta;
      if (carrito[index].cantidad < 1) carrito.splice(index, 1);
      localStorage.setItem('carritoAGROMAXGTM', JSON.stringify(carrito));
      mostrarCarrito();
      actualizarContador();
    }

    function enviarPedidoWhatsApp() {
      if (carrito.length === 0) return;
      let mensaje = "Hola AGROMAXGTM, este es mi pedido:\n\n";
      let total = 0;

      carrito.forEach(item => {
        const subtotal = item.precio * item.cantidad;
        mensaje += `• ${item.nombre} × ${item.cantidad} = Q${subtotal}\n`;
        total += subtotal;
      });

      mensaje += `\nTotal: Q${total.toFixed(2)}`;

      window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(mensaje)}`, '_blank');
      
      carrito = [];
      localStorage.setItem('carritoAGROMAXGTM', JSON.stringify(carrito));
      actualizarContador();
      toggleCart();
    }

    function contactarWhatsApp(nombre = '') {
      const msg = nombre ? `Hola, quiero información sobre: ${nombre}` : 'Hola AGROMAXGTM, quiero más información';
      window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    // Filtros y renderizado
    function filtrarCategoria(cat) {
      document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
      event.currentTarget.classList.add('active');
      renderProductos(cat);
    }

    function filtrarProductos() {
      renderProductos('all', document.getElementById('buscador').value.toLowerCase().trim());
    }

    function renderProductos(categoria = 'all', busqueda = '') {
      const grid = document.getElementById('lista-productos');
      grid.innerHTML = '';

      let filtered = allProductos;

      if (categoria !== 'all') filtered = filtered.filter(p => p.categoria === categoria);
      if (busqueda) filtered = filtered.filter(p => p.nombre.toLowerCase().includes(busqueda));

      if (filtered.length === 0) {
        grid.innerHTML = `<p class="col-span-full text-center py-20 text-gray-500">No se encontraron productos</p>`;
        return;
      }

      filtered.forEach((p, index) => {
        const globalIndex = allProductos.findIndex(prod => prod.nombre === p.nombre);
        const card = document.createElement('div');
        card.className = "bg-white rounded-3xl overflow-hidden shadow hover:shadow-2xl transition-all";
        card.innerHTML = `
          <img src="${p.imageUrl || 'https://picsum.photos/id/201/600/400'}" class="w-full h-52 object-cover">
          <div class="p-6">
            <span class="text-xs bg-green-100 text-green-700 px-3 py-1 rounded-full">${p.categoria}</span>
            <h3 class="font-bold text-xl mt-3 mb-1">${p.nombre}</h3>
            <p class="text-sm text-gray-500 mb-4">${p.unidad || ''}</p>
            <p class="text-3xl font-extrabold text-green-600">Q${Number(p.precio).toLocaleString('es-GT')}</p>
            
            <div class="mt-6 flex gap-3">
              <button onclick="agregarAlCarrito(${globalIndex})" class="flex-1 bg-green-600 text-white py-4 rounded-2xl font-medium">
                Agregar al Carrito
              </button>
              <button onclick="contactarWhatsApp('${p.nombre}')" class="flex-1 border border-green-600 text-green-600 py-4 rounded-2xl font-medium">
                Consultar
              </button>
            </div>
          </div>`;
        grid.appendChild(card);
      });
    }

    window.onload = () => {
      db.collection('productos').orderBy('fecha', 'desc').onSnapshot(snapshot => {
        allProductos = [];
        snapshot.forEach(doc => allProductos.push(doc.data()));
        renderProductos('all');
      });
      actualizarContador();
    };
  </script>
</body>
</html>
