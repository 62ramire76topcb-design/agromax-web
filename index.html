<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGROMAX | Producimos con Pasión</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  
  <style>
    .hero-bg {
      background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), 
                  url('https://images.unsplash.com/photo-1625246333195-78d9c38ad449') center/cover no-repeat;
    }
    .product-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- HEADER -->
  <header class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 bg-green-700 rounded-2xl flex items-center justify-center text-white text-3xl font-bold shadow">
          🌱
        </div>
        <div>
          <h1 class="text-2xl font-bold text-green-700">AGROMAX</h1>
          <p class="text-xs text-green-600 -mt-1">Producimos con pasión, trabajamos por el futuro</p>
        </div>
      </div>
      
      <div class="flex items-center gap-4">
        <button onclick="contactarWhatsApp()" 
                class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-2xl font-medium flex items-center gap-2">
          <i class="fab fa-whatsapp text-xl"></i>
          WhatsApp
        </button>
        <button onclick="toggleCart()" class="relative p-3 text-gray-700">
          <i class="fa-solid fa-cart-shopping text-2xl"></i>
          <span id="cart-count" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero-bg h-screen flex items-center text-white">
    <div class="max-w-7xl mx-auto px-6 text-center">
      <h2 class="text-5xl md:text-6xl font-bold mb-4 leading-tight">
        Insumos agrícolas<br>de alta calidad
      </h2>
      <p class="text-2xl mb-10">Producimos con pasión, trabajamos por el futuro</p>
      
      <div class="flex flex-col sm:flex-row gap-4 justify-center">
        <button onclick="document.getElementById('productos').scrollIntoView({behavior:'smooth'})" 
                class="bg-green-600 hover:bg-green-700 px-10 py-5 rounded-2xl text-xl font-semibold">
          Explorar Productos
        </button>
        <button onclick="contactarWhatsApp()" 
                class="bg-[#25D366] hover:bg-[#128C7E] px-10 py-5 rounded-2xl text-xl font-semibold flex items-center gap-2">
          <i class="fab fa-whatsapp text-2xl"></i>
          Pedir por WhatsApp
        </button>
      </div>
    </div>
  </section>

  <script>
    function contactarWhatsApp() {
      window.open('https://wa.me/573123456789?text=Hola%20AGROMAX,%20quiero%20información%20sobre%20insumos', '_blank');
    }

    function toggleCart() {
      alert("🛒 Carrito de compras (en desarrollo)");
    }
  </script>
</body>
</html>
