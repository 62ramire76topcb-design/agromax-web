    // ==================== PEDIDOS (CORREGIDO) ====================
    async function mostrarPedidos() {
      const content = document.getElementById('main-content');
      content.innerHTML = `
        <h1 class="text-3xl font-bold mb-8">📋 Pedidos Recibidos</h1>
        <div id="lista-pedidos" class="space-y-6"></div>`;

      try {
        const snapshot = await db.collection('pedidos').orderBy('fecha', 'desc').get();
        let html = '';

        if (snapshot.empty) {
          html = `<p class="text-center py-20 text-gray-400">Aún no hay pedidos registrados</p>`;
        } else {
          snapshot.forEach(doc => {
            const pedido = doc.data();
            html += `
              <div class="bg-white rounded-3xl shadow p-6">
                <div class="flex justify-between">
                  <div>
                    <p class="text-sm text-gray-500">${pedido.fecha.toDate().toLocaleString('es-GT')}</p>
                    <p class="font-bold">${pedido.cliente || 'Cliente vía WhatsApp'}</p>
                  </div>
                  <span class="px-4 py-1 bg-green-100 text-green-700 rounded-full text-sm font-medium">${pedido.estado || 'Pendiente'}</span>
                </div>
                <div class="mt-4">
                  ${pedido.productos.map(item => `
                    <div class="flex justify-between text-sm py-1">
                      <span>${item.nombre} × ${item.cantidad}</span>
                      <span>Q${(item.precio * item.cantidad).toFixed(2)}</span>
                    </div>
                  `).join('')}
                </div>
                <div class="mt-6 pt-4 border-t flex justify-between font-bold text-lg">
                  <span>Total:</span>
                  <span class="text-green-600">Q${pedido.total.toFixed(2)}</span>
                </div>
              </div>`;
          });
        }
        document.getElementById('lista-pedidos').innerHTML = html;
      } catch (e) {
        document.getElementById('lista-pedidos').innerHTML = `<p class="text-red-500">Error al cargar pedidos: ${e.message}</p>`;
      }
    }

    function logout() {
      if (confirm("¿Cerrar sesión?")) {
        auth.signOut().then(() => mostrarLogin());
      }
    }

    window.onload = () => {
      auth.onAuthStateChanged(user => {
        if (user) mostrarPanelPrincipal();
        else mostrarLogin();
      });
