<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGROMAX - Panel Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <!-- reCAPTCHA Enterprise v3 -->
  <script src="https://www.google.com/recaptcha/enterprise.js?render=6Leb7tQuTAAAAMNRBiZjmhq41UbzpolFRE2SCeGX"></script>
  <!-- Asegúrate de pegar tu "site key" completa y sin espacio -->
</head>
<body class="bg-gray-100">
  <div id="app" class="min-h-screen"></div>
  <script>
    // Firebase Configuración
    const firebaseConfig = {
      apiKey: "AIzaSyAEj22gE5UySwWVwIec6jpBiZ2nb1OBftM",
      authDomain: "agromaxgt-app.firebaseapp.com",
      projectId: "agromaxgt-app",
      storageBucket: "agromaxgt-app.firebasestorage.app",
      messagingSenderId: "648144313047",
      appId: "1:648144313047:web:118a67464d99f2d0462e92"
    };
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    function mostrarLogin() {
      document.getElementById('app').innerHTML = `
        <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-green-50 to-green-100">
          <div class="bg-white p-10 rounded-3xl shadow-2xl max-w-md w-full">
            <div class="flex justify-center mb-6">
              <div class="w-20 h-20 bg-green-700 rounded-3xl flex items-center justify-center text-white text-6xl">🌱</div>
            </div>
            <h1 class="text-3xl font-bold text-center mb-2 text-gray-800">AGROMAX</h1>
            <p class="text-center text-green-600 mb-8 font-medium">Panel de Administración</p>
            <input id="email" type="email" placeholder="Correo del administrador" autocomplete="username" class="w-full p-4 border border-gray-300 rounded-2xl mb-4 focus:outline-none focus:border-green-600">
            <input id="password" type="password" placeholder="Contraseña" autocomplete="current-password" class="w-full p-4 border border-gray-300 rounded-2xl mb-6 focus:outline-none focus:border-green-600">
            <button onclick="login()" class="w-full bg-green-600 hover:bg-green-700 text-white py-4 rounded-2xl font-bold text-lg transition-all">Ingresar al Panel</button>
            <div id="login-error" class="mt-6 text-red-600 text-sm text-center"></div>
          </div>
        </div>`;
    }

    function login() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('login-error');
      errorDiv.textContent = "";
      if (!email || !password) {
        errorDiv.textContent = "Por favor completa todos los campos.";
        return;
      }
      // Ejecutar reCAPTCHA Enterprise antes del login
      grecaptcha.enterprise.ready(async () => {
        try {
          const token = await grecaptcha.enterprise.execute('6Leb7tQuTAAAAMNRBiZm hq41UbzpolFRE2SCeGX', {action: 'login'});
          // Puedes enviar este token a un backend para validación avanzada si quieres.
          // Aquí, solo ejecutamos el login si reCAPTCHA responde:
          firebase.auth().signInWithEmailAndPassword(email, password)
            .then(() => {
              mostrarPanelPrincipal();
            })
            .catch((error) => {
              errorDiv.textContent = error.message;
            });
        } catch (err) {
          errorDiv.textContent = "Error al verificar reCAPTCHA. Intenta de nuevo. " + err.message;
        }
      });
    }

    // El resto del panel (dashboard, productos, etc.) va igual, solo cambia la función de login.

    window.onload = mostrarLogin;
  </script>
</body>
</html>
