<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGROMAX - Panel Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">

  <div class="flex h-screen">
    <!-- Sidebar -->
    <div class="w-72 bg-white shadow-xl">
      <div class="p-6 border-b">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-green-700 rounded-2xl flex items-center justify-center text-white text-2xl">🌱</div>
          <div>
            <h1 class="text-2xl font-bold text-green-700">AGROMAX</h1>
            <p class="text-xs text-gray-500">Administración</p>
          </div>
        </div>
      </div>
      <nav class="p-4">
        <a href="#" onclick="mostrarSeccion('dashboard')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 text-gray-700 active">
          <i class="fas fa-home"></i> Dashboard
        </a>
        <a href="#" onclick="mostrarSeccion('agregar')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 text-gray-700">
          <i class="fas fa-plus"></i> Agregar Producto
        </a>
        <a href="#" onclick="mostrarSeccion('editar')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 text-gray-700">
          <i class="fas fa-edit"></i> Editar Productos
        </a>
        <a href="#" onclick="mostrarSeccion('imagenes')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 text-gray-700">
          <i class="fas fa-images"></i> Gestionar Imágenes
        </a>
        <a href="#" onclick="mostrarSeccion('pedidos')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 text-gray-700">
          <i class="fas fa-bell"></i> Ver Pedidos WhatsApp
        </a>
        <a href="#" onclick="logout()" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-red-50 text-red-600 mt-8">
          <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
        </a>
      </nav>
    </div>

    <!-- Contenido Principal -->
    <div class="flex-1 overflow-auto" id="main-content">
      <!-- Se cargará dinámicamente -->
    </div>
  </div>

  <script>
    function mostrarSeccion(seccion) {
      let html = '';

      if (seccion === 'dashboard') {
        html = `
          <div class="p-8">
            <h1 class="text-3xl font-bold mb-8">Dashboard</h1>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
              <div class="bg-white p-6 rounded-3xl shadow">Total Productos<br><span class="text-4xl font-bold">48</span></div>
              <div class="bg-white p-6 rounded-3xl shadow">Pedidos Hoy<br><span class="text-4xl font-bold text-green-600">12</span></div>
              <div class="bg-white p-6 rounded-3xl shadow">Stock Bajo<br><span class="text-4xl font-bold text-orange-600">7</span></div>
              <div class="bg-white p-6 rounded-3xl shadow">Categorías<br><span class="text-4xl font-bold">5</span></div>
            </div>
          </div>`;
      } else if (seccion === 'agregar') {
        html = `Formulario para agregar producto (en desarrollo)`;
      } else if (seccion === 'editar') {
        html = `Lista de productos para editar (en desarrollo)`;
      } else if (seccion === 'imagenes') {
        html = `Gestión de imágenes (en desarrollo)`;
      } else if (seccion === 'pedidos') {
        html = `Pedidos de WhatsApp (en desarrollo)`;
      }

      document.getElementById('main-content').innerHTML = html;
    }

    function logout() {
      alert("Sesión cerrada");
      window.location.href = "index.html";
    }

    // Iniciar en Dashboard
    window.onload = () => mostrarSeccion('dashboard');
  </script>
</body>
</html>
