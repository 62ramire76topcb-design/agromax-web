<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGROMAXGTM - Panel Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
</head>
<body class="bg-gray-100">

  <div id="app" class="min-h-screen"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAEj22gE5UySwWVwIec6jpBiZ2nb1OBftM",
      authDomain: "agromaxgt-app.firebaseapp.com",
      projectId: "agromaxgt-app",
      storageBucket: "agromaxgt-app.firebasestorage.app",
      messagingSenderId: "648144313047",
      appId: "1:648144313047:web:118a67464d99f2d0462e92"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();

    let productoEditandoId = null;
    let productosCSV = [];

    function mostrarLogin() {
      document.getElementById('app').innerHTML = `
        <div class="min-h-screen flex items-center justify-center bg-gray-100">
          <div class="bg-white p-10 rounded-3xl shadow-2xl max-w-md w-full">
            <div class="flex justify-center mb-6">
              <div class="w-20 h-20 bg-green-700 rounded-3xl flex items-center justify-center text-white text-6xl">🌱</div>
            </div>
            <h1 class="text-3xl font-bold text-center mb-2">AGROMAXGTM</h1>
            <p class="text-center text-green-600 mb-8">Panel de Administración</p>
            
            <input id="email" type="email" value="62ramire76topcb@gmail.com" class="w-full p-4 border rounded-2xl mb-4">
            <input id="password" type="password" value="Maycol123@" class="w-full p-4 border rounded-2xl mb-6">
            
            <button onclick="login()" class="w-full bg-green-600 hover:bg-green-700 text-white py-4 rounded-2xl font-bold text-lg">
              Ingresar al Panel
            </button>
          </div>
        </div>`;
    }

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      try {
        await auth.signInWithEmailAndPassword(email, password);
        mostrarPanelPrincipal();
      } catch (e) {
        alert("Error: " + e.message);
      }
    }

    function mostrarPanelPrincipal() {
      document.getElementById('app').innerHTML = `
        <div class="flex h-screen">
          <div class="w-72 bg-white border-r shadow-xl">
            <div class="p-6 border-b bg-green-700 text-white">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white rounded-2xl flex items-center justify-center text-green-700 text-3xl">🌱</div>
                <div>
                  <h1 class="text-2xl font-bold">AGROMAXGTM</h1>
                  <p class="text-xs">Administración</p>
                </div>
              </div>
            </div>
            <nav class="p-4 space-y-1">
              <a onclick="mostrarSeccion('dashboard')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-home"></i> Dashboard</a>
              <a onclick="mostrarSeccion('agregar')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-plus"></i> Agregar Producto</a>
              <a onclick="mostrarSeccion('masiva')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-file-csv"></i> Subida Masiva</a>
              <a onclick="mostrarSeccion('productos')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-list"></i> Ver Productos</a>
              <a onclick="logout()" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-red-50 text-red-600 mt-12"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
            </nav>
          </div>
          <div class="flex-1 overflow-auto p-8" id="main-content"></div>
        </div>`;
      mostrarSeccion('dashboard');
    }

    function mostrarSeccion(seccion) {
      const content = document.getElementById('main-content');
      if (seccion === 'dashboard') mostrarDashboard();
      else if (seccion === 'agregar') {
        productoEditandoId = null;
        mostrarFormularioAgregar();
      }
      else if (seccion === 'masiva') mostrarSubidaMasiva();
      else if (seccion === 'productos') mostrarTablaProductos();
    }

    // ==================== DASHBOARD ====================
    async function mostrarDashboard() {
      const content = document.getElementById('main-content');
      content.innerHTML = `
        <h1 class="text-4xl font-bold text-green-700 mb-8">Dashboard - AGROMAXGTM</h1>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-10" id="stats-cards"></div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
          <div class="bg-white rounded-3xl shadow p-6">
            <h3 class="text-xl font-bold mb-4">Últimos Productos</h3>
            <div id="ultimos-productos" class="space-y-4"></div>
          </div>
          <div class="bg-white rounded-3xl shadow p-6">
            <h3 class="text-xl font-bold mb-4">Productos por Categoría</h3>
            <div id="resumen-categorias" class="space-y-4"></div>
          </div>
        </div>`;

      const snapshot = await db.collection('productos').get();
      let productos = [];
      snapshot.forEach(doc => productos.push({id: doc.id, ...doc.data()}));

      const total = productos.length;
      const valorTotal = productos.reduce((sum, p) => sum + (p.precio || 0), 0);
      const categorias = [...new Set(productos.map(p => p.categoria))].length;

      document.getElementById('stats-cards').innerHTML = `
        <div class="bg-white p-6 rounded-3xl shadow"><p class="text-gray-500">Total Productos</p><p class="text-5xl font-bold text-green-600">${total}</p></div>
        <div class="bg-white p-6 rounded-3xl shadow"><p class="text-gray-500">Valor Total</p><p class="text-5xl font-bold text-blue-600">Q${valorTotal.toLocaleString('es-GT')}</p></div>
        <div class="bg-white p-6 rounded-3xl shadow"><p class="text-gray-500">Categorías</p><p class="text-5xl font-bold text-purple-600">${categorias}</p></div>
        <div class="bg-white p-6 rounded-3xl shadow"><p class="text-gray-500">Último Agregado</p><p class="text-xl font-semibold">${productos[0] ? productos[0].nombre : 'Ninguno'}</p></div>
      `;

      let ultHTML = '';
      productos.slice(0, 5).forEach(p => {
        ultHTML += `<div class="flex justify-between py-2 border-b"><span>${p.nombre}</span><span class="font-bold">Q${p.precio}</span></div>`;
      });
      document.getElementById('ultimos-productos').innerHTML = ultHTML || '<p class="text-gray-400">No hay productos</p>';

      const porCat = productos.reduce((acc, p) => { acc[p.categoria] = (acc[p.categoria] || 0) + 1; return acc; }, {});
      let catHTML = '';
      Object.entries(porCat).forEach(([cat, cant]) => {
        catHTML += `<div class="flex justify-between"><span>${cat}</span><span class="bg-green-100 px-4 py-1 rounded-full text-green-700 font-bold">${cant}</span></div>`;
      });
      document.getElementById('resumen-categorias').innerHTML = catHTML;
    }

    // ==================== FORMULARIO AGREGAR / EDITAR ====================
    function mostrarFormularioAgregar(producto = null) {
      productoEditandoId = producto ? producto.id : null;
      const titulo = producto ? "Editar Producto" : "Agregar Nuevo Producto";
      const btnText = producto ? "Actualizar Producto" : "Guardar Producto";

      document.getElementById('main-content').innerHTML = `
        <h1 class="text-3xl font-bold mb-8">${titulo}</h1>
        <div class="max-w-2xl bg-white p-8 rounded-3xl shadow">
          <input id="nombre" value="${producto ? producto.nombre : ''}" placeholder="Nombre del producto" class="w-full p-4 border rounded-2xl mb-4">
          <input id="precio" type="number" value="${producto ? producto.precio : ''}" placeholder="Precio en Quetzales" class="w-full p-4 border rounded-2xl mb-4">
          <input id="unidad" value="${producto ? producto.unidad : ''}" placeholder="Unidad (ej: 50 kg)" class="w-full p-4 border rounded-2xl mb-4">
          <select id="categoria" class="w-full p-4 border rounded-2xl mb-6">
            <option ${producto && producto.categoria === 'Fertilizantes' ? 'selected' : ''}>Fertilizantes</option>
            <option ${producto && producto.categoria === 'Foliares' ? 'selected' : ''}>Foliares</option>
            <option ${producto && producto.categoria === 'Protección' ? 'selected' : ''}>Protección</option>
            <option ${producto && producto.categoria === 'Herramientas' ? 'selected' : ''}>Herramientas</option>
            <option ${producto && producto.categoria === 'Accesorios' ? 'selected' : ''}>Accesorios</option>
          </select>
          <input id="imagen" type="file" accept="image/*" class="w-full p-4 border rounded-2xl mb-6">
          <button onclick="guardarProducto()" class="w-full bg-green-600 text-white py-4 rounded-2xl font-bold">${btnText}</button>
        </div>`;
    }

    async function guardarProducto() {
      const nombre = document.getElementById('nombre').value.trim();
      const precio = parseFloat(document.getElementById('precio').value);
      if (!nombre || !precio) return alert("❌ Faltan campos obligatorios");

      try {
        let imageUrl = "https://picsum.photos/id/201/600/400";
        const file = document.getElementById('imagen').files[0];
        if (file) {
          const ref = storage.ref('productos/' + Date.now() + '_' + file.name);
          await ref.put(file);
          imageUrl = await ref.getDownloadURL();
        }

        const data = {
          nombre, precio, unidad: document.getElementById('unidad').value,
          categoria: document.getElementById('categoria').value, imageUrl, fecha: new Date()
        };

        if (productoEditandoId) {
          await db.collection('productos').doc(productoEditandoId).update(data);
          alert("✅ Producto actualizado correctamente");
        } else {
          await db.collection('productos').add(data);
          alert("✅ Producto guardado correctamente");
        }
        mostrarSeccion('productos');
      } catch (e) {
        alert("Error: " + e.message);
      }
    }

    // ==================== TABLA DE PRODUCTOS ====================
    function mostrarTablaProductos() {
      const content = document.getElementById('main-content');
      content.innerHTML = `<h1 class="text-3xl font-bold mb-6">Productos Registrados</h1><div id="tabla-productos" class="bg-white rounded-3xl shadow overflow-hidden"></div>`;

      db.collection('productos').orderBy('fecha', 'desc').onSnapshot(snapshot => {
        let html = `<table class="w-full"><thead><tr class="bg-gray-100"><th class="p-4 text-left">Producto</th><th class="p-4 text-left">Categoría</th><th class="p-4 text-right">Precio</th><th class="p-4">Acciones</th></tr></thead><tbody>`;

        snapshot.forEach(doc => {
          const p = doc.data();
          html += `<tr class="border-t hover:bg-gray-50">
            <td class="p-4 font-medium">${p.nombre}</td>
            <td class="p-4">${p.categoria || ''}</td>
            <td class="p-4 text-right font-bold text-green-600">Q${p.precio}</td>
            <td class="p-4">
              <button onclick="editarProducto('${doc.id}')" class="text-blue-600 hover:underline mx-3">Editar</button>
              <button onclick="eliminarProducto('${doc.id}')" class="text-red-600 hover:underline">Eliminar</button>
            </td>
          </tr>`;
        });
        html += `</tbody></table>`;
        document.getElementById('tabla-productos').innerHTML = html;
      });
    }

    async function editarProducto(id) {
      const doc = await db.collection('productos').doc(id).get();
      const producto = doc.data();
      producto.id = id;
      mostrarFormularioAgregar(producto);
    }

    async function eliminarProducto(id) {
      if (confirm("¿Eliminar este producto permanentemente?")) {
        await db.collection('productos').doc(id).delete();
      }
    }

    // ==================== SUBIDA MASIVA ====================
    function mostrarSubidaMasiva() {
      document.getElementById('main-content').innerHTML = `
        <h1 class="text-3xl font-bold mb-8">Subida Masiva de Productos (CSV)</h1>
        <div class="max-w-2xl bg-white p-8 rounded-3xl shadow">
          <div class="border-2 border-dashed border-gray-300 rounded-2xl p-12 text-center mb-6">
            <i class="fas fa-file-csv text-6xl text-green-500 mb-4"></i>
            <p class="font-medium">Selecciona un archivo CSV</p>
            <input id="csvFile" type="file" accept=".csv" class="hidden" onchange="previsualizarCSV()">
            <button onclick="document.getElementById('csvFile').click()" class="mt-4 bg-green-600 text-white px-8 py-3 rounded-2xl">
              Seleccionar Archivo CSV
            </button>
          </div>
          <div id="preview-csv" class="hidden"></div>
          <button id="btn-subir-masivo" onclick="subirProductosMasivos()" class="hidden w-full bg-green-600 text-white py-4 rounded-2xl font-bold">Subir Todos los Productos</button>
        </div>
        <p class="text-center text-sm text-gray-500 mt-6">Formato recomendado: nombre,precio,unidad,categoria</p>
      `;
    }

    function previsualizarCSV() {
      const file = document.getElementById('csvFile').files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const lines = e.target.result.split('\n');
        productosCSV = [];
        let previewHTML = `<h3 class="font-bold mb-3">Vista previa (${lines.length-1} productos)</h3><table class="w-full text-sm"><thead><tr class="bg-gray-100"><th class="p-2">Nombre</th><th>Precio</th><th>Unidad</th><th>Categoría</th></tr></thead><tbody>`;

        for (let i = 1; i < lines.length; i++) {
          if (!lines[i].trim()) continue;
          const [nombre, precio, unidad, categoria] = lines[i].split(',').map(s => s.trim());
          if (nombre && precio) {
            productosCSV.push({nombre, precio: parseFloat(precio), unidad: unidad || '1 unidad', categoria: categoria || 'Sin categoría'});
            previewHTML += `<tr><td class="p-2">${nombre}</td><td>Q${precio}</td><td>${unidad||''}</td><td>${categoria||''}</td></tr>`;
          }
        }
        previewHTML += `</tbody></table>`;
        document.getElementById('preview-csv').innerHTML = previewHTML;
        document.getElementById('preview-csv').classList.remove('hidden');
        document.getElementById('btn-subir-masivo').classList.remove('hidden');
      };
      reader.readAsText(file);
    }

    async function subirProductosMasivos() {
      if (confirm(`¿Subir ${productosCSV.length} productos?`)) {
        let exitosos = 0;
        for (let p of productosCSV) {
          try {
            await db.collection('productos').add({
              nombre: p.nombre,
              precio: p.precio,
              unidad: p.unidad,
              categoria: p.categoria,
              imageUrl: 'https://picsum.photos/id/201/600/400',
              fecha: new Date()
            });
            exitosos++;
          } catch (e) {}
        }
        alert(`✅ ${exitosos} productos subidos correctamente`);
        mostrarSeccion('productos');
      }
    }

    function logout() {
      if (confirm("¿Cerrar sesión?")) {
        auth.signOut().then(() => mostrarLogin());
      }
    }

    window.onload = () => {
      auth.onAuthStateChanged(user => {
        if (user) mostrarPanelPrincipal();
        else mostrarLogin();
      });
    };
  </script>
</body>
</html>
