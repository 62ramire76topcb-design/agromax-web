<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGROMAX - Panel Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body class="bg-gray-100">

  <div class="flex h-screen">
    <!-- Sidebar -->
    <div class="w-72 bg-white border-r shadow-xl">
      <div class="p-6 border-b bg-green-700 text-white">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-white rounded-2xl flex items-center justify-center text-green-700 text-3xl">🌱</div>
          <div>
            <h1 class="text-2xl font-bold">AGROMAX</h1>
            <p class="text-xs opacity-90">Administración</p>
          </div>
        </div>
      </div>
      <nav class="p-4 space-y-1">
        <a onclick="mostrarSeccion('dashboard')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-home"></i> Dashboard</a>
        <a onclick="mostrarSeccion('agregar')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer bg-green-50"><i class="fas fa-plus"></i> Agregar Producto</a>
        <a onclick="mostrarSeccion('productos')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-edit"></i> Editar Productos</a>
        <a onclick="mostrarSeccion('imagenes')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-images"></i> Gestionar Imágenes</a>
        <a onclick="mostrarSeccion('pedidos')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-bell"></i> Ver Pedidos WhatsApp</a>
        <a onclick="logout()" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-red-50 text-red-600 mt-12"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
      </nav>
    </div>

    <!-- Main Content -->
    <div class="flex-1 overflow-auto" id="main-content">
      <!-- Se carga dinámicamente -->
    </div>
  </div>

  <script>
    function mostrarSeccion(seccion) {
      const content = document.getElementById('main-content');
      
      if (seccion === 'agregar') {
        content.innerHTML = `
          <div class="p-8">
            <h1 class="text-3xl font-bold mb-8">Agregar Nuevo Producto</h1>
            <div class="bg-white rounded-3xl shadow p-8 max-w-2xl">
              <div class="grid grid-cols-2 gap-6">
                <div>
                  <label class="block text-sm font-medium mb-2">Nombre del Producto</label>
                  <input id="nombre" class="w-full p-4 border rounded-2xl" placeholder="Ej: Fertilizante Orgánico">
                </div>
                <div>
                  <label class="block text-sm font-medium mb-2">Precio</label>
                  <input id="precio" type="number" class="w-full p-4 border rounded-2xl" placeholder="Ej: 50">
                </div>
              </div>
              <div class="mt-6">
                <label class="block text-sm font-medium mb-2">Stock</label>
                <input id="stock" type="number" class="w-full p-4 border rounded-2xl" placeholder="Ej: 100">
              </div>
              <div class="mt-6">
                <label class="block text-sm font-medium mb-2">Categoría</label>
                <select id="categoria" class="w-full p-4 border rounded-2xl">
                  <option>Fertilizantes</option>
                  <option>Foliares</option>
                  <option>Protección</option>
                  <option>Herramientas</option>
                  <option>Accesorios</option>
                </select>
              </div>
              <div class="mt-6">
                <label class="block text-sm font-medium mb-2">Descripción</label>
                <textarea id="descripcion" class="w-full p-4 border rounded-2xl h-24"></textarea>
              </div>
              <div class="mt-6">
                <label class="block text-sm font-medium mb-2">Imagen del Producto</label>
                <input id="imagen" type="file" accept="image/*" class="w-full p-4 border rounded-2xl">
              </div>
              <div class="mt-8 flex gap-4">
                <button onclick="guardarProducto()" class="flex-1 bg-green-600 text-white py-4 rounded-2xl font-bold">Guardar Producto</button>
                <button onclick="mostrarSeccion('productos')" class="flex-1 border py-4 rounded-2xl">Cancelar</button>
              </div>
            </div>
          </div>`;
      } else if (seccion === 'productos') {
        content.innerHTML = `<h1 class="text-3xl font-bold p-8">Productos Registrados (Tabla en desarrollo)</h1>`;
      } else {
        content.innerHTML = `<h1 class="text-3xl font-bold p-8">Sección: ${seccion}</h1>`;
      }
    }

    function guardarProducto() {
      const nombre = document.getElementById('nombre').value;
      if (nombre) {
        alert(`✅ Producto "${nombre}" guardado correctamente`);
        mostrarSeccion('productos');
      } else {
        alert("Ingresa el nombre del producto");
      }
    }

    function logout() {
      if (confirm("¿Cerrar sesión?")) {
        window.location.reload();
      }
    }

    // Iniciar
    window.onload = () => mostrarSeccion('agregar');
  </script>
</body>
</html>
