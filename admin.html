<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGROMAX - Panel Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body class="bg-gray-100">

  <div class="flex h-screen">
    <!-- Sidebar -->
    <div class="w-72 bg-white border-r shadow-xl">
      <div class="p-6 border-b">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-green-700 rounded-2xl flex items-center justify-center text-white text-2xl">🌱</div>
          <div>
            <h1 class="text-2xl font-bold text-green-700">AGROMAX</h1>
            <p class="text-xs text-gray-500">Administración</p>
          </div>
        </div>
      </div>
      <nav class="p-4 space-y-1">
        <a onclick="mostrarSeccion('dashboard')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-home"></i> Dashboard</a>
        <a onclick="mostrarSeccion('agregar')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-plus"></i> Agregar Producto</a>
        <a onclick="mostrarSeccion('productos')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-list"></i> Ver Productos</a>
        <a onclick="mostrarSeccion('pedidos')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-bell"></i> Pedidos WhatsApp</a>
        <a onclick="logout()" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-red-50 text-red-600 mt-8"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
      </nav>
    </div>

    <!-- Contenido -->
    <div class="flex-1 overflow-auto p-8" id="main-content"></div>
  </div>

  <script>
    function mostrarSeccion(seccion) {
      const content = document.getElementById('main-content');
      
      if (seccion === 'dashboard') {
        content.innerHTML = `<h1 class="text-4xl font-bold">Dashboard</h1><p class="mt-6 text-gray-600">Bienvenido al Panel de Administración</p>`;
      } 
      else if (seccion === 'agregar') {
        content.innerHTML = `
          <h1 class="text-3xl font-bold mb-6">Agregar Nuevo Producto</h1>
          <div class="max-w-xl bg-white p-8 rounded-3xl shadow">
            <input id="nombre" placeholder="Nombre del producto" class="w-full p-4 border rounded-2xl mb-4">
            <input id="precio" type="number" placeholder="Precio en Quetzales" class="w-full p-4 border rounded-2xl mb-4">
            <input id="unidad" placeholder="Unidad (ej: 50 kg)" class="w-full p-4 border rounded-2xl mb-4">
            <select id="categoria" class="w-full p-4 border rounded-2xl mb-6">
              <option>Fertilizantes</option>
              <option>Foliares</option>
              <option>Protección</option>
              <option>Herramientas</option>
              <option>Accesorios</option>
            </select>
            <input id="imagen" type="file" accept="image/*" class="w-full p-4 border rounded-2xl mb-6">
            <button onclick="guardarProducto()" class="w-full bg-green-600 text-white py-4 rounded-2xl font-bold">Guardar Producto</button>
          </div>`;
      } 
      else if (seccion === 'productos') {
        content.innerHTML = `<h1 class="text-3xl font-bold mb-6">Productos Registrados</h1><p class="text-gray-500">Lista de productos (en desarrollo)</p>`;
      } 
      else if (seccion === 'pedidos') {
        content.innerHTML = `<h1 class="text-3xl font-bold mb-6">Pedidos WhatsApp</h1><p class="text-gray-500">Próximamente...</p>`;
      }
    }

    function guardarProducto() {
      const nombre = document.getElementById('nombre').value;
      if (nombre) {
        alert(`✅ Producto "${nombre}" guardado (simulado)`);
      } else {
        alert("Por favor ingresa un nombre");
      }
    }

    function logout() {
      if (confirm("¿Cerrar sesión?")) {
        window.location.reload();
      }
    }

    // Cargar Dashboard al iniciar
    window.onload = () => mostrarSeccion('dashboard');
  </script>
</body>
</html>
