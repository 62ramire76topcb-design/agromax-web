<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGROMAX - Panel Admin</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body class="bg-gray-100">

  <div class="flex h-screen">
    <!-- Sidebar -->
    <div class="w-72 bg-white border-r shadow-xl overflow-y-auto">
      <div class="p-6 border-b">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-green-700 rounded-2xl flex items-center justify-center text-white text-2xl">🌱</div>
          <div>
            <h1 class="text-2xl font-bold text-green-700">AGROMAX</h1>
            <p class="text-xs text-gray-500">Administración</p>
          </div>
        </div>
      </div>
      <nav class="p-4 space-y-1">
        <a onclick="mostrarSeccion('dashboard')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-home"></i> Dashboard</a>
        <a onclick="mostrarSeccion('agregar')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-plus"></i> Agregar Producto</a>
        <a onclick="mostrarSeccion('productos')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-list"></i> Ver Productos</a>
        <a onclick="mostrarSeccion('pedidos')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-bell"></i> Pedidos WhatsApp</a>
        <a onclick="logout()" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-red-50 text-red-600 mt-8"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
      </nav>
    </div>

    <!-- Contenido Principal -->
    <div class="flex-1 overflow-auto p-8" id="main-content">
      <div class="flex items-center justify-center h-full">
        <p class="text-gray-500">Cargando panel...</p>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAEj22gE5UySwWVwIec6jpBiZ2nb1OBftM",
      authDomain: "agromaxgt-app.firebaseapp.com",
      projectId: "agromaxgt-app",
      storageBucket: "agromaxgt-app.firebasestorage.app",
      messagingSenderId: "648144313047",
      appId: "1:648144313047:web:118a67464d99f2d0462e92"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();

    function mostrarSeccion(seccion) {
      const content = document.getElementById('main-content');
      let html = `<div class="text-center py-12"><p class="text-xl">Cargando ${seccion}...</p></div>`;

      if (seccion === 'dashboard') {
        html = `<h1 class="text-4xl font-bold">Dashboard</h1><p class="mt-4">Bienvenido al Panel de AGROMAX</p>`;
      } else if (seccion === 'agregar') {
        html = `
          <h1 class="text-3xl font-bold mb-6">Agregar Nuevo Producto</h1>
          <div class="max-w-xl bg-white p-8 rounded-3xl shadow">
            <input id="nombre" placeholder="Nombre del producto" class="w-full p-4 border rounded-2xl mb-4">
            <input id="precio" type="number" placeholder="Precio (Q)" class="w-full p-4 border rounded-2xl mb-4">
            <input id="unidad" placeholder="Unidad (ej: 50 kg)" class="w-full p-4 border rounded-2xl mb-4">
            <select id="categoria" class="w-full p-4 border rounded-2xl mb-6">
              <option>Fertilizantes</option><option>Foliares</option><option>Protección</option><option>Herramientas</option><option>Accesorios</option>
            </select>
            <input id="imagen" type="file" accept="image/*" class="w-full p-4 border rounded-2xl mb-6">
            <button onclick="guardarProducto()" class="w-full bg-green-600 text-white py-4 rounded-2xl font-bold">Guardar Producto</button>
          </div>`;
      } else if (seccion === 'productos') {
        html = `<h1 class="text-3xl font-bold mb-6">Productos Registrados</h1><div id="lista-productos" class="grid grid-cols-1 gap-6"></div>`;
        setTimeout(cargarProductos, 100);
      }

      content.innerHTML = html;
    }

    async function guardarProducto() {
      // ... (misma función anterior)
      alert("Producto guardado (función básica)");
      mostrarSeccion('productos');
    }

    async function cargarProductos() {
      const container = document.getElementById('lista-productos');
      if (!container) return;
      container.innerHTML = "<p>Cargando productos...</p>";
      // Aquí iría la consulta real a Firestore
    }

    function logout() {
      auth.signOut().then(() => window.location.reload());
    }

    // Iniciar
    window.onload = () => {
      auth.onAuthStateChanged(user => {
        if (user) {
          mostrarSeccion('dashboard');
        } else {
          // Mostrar login si no está autenticado
          document.getElementById('main-content').innerHTML = `
            <div class="min-h-screen flex items-center justify-center">
              <div class="bg-white p-8 rounded-3xl shadow max-w-md w-full">
                <h1 class="text-3xl font-bold text-center mb-8">Iniciar Sesión</h1>
                <input id="email" type="email" placeholder="Correo" class="w-full p-4 border rounded-2xl mb-4">
                <input id="password" type="password" placeholder="Contraseña" class="w-full p-4 border rounded-2xl mb-6">
                <button onclick="login()" class="w-full bg-green-600 text-white py-4 rounded-2xl">Entrar</button>
              </div>
            </div>`;
        }
      });
    };

    async function login() {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      try {
        await auth.signInWithEmailAndPassword(email, pass);
        mostrarSeccion('dashboard');
      } catch(e) {
        alert("Error: " + e.message);
      }
    };
  </script>
</body>
</html>
