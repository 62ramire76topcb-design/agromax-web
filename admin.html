<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGROMAX | Catálogo Guatemala</title>
  
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body class="bg-gray-50">

  <!-- HEADER -->
  <header class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 bg-green-700 rounded-2xl flex items-center justify-center text-white text-3xl font-bold">🌱</div>
        <div>
          <h1 class="text-2xl font-bold text-green-700">AGROMAX</h1>
          <p class="text-xs text-green-600">Producimos con pasión, trabajamos por el futuro</p>
        </div>
      </div>
      <button onclick="contactarWhatsApp()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-2xl font-medium flex items-center gap-2">
        <i class="fab fa-whatsapp"></i> WhatsApp
      </button>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero-bg h-screen flex items-center text-white">
    <div class="max-w-7xl mx-auto px-6 text-center">
      <h2 class="text-5xl md:text-6xl font-bold mb-4">Catálogo de Insumos Agrícolas</h2>
      <p class="text-2xl mb-10">Producimos con pasión, trabajamos por el futuro</p>
      <button onclick="document.getElementById('categorias').scrollIntoView({behavior:'smooth'})" 
              class="bg-green-600 hover:bg-green-700 px-12 py-6 rounded-3xl text-xl font-bold">
        Ver Catálogos
      </button>
    </div>
  </section>

  <!-- CATÁLOGOS DINÁMICOS -->
  <section id="categorias" class="py-12 bg-white">
    <div class="max-w-7xl mx-auto px-6">
      <h2 class="text-4xl font-bold text-center mb-10">Nuestros Catálogos</h2>
      
      <div id="catalogo-productos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></div>
    </div>
  </section>

  <script>
    const whatsappNumber = "50242664744";

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyAEj22gE5UySwWVwIec6jpBiZ2nb1OBftM",
      authDomain: "agromaxgt-app.firebaseapp.com",
      projectId: "agromaxgt-app",
      storageBucket: "agromaxgt-app.firebasestorage.app",
      messagingSenderId: "648144313047",
      appId: "1:648144313047:web:118a67464d99f2d0462e92"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function cargarProductos() {
      const grid = document.getElementById('catalogo-productos');
      grid.innerHTML = '<p class="col-span-full text-center py-12">Cargando productos...</p>';

      try {
        const snapshot = await db.collection('productos').orderBy('fecha', 'desc').get();
        
        grid.innerHTML = '';

        if (snapshot.empty) {
          grid.innerHTML = '<p class="col-span-full text-center py-12 text-gray-500">No hay productos aún. Agrega desde el panel admin.</p>';
          return;
        }

        snapshot.forEach(doc => {
          const p = doc.data();
          const card = document.createElement('div');
          card.className = "product-card bg-white rounded-3xl overflow-hidden border border-gray-100";
          card.innerHTML = `
            <img src="${p.imageUrl || 'https://picsum.photos/id/201/600/400'}" class="w-full h-48 object-cover">
            <div class="p-6">
              <h3 class="font-semibold text-lg">${p.nombre}</h3>
              <p class="text-sm text-gray-500">${p.unidad}</p>
              <p class="text-green-600 font-bold text-3xl mt-4">Q${p.precio}</p>
              <button onclick="contactarWhatsApp('${p.nombre}')" 
                      class="mt-6 w-full bg-green-600 text-white py-4 rounded-2xl text-sm font-medium">
                Pedir por WhatsApp
              </button>
            </div>
          `;
          grid.appendChild(card);
        });
      } catch(e) {
        console.error(e);
        grid.innerHTML = '<p class="col-span-full text-center text-red-500">Error al cargar productos</p>';
      }
    }

    function contactarWhatsApp(nombre) {
      const mensaje = `Quiero información sobre: ${nombre}`;
      window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(mensaje)}`, '_blank');
    }

    window.onload = cargarProductos;
  </script>
</body>
</html>
