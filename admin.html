<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGROMAXGTM - Panel Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100">

  <div id="app" class="min-h-screen"></div>

  <script>
    // Firebase Config
    const firebaseConfig = { /* tu config completa */ };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ... (mantengo todas las funciones anteriores: login, panel, dashboard, formulario, tabla, subida masiva)

    function mostrarSeccion(seccion) {
      const content = document.getElementById('main-content');
      if (seccion === 'dashboard') mostrarDashboard();
      else if (seccion === 'agregar') mostrarFormularioAgregar();
      else if (seccion === 'masiva') mostrarSubidaMasiva();
      else if (seccion === 'pedidos') mostrarPedidos();
      else if (seccion === 'productos') mostrarTablaProductos();
    }

    // ==================== PEDIDOS EN TIEMPO REAL ====================
    function mostrarPedidos() {
      const content = document.getElementById('main-content');
      content.innerHTML = `
        <h1 class="text-3xl font-bold mb-8">📋 Pedidos Recibidos</h1>
        <div id="lista-pedidos" class="space-y-6"></div>`;

      // Escucha en tiempo real
      db.collection('pedidos').orderBy('fecha', 'desc').onSnapshot(snapshot => {
        let html = '';

        if (snapshot.empty) {
          html = `<p class="text-center py-20 text-gray-400">Aún no hay pedidos</p>`;
        } else {
          snapshot.forEach(doc => {
            const p = doc.data();
            html += `
              <div class="bg-white rounded-3xl shadow p-6">
                <div class="flex justify-between">
                  <div>
                    <p class="text-sm text-gray-500">${p.fecha.toDate().toLocaleString('es-GT')}</p>
                    <p class="font-bold">${p.cliente || 'Cliente WhatsApp'}</p>
                  </div>
                  <span class="px-4 py-1 bg-green-100 text-green-700 rounded-full text-sm font-medium">${p.estado || 'Pendiente'}</span>
                </div>
                <div class="mt-4 space-y-1 text-sm">
                  ${p.productos.map(item => `
                    <div class="flex justify-between">
                      <span>${item.nombre} × ${item.cantidad}</span>
                      <span>Q${(item.precio * item.cantidad).toFixed(2)}</span>
                    </div>
                  `).join('')}
                </div>
                <div class="mt-6 pt-4 border-t flex justify-between font-bold">
                  <span>Total:</span>
                  <span class="text-green-600">Q${p.total.toFixed(2)}</span>
                </div>
              </div>`;
          });
        }
        document.getElementById('lista-pedidos').innerHTML = html;
      });
    }

    // ... resto de funciones (logout, etc.)
  </script>
</body>
</html>
