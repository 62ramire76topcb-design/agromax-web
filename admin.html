<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGROMAX - Panel Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
</head>
<body class="bg-gray-100">

  <div id="app" class="min-h-screen"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAEj22gE5UySwWVwIec6jpBiZ2nb1OBftM",
      authDomain: "agromaxgt-app.firebaseapp.com",
      projectId: "agromaxgt-app",
      storageBucket: "agromaxgt-app.firebasestorage.app",
      messagingSenderId: "648144313047",
      appId: "1:648144313047:web:118a67464d99f2d0462e92"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();

    function mostrarLogin() {
      document.getElementById('app').innerHTML = `
        <div class="min-h-screen flex items-center justify-center bg-gray-100">
          <div class="bg-white p-10 rounded-3xl shadow-2xl max-w-md w-full">
            <div class="flex justify-center mb-6">
              <div class="w-20 h-20 bg-green-700 rounded-3xl flex items-center justify-center text-white text-6xl">🌱</div>
            </div>
            <h1 class="text-3xl font-bold text-center mb-2">AGROMAX</h1>
            <p class="text-center text-green-600 mb-8">Panel de Administración</p>
            
            <input id="email" type="email" value="62ramire76topcb@gmail.com" class="w-full p-4 border rounded-2xl mb-4">
            <input id="password" type="password" value="Maycol123@" class="w-full p-4 border rounded-2xl mb-6">
            
            <button onclick="login()" class="w-full bg-green-600 hover:bg-green-700 text-white py-4 rounded-2xl font-bold text-lg">
              Ingresar al Panel
            </button>
          </div>
        </div>`;
    }

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      try {
        await auth.signInWithEmailAndPassword(email, password);
        alert("✅ Bienvenido al Panel");
        mostrarPanelPrincipal();
      } catch (e) {
        alert("Error: " + e.message);
      }
    }

    function mostrarPanelPrincipal() {
      document.getElementById('app').innerHTML = `
        <div class="flex h-screen">
          <div class="w-72 bg-white border-r shadow-xl">
            <div class="p-6 border-b bg-green-700 text-white">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white rounded-2xl flex items-center justify-center text-green-700 text-3xl">🌱</div>
                <div>
                  <h1 class="text-2xl font-bold">AGROMAX</h1>
                  <p class="text-xs">Administración</p>
                </div>
              </div>
            </div>
            <nav class="p-4 space-y-1">
              <a onclick="mostrarSeccion('dashboard')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-home"></i> Dashboard</a>
              <a onclick="mostrarSeccion('agregar')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-plus"></i> Agregar Producto</a>
              <a onclick="mostrarSeccion('productos')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-list"></i> Ver Productos</a>
              <a onclick="logout()" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-red-50 text-red-600 mt-12"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
            </nav>
          </div>
          <div class="flex-1 overflow-auto p-8" id="main-content"></div>
        </div>`;
      mostrarSeccion('dashboard');
    }

    function mostrarSeccion(seccion) {
      const content = document.getElementById('main-content');
      if (seccion === 'dashboard') {
        content.innerHTML = `<h1 class="text-4xl font-bold">Dashboard</h1>`;
      } else if (seccion === 'agregar') {
        mostrarFormularioAgregar();
      } else if (seccion === 'productos') {
        mostrarTablaProductos();
      }
    }

    function mostrarFormularioAgregar() {
      document.getElementById('main-content').innerHTML = `
        <h1 class="text-3xl font-bold mb-8">Agregar Nuevo Producto</h1>
        <div class="max-w-2xl bg-white p-8 rounded-3xl shadow">
          <input id="nombre" placeholder="Nombre del producto" class="w-full p-4 border rounded-2xl mb-4">
          <input id="precio" type="number" placeholder="Precio en Quetzales" class="w-full p-4 border rounded-2xl mb-4">
          <input id="unidad" placeholder="Unidad (ej: 50 kg)" class="w-full p-4 border rounded-2xl mb-4">
          <select id="categoria" class="w-full p-4 border rounded-2xl mb-6">
            <option>Fertilizantes</option><option>Foliares</option><option>Protección</option><option>Herramientas</option><option>Accesorios</option>
          </select>
          <input id="imagen" type="file" accept="image/*" class="w-full p-4 border rounded-2xl mb-6">
          <button onclick="guardarProducto()" class="w-full bg-green-600 text-white py-4 rounded-2xl font-bold">Guardar Producto</button>
        </div>`;
    }

    async function guardarProducto() {
      const nombre = document.getElementById('nombre').value;
      const precio = parseFloat(document.getElementById('precio').value);
      if (!nombre || !precio) return alert("Faltan campos");

      try {
        let imageUrl = "https://picsum.photos/id/201/600/400";
        const file = document.getElementById('imagen').files[0];
        if (file) {
          const ref = storage.ref('productos/' + Date.now() + '_' + file.name);
          await ref.put(file);
          imageUrl = await ref.getDownloadURL();
        }

        await db.collection('productos').add({
          nombre, precio, unidad: document.getElementById('unidad').value, categoria: document.getElementById('categoria').value, imageUrl, fecha: new Date()
        });

        alert("✅ Producto guardado");
        mostrarSeccion('productos');
      } catch (e) {
        alert("Error: " + e.message);
      }
    }

    function logout() {
      if (confirm("¿Cerrar sesión?")) {
        auth.signOut().then(() => mostrarLogin());
      }
    }

    window.onload = () => {
      auth.onAuthStateChanged(user => {
        if (user) mostrarPanelPrincipal();
        else mostrarLogin();
      });
    };
  </script>
</body>
</html>
