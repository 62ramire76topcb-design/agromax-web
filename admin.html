<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGROMAX - Panel Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
</head>
<body class="bg-gray-100">

  <div id="app" class="min-h-screen"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAEj22gE5UySwWVwIec6jpBiZ2nb1OBftM",
      authDomain: "agromaxgt-app.firebaseapp.com",
      projectId: "agromaxgt-app",
      storageBucket: "agromaxgt-app.firebasestorage.app",
      messagingSenderId: "648144313047",
      appId: "1:648144313047:web:118a67464d99f2d0462e92"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    function mostrarLogin() {
      document.getElementById('app').innerHTML = `
        <div class="min-h-screen flex items-center justify-center bg-gray-100">
          <div class="bg-white p-10 rounded-3xl shadow-2xl max-w-md w-full">
            <div class="text-center mb-8">
              <div class="w-20 h-20 bg-green-700 mx-auto rounded-3xl flex items-center justify-center text-5xl">🌱</div>
              <h1 class="text-3xl font-bold mt-4">AGROMAX</h1>
              <p class="text-green-600">Panel de Administración</p>
            </div>
            <input id="email" type="email" value="62ramire76topcb@gmail.com" class="w-full p-4 border rounded-2xl mb-4">
            <input id="password" type="password" value="Maycol123@" class="w-full p-4 border rounded-2xl mb-6">
            <button onclick="login()" class="w-full bg-green-600 hover:bg-green-700 text-white py-4 rounded-2xl font-bold text-lg">
              Ingresar al Panel
            </button>
          </div>
        </div>`;
    }

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        await auth.signInWithEmailAndPassword(email, password);
        alert("✅ Login exitoso");
        mostrarPanel();
      } catch (e) {
        alert("Error: " + e.message);
      }
    }

    function mostrarPanel() {
      document.getElementById('app').innerHTML = `
        <div class="flex h-screen">
          <div class="w-72 bg-white border-r shadow-xl p-6">
            <h1 class="text-2xl font-bold text-green-700 mb-8">AGROMAX</h1>
            <div class="space-y-3">
              <button onclick="alert('Dashboard abierto')" class="w-full text-left px-4 py-3 rounded-2xl hover:bg-green-50">🏠 Dashboard</button>
              <button onclick="alert('Agregar Producto')" class="w-full text-left px-4 py-3 rounded-2xl hover:bg-green-50">➕ Agregar Producto</button>
              <button onclick="alert('Ver Productos')" class="w-full text-left px-4 py-3 rounded-2xl hover:bg-green-50">📋 Ver Productos</button>
            </div>
            <button onclick="logout()" class="mt-12 w-full bg-red-600 text-white py-3 rounded-2xl">Cerrar Sesión</button>
          </div>
          <div class="flex-1 p-10">
            <h1 class="text-4xl font-bold">Bienvenido al Panel</h1>
            <p class="mt-4 text-gray-600">Funciona correctamente</p>
          </div>
        </div>`;
    }

    function logout() {
      if (confirm("¿Cerrar sesión?")) {
        auth.signOut().then(() => mostrarLogin());
      }
    }

    window.onload = () => {
      auth.onAuthStateChanged(user => {
        if (user) mostrarPanel();
        else mostrarLogin();
      });
    };
  </script>
</body>
</html>
