<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGROMAX - Panel Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
</head>
<body class="bg-gray-100">

  <div class="flex h-screen">
    <!-- Sidebar -->
    <div class="w-72 bg-white border-r shadow-xl">
      <div class="p-6 border-b bg-green-700 text-white">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-white rounded-2xl flex items-center justify-center text-green-700 text-3xl">🌱</div>
          <div>
            <h1 class="text-2xl font-bold">AGROMAX</h1>
            <p class="text-xs opacity-90">Panel de Administración</p>
          </div>
        </div>
      </div>
      <nav class="p-4 space-y-1">
        <a onclick="mostrarSeccion('dashboard')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-home"></i> Dashboard</a>
        <a onclick="mostrarSeccion('agregar')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-plus"></i> Agregar Producto</a>
        <a onclick="mostrarSeccion('productos')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-list"></i> Ver / Editar Productos</a>
        <a onclick="logout()" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-red-50 text-red-600 mt-12"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
      </nav>
    </div>

    <!-- Contenido Principal -->
    <div class="flex-1 overflow-auto p-8" id="main-content"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAEj22gE5UySwWVwIec6jpBiZ2nb1OBftM",
      authDomain: "agromaxgt-app.firebaseapp.com",
      projectId: "agromaxgt-app",
      storageBucket: "agromaxgt-app.firebasestorage.app",
      messagingSenderId: "648144313047",
      appId: "1:648144313047:web:118a67464d99f2d0462e92"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();

    let productoEditando = null;

    function mostrarSeccion(seccion) {
      const content = document.getElementById('main-content');
      
      if (seccion === 'dashboard') {
        content.innerHTML = `<h1 class="text-4xl font-bold">Dashboard</h1><p class="mt-8">Bienvenido al Panel de AGROMAX</p>`;
      } 
      else if (seccion === 'agregar') {
        productoEditando = null;
        content.innerHTML = `
          <h1 class="text-3xl font-bold mb-6">Agregar Nuevo Producto</h1>
          <div class="max-w-2xl bg-white p-8 rounded-3xl shadow">
            <input id="nombre" placeholder="Nombre del producto" class="w-full p-4 border rounded-2xl mb-4">
            <input id="precio" type="number" placeholder="Precio en Quetzales" class="w-full p-4 border rounded-2xl mb-4">
            <input id="unidad" placeholder="Unidad (ej: 50 kg)" class="w-full p-4 border rounded-2xl mb-4">
            <select id="categoria" class="w-full p-4 border rounded-2xl mb-6">
              <option>Fertilizantes</option><option>Foliares</option><option>Protección</option><option>Herramientas</option><option>Accesorios</option>
            </select>
            <input id="imagen" type="file" accept="image/*" class="w-full p-4 border rounded-2xl mb-6">
            <button onclick="guardarProducto()" class="w-full bg-green-600 text-white py-4 rounded-2xl font-bold">Guardar Producto</button>
          </div>`;
      } 
      else if (seccion === 'productos') {
        content.innerHTML = `
          <h1 class="text-3xl font-bold mb-6">Productos Registrados</h1>
          <input id="busqueda" placeholder="Buscar productos..." class="w-full p-4 border rounded-2xl mb-6" onkeyup="buscarProductos()">
          <div id="lista-productos" class="grid grid-cols-1 gap-6"></div>`;
        cargarProductos();
      }
    }

    async function guardarProducto() {
      const nombre = document.getElementById('nombre').value;
      const precio = parseFloat(document.getElementById('precio').value);
      const unidad = document.getElementById('unidad').value;
      const categoria = document.getElementById('categoria').value;
      const file = document.getElementById('imagen').files[0];

      if (!nombre || !precio) return alert("Faltan campos obligatorios");

      try {
        let imageUrl = "https://picsum.photos/id/201/600/400";
        if (file) {
          const ref = storage.ref('productos/' + Date.now() + '_' + file.name);
          await ref.put(file);
          imageUrl = await ref.getDownloadURL();
        }

        if (productoEditando) {
          await db.collection('productos').doc(productoEditando).update({nombre, precio, unidad, categoria, imageUrl});
          alert("✅ Producto actualizado");
        } else {
          await db.collection('productos').add({nombre, precio, unidad, categoria, imageUrl, fecha: new Date()});
          alert("✅ Producto guardado");
        }

        mostrarSeccion('productos');
      } catch(e) {
        alert("Error: " + e.message);
      }
    }

    async function cargarProductos(filtro = '') {
      const snapshot = await db.collection('productos').get();
      const container = document.getElementById('lista-productos');
      container.innerHTML = '';

      snapshot.forEach(doc => {
        const p = doc.data();
        if (p.nombre.toLowerCase().includes(filtro.toLowerCase())) {
          const div = document.createElement('div');
          div.className = "bg-white p-6 rounded-3xl shadow flex gap-6 items-center";
          div.innerHTML = `
            <img src="${p.imageUrl}" class="w-20 h-20 object-cover rounded-2xl">
            <div class="flex-1">
              <h3 class="font-semibold">${p.nombre}</h3>
              <p class="text-green-600 font-bold">Q${p.precio} - ${p.unidad}</p>
            </div>
            <div>
              <button onclick="editarProducto('${doc.id}')" class="bg-blue-600 text-white px-4 py-2 rounded-xl mr-2">Editar</button>
              <button onclick="eliminarProducto('${doc.id}')" class="bg-red-600 text-white px-4 py-2 rounded-xl">Eliminar</button>
            </div>
          `;
          container.appendChild(div);
        }
      });
    }

    function buscarProductos() {
      const filtro = document.getElementById('busqueda').value;
      cargarProductos(filtro);
    }

    async function editarProducto(id) {
      const doc = await db.collection('productos').doc(id).get();
      const p = doc.data();
      productoEditando = id;

      document.getElementById('main-content').innerHTML = `
        <h1 class="text-3xl font-bold mb-6">Editar Producto</h1>
        <div class="max-w-2xl bg-white p-8 rounded-3xl shadow">
          <input id="nombre" value="${p.nombre}" class="w-full p-4 border rounded-2xl mb-4">
          <input id="precio" type="number" value="${p.precio}" class="w-full p-4 border rounded-2xl mb-4">
          <input id="unidad" value="${p.unidad}" class="w-full p-4 border rounded-2xl mb-4">
          <select id="categoria" class="w-full p-4 border rounded-2xl mb-6">
            <option ${p.categoria==='Fertilizantes'?'selected':''}>Fertilizantes</option>
            <option ${p.categoria==='Foliares'?'selected':''}>Foliares</option>
            <option ${p.categoria==='Protección'?'selected':''}>Protección</option>
            <option ${p.categoria==='Herramientas'?'selected':''}>Herramientas</option>
            <option ${p.categoria==='Accesorios'?'selected':''}>Accesorios</option>
          </select>
          <button onclick="guardarProducto()" class="w-full bg-green-600 text-white py-4 rounded-2xl font-bold">Guardar Cambios</button>
        </div>`;
    }

    async function eliminarProducto(id) {
      if (confirm("¿Eliminar este producto?")) {
        await db.collection('productos').doc(id).delete();
        cargarProductos();
      }
    }

    function logout() {
      if (confirm("¿Cerrar sesión?")) {
        auth.signOut().then(() => window.location.reload());
      }
    }

    window.onload = () => {
      auth.onAuthStateChanged(user => {
        if (user) mostrarSeccion('dashboard');
        else mostrarLogin();
      });
    };

    function mostrarLogin() {
      document.getElementById('main-content').innerHTML = `
        <div class="min-h-screen flex items-center justify-center">
          <div class="bg-white p-8 rounded-3xl shadow max-w-md w-full">
            <h1 class="text-3xl font-bold text-center mb-8">Iniciar Sesión</h1>
            <input id="email" type="email" placeholder="Correo" class="w-full p-4 border rounded-2xl mb-4">
            <input id="password" type="password" placeholder="Contraseña" class="w-full p-4 border rounded-2xl mb-6">
            <button onclick="login()" class="w-full bg-green-600 text-white py-4 rounded-2xl font-bold">Entrar</button>
          </div>
        </div>`;
    }

    async function login() {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      try {
        await auth.signInWithEmailAndPassword(email, pass);
        mostrarSeccion('dashboard');
      } catch(e) {
        alert("Error: " + e.message);
      }
    };
  </script>
</body>
</html>
