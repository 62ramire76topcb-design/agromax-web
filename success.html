<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago Exitoso - AGROMAXGTM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white max-w-lg w-full rounded-3xl shadow-2xl p-6 sm:p-10 text-center">
    <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-5">
      <i class="fas fa-check text-4xl text-green-600"></i>
    </div>

    <h1 class="text-2xl sm:text-3xl font-bold text-slate-800 mb-2">¡Pago exitoso!</h1>
    <p class="text-slate-600 mb-1">Gracias por tu compra en <strong>AGROMAXGTM</strong>.</p>
    <p class="text-sm text-slate-500 mb-5" id="session-info">Confirmando tu pedido...</p>

    <div id="pedido-info" class="hidden text-left space-y-4 mb-6"></div>

    <a id="btn-seguimiento" href="/seguimiento.html" class="hidden w-full mb-3 bg-green-600 hover:bg-green-700 text-white py-3.5 rounded-2xl font-bold text-base transition inline-block">
      <i class="fas fa-map-marker-alt mr-1"></i> Ver seguimiento de mi pedido
    </a>

    <a id="btn-whatsapp" href="#" class="hidden w-full mb-3 bg-[#25D366] hover:bg-green-600 text-white py-3.5 rounded-2xl font-bold text-base transition inline-block">
      <i class="fab fa-whatsapp mr-1"></i> Guardar código por WhatsApp
    </a>

    <a href="/" class="inline-block w-full border border-slate-200 hover:bg-slate-50 text-slate-700 py-3.5 rounded-2xl font-semibold transition">
      Volver al catálogo
    </a>

    <p class="text-xs text-slate-400 mt-6">WhatsApp soporte: +502 4266 4744</p>
  </div>

  <script src="./js/firebase-config.js"></script>
  <script>
    async function procesarPagoExitoso() {
      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get('session_id');

      // Datos guardados ANTES de ir a Stripe
      const pendiente = JSON.parse(localStorage.getItem('pedidoPendienteStripe') || 'null');
      const datos = (pendiente && pendiente.datos) || JSON.parse(localStorage.getItem('datosPendienteStripe') || localStorage.getItem('datosClienteCatalogo') || '{}');

      if (!pendiente || !pendiente.trackingCode) {
        // Fallback: si no hay pendiente, intentar carrito antiguo
        const carrito = JSON.parse(localStorage.getItem('carritoPendienteStripe') || '[]');
        if (carrito.length === 0) {
          document.getElementById('session-info').textContent =
            'Si ya pagaste, revisa tu código en Admin o contáctanos por WhatsApp.';
          return;
        }
      }

      const trackingCode = pendiente.trackingCode;
      const pedidoId = pendiente.pedidoId;
      const total = pendiente.total;
      const productos = pendiente.productos || [];
      const fechaEstimadaISO = pendiente.fechaEstimadaISO;

      try {
        // Marcar pedido como Pagado
        if (pedidoId) {
          await db.collection('pedidos').doc(pedidoId).update({
            estado: 'Pagado',
            sessionId: sessionId || null,
            pagadoEn: new Date(),
            historial: firebase.firestore.FieldValue.arrayUnion({
              estado: 'Pagado',
              fecha: new Date(),
              nota: 'Pago confirmado con tarjeta (Stripe)'
            })
          });
        }

        // Orden de trabajo (opcional)
        try {
          await db.collection('ordenes_trabajo').add({
            pedidoId: pedidoId || null,
            trackingCode: trackingCode,
            cliente: datos.nombre || '',
            telefono: datos.telefono || '',
            nit: datos.nit || 'CF',
            email: datos.email || '',
            direccion: datos.direccion || '',
            referencia: datos.referencia || '',
            productos: productos,
            total: total,
            estado: 'Pagado',
            metodo: 'Stripe',
            fecha: new Date(),
            fechaEstimada: fechaEstimadaISO ? new Date(fechaEstimadaISO) : null
          });
        } catch (e) {
          console.warn('ordenes_trabajo:', e);
        }

        const resumen = {
          trackingCode: trackingCode,
          total: total,
          productos: productos,
          fechaEstimadaISO: fechaEstimadaISO
        };

        if (sessionId) {
          localStorage.setItem('stripeProcesado_' + sessionId, JSON.stringify(resumen));
        }

        mostrarResumen(resumen, datos);

        // Limpiar
        localStorage.removeItem('pedidoPendienteStripe');
        localStorage.removeItem('carritoPendienteStripe');
        localStorage.removeItem('datosPendienteStripe');
        localStorage.removeItem('carritoAGROMAXGTM');
      } catch (e) {
        console.error(e);
        // Aun así mostrar el código si lo tenemos
        if (trackingCode) {
          mostrarResumen({
            trackingCode: trackingCode,
            total: total,
            productos: productos,
            fechaEstimadaISO: fechaEstimadaISO
          }, datos);
        } else {
          document.getElementById('session-info').textContent =
            'Pago recibido. Contáctanos por WhatsApp para tu código de seguimiento.';
        }
      }
    }

    function mostrarResumen(resumen, datos) {
      const fechaEst = resumen.fechaEstimadaISO
        ? new Date(resumen.fechaEstimadaISO).toLocaleDateString('es-GT', {
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
          })
        : 'Por confirmar (te avisaremos)';

      const linkSeg = 'https://agromax-web.vercel.app/seguimiento.html?codigo=' + encodeURIComponent(resumen.trackingCode);

      const infoDiv = document.getElementById('pedido-info');
      infoDiv.classList.remove('hidden');
      infoDiv.innerHTML = `
        <div class="bg-green-50 border-2 border-green-200 rounded-2xl p-5 text-center">
          <p class="text-xs text-green-700 font-medium mb-1">📦 Tu código de seguimiento</p>
          <p class="text-3xl font-extrabold text-green-800 tracking-wide select-all">${resumen.trackingCode}</p>
          <p class="text-xs text-green-700 mt-2">Guárdalo: con este código ves el estado de tu envío</p>
        </div>

        <div class="bg-amber-50 border border-amber-200 rounded-2xl p-4 text-sm">
          <p class="font-bold text-amber-900 mb-1"><i class="fas fa-calendar-check mr-1"></i> Fecha estimada de llegada</p>
          <p class="text-amber-900 capitalize font-semibold">${fechaEst}</p>
          <p class="text-xs text-amber-700 mt-1">Puede variar según tu zona. Te actualizamos el estado en el seguimiento.</p>
        </div>

        <div class="bg-slate-50 rounded-2xl p-4 text-sm space-y-1">
          <p class="font-semibold mb-2">Datos de envío / factura</p>
          <p><b>Cliente:</b> ${datos.nombre || ''}</p>
          <p><b>Teléfono:</b> ${datos.telefono || ''}</p>
          <p><b>NIT:</b> ${datos.nit || 'CF'}</p>
          <p><b>Dirección:</b> ${datos.direccion || ''}</p>
          ${datos.referencia ? `<p><b>Referencia:</b> ${datos.referencia}</p>` : ''}
          <hr class="my-2">
          ${(resumen.productos || []).map(p => `<p>• ${p.nombre} × ${p.cantidad}</p>`).join('')}
          <p class="font-bold text-green-700 mt-2">Total pagado: Q${Number(resumen.total || 0).toFixed(2)}</p>
        </div>
      `;

      const btn = document.getElementById('btn-seguimiento');
      btn.href = linkSeg;
      btn.classList.remove('hidden');

      // WhatsApp para que el cliente se guarde el código
      const msg =
        `✅ *AGROMAXGTM - Pedido confirmado*\n\n` +
        `Código de seguimiento: *${resumen.trackingCode}*\n` +
        `Llegada estimada: ${fechaEst}\n` +
        `Ver estado: ${linkSeg}\n\n` +
        `Cliente: ${datos.nombre || ''}\n` +
        `Total: Q${Number(resumen.total || 0).toFixed(2)}`;

      const wa = document.getElementById('btn-whatsapp');
      wa.href = 'https://wa.me/50242664744?text=' + encodeURIComponent(msg);
      wa.classList.remove('hidden');

      document.getElementById('session-info').textContent = 'Pedido pagado y orden de seguimiento creada';
    }

    window.onload = procesarPagoExitoso;
  </script>
</body>
</html>
