<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago Exitoso - AGROMAXGTM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white max-w-lg w-full rounded-3xl shadow-2xl p-8 sm:p-10 text-center">
    <div class="w-20 h-20 sm:w-24 sm:h-24 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
      <i class="fas fa-check text-4xl sm:text-5xl text-green-600"></i>
    </div>

    <h1 class="text-2xl sm:text-3xl font-bold text-gray-800 mb-3">¡Pago exitoso!</h1>
    <p class="text-gray-600 mb-2">Gracias por tu compra en <strong>AGROMAXGTM</strong>.</p>
    <p class="text-sm text-gray-500 mb-6" id="session-info">Procesando confirmación...</p>

    <div id="pedido-info" class="hidden bg-gray-50 rounded-2xl p-5 mb-6 text-left text-sm"></div>

    <a href="/" class="inline-block w-full bg-green-600 hover:bg-green-700 text-white py-4 rounded-2xl font-bold text-lg transition">
      Volver al catálogo
    </a>

    <p class="text-xs text-gray-400 mt-6">
      Si tienes dudas, contáctanos por WhatsApp: +502 4266 4744
    </p>
  </div>

  <script src="./js/firebase-config.js"></script>
  <script>
    async function procesarPagoExitoso() {
      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get('session_id');

      if (sessionId) {
        document.getElementById('session-info').textContent = 'ID de sesión: ' + sessionId.substring(0, 22) + '...';
      }

      const carritoPendiente = JSON.parse(localStorage.getItem('carritoPendienteStripe') || '[]');
      const datos = JSON.parse(localStorage.getItem('datosPendienteStripe') || localStorage.getItem('datosClienteCatalogo') || '{}');

      if (carritoPendiente.length > 0) {
        let total = 0;
        const productos = carritoPendiente.map(item => {
          total += item.precio * item.cantidad;
          return { nombre: item.nombre, cantidad: item.cantidad, precio: item.precio };
        });

        try {
          await db.collection('pedidos').add({
            cliente: datos.nombre || 'Cliente Web - Stripe',
            telefono: datos.telefono || '',
            nit: datos.nit || 'CF',
            email: datos.email || '',
            direccion: datos.direccion || '',
            referencia: datos.referencia || '',
            productos: productos,
            total: total,
            fecha: new Date(),
            estado: 'Pagado',
            metodo: 'Stripe',
            sessionId: sessionId || null
          });

          const infoDiv = document.getElementById('pedido-info');
          infoDiv.classList.remove('hidden');
          infoDiv.innerHTML = `
            <p class="font-semibold mb-2">Resumen del pedido</p>
            <p><b>Cliente:</b> ${datos.nombre || ''}</p>
            <p><b>Teléfono:</b> ${datos.telefono || ''}</p>
            <p><b>NIT:</b> ${datos.nit || 'CF'}</p>
            <p><b>Dirección:</b> ${datos.direccion || ''}</p>
            <hr class="my-3">
            ${productos.map(p => `<p>• ${p.nombre} × ${p.cantidad} = Q${(p.precio * p.cantidad).toFixed(2)}</p>`).join('')}
            <p class="font-bold mt-3 text-green-700">Total: Q${total.toFixed(2)}</p>
          `;
        } catch (e) {
          console.error('Error guardando pedido:', e);
        }

        localStorage.removeItem('carritoPendienteStripe');
        localStorage.removeItem('datosPendienteStripe');
        localStorage.removeItem('carritoAGROMAXGTM');
      }
    }

    window.onload = procesarPagoExitoso;
  </script>
</body>
</html>
