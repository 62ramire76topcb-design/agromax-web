<script>
const firebaseConfig = {
  apiKey: "AIzaSyAEj22gE5UySwWVwIec6jpBiZ2nb1OBftM",
  authDomain: "agromaxgt-app.firebaseapp.com",
  projectId: "agromaxgt-app",
  storageBucket: "agromaxgt-app.firebasestorage.app",
  messagingSenderId: "648144313047",
  appId: "1:648144313047:web:118a67464d99f2d0462e92"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* =========================
   ESTADO GLOBAL
========================= */
let productos = [];

/* =========================
   INICIO
========================= */
window.onload = () => {
  mostrarSeccion('dashboard');
  escucharProductos();
};

/* =========================
   FIRESTORE REALTIME SYNC
========================= */
function escucharProductos() {
  db.collection("productos")
    .orderBy("fecha", "desc")
    .onSnapshot(snapshot => {

      productos = [];

      snapshot.forEach(doc => {
        productos.push({ id: doc.id, ...doc.data() });
      });

      actualizarVista();
    });
}

/* =========================
   UI ROUTER
========================= */
function mostrarSeccion(seccion) {
  const content = document.getElementById('main-content');

  if (seccion === 'dashboard') {
    content.innerHTML = renderDashboard();
  }

  if (seccion === 'fisico') {
    content.innerHTML = `
      <div class="bg-white p-8 rounded-2xl shadow">
        <h1 class="text-3xl font-bold">📋 Inventario Físico</h1>
      </div>
    `;
  }
}

/* =========================
   DASHBOARD
========================= */
function renderDashboard() {
  return `
    <h1 class="text-4xl font-bold text-green-700 mb-6">
      📦 Inventario en Tiempo Real
    </h1>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">

      <div class="bg-white p-6 rounded-2xl shadow">
        <p class="text-gray-500">Total Productos</p>
        <h2 class="text-4xl font-bold" id="total">0</h2>
      </div>

      <div class="bg-white p-6 rounded-2xl shadow">
        <p class="text-gray-500">Stock Bajo</p>
        <h2 class="text-4xl font-bold text-yellow-600" id="bajo">0</h2>
      </div>

      <div class="bg-white p-6 rounded-2xl shadow">
        <p class="text-gray-500">Agotados</p>
        <h2 class="text-4xl font-bold text-red-600" id="agotados">0</h2>
      </div>

    </div>

    <div class="bg-white rounded-2xl shadow overflow-x-auto">
      <table class="w-full">
        <thead class="bg-green-700 text-white">
          <tr>
            <th class="p-3 text-left">Producto</th>
            <th class="p-3 text-left">Categoría</th>
            <th class="p-3">Stock</th>
            <th class="p-3">Precio</th>
          </tr>
        </thead>
        <tbody id="tabla"></tbody>
      </table>
    </div>
  `;
}

/* =========================
   ACTUALIZAR VISTA
========================= */
function actualizarVista() {

  const total = productos.length;
  const bajo = productos.filter(p => (p.stock || 0) > 0 && (p.stock || 0) < 10).length;
  const agotados = productos.filter(p => (p.stock || 0) === 0).length;

  if (document.getElementById("total")) {
    document.getElementById("total").innerText = total;
    document.getElementById("bajo").innerText = bajo;
    document.getElementById("agotados").innerText = agotados;
  }

  const tbody = document.getElementById("tabla");
  if (!tbody) return;

  tbody.innerHTML = "";

  productos.forEach(p => {
    tbody.innerHTML += `
      <tr class="border-b">
        <td class="p-3">${p.nombre}</td>
        <td class="p-3">${p.categoria || ''}</td>
        <td class="p-3 text-center">${p.stock}</td>
        <td class="p-3">Q${p.precio}</td>
      </tr>
    `;
  });
}
</script>
