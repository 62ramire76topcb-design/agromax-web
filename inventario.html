<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGROMAXGTM - Inventario PRO MAX</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>

<body class="bg-gray-100">
<div class="flex h-screen">

<!-- SIDEBAR -->
<div class="w-72 bg-white border-r shadow-xl">
  <div class="p-6 bg-green-700 text-white">
    <h1 class="text-2xl font-bold">AGROMAXGTM</h1>
    <p class="text-sm">Inventario PRO MAX</p>
  </div>

  <nav class="p-4 space-y-2">
    <a onclick="view('dashboard')" class="cursor-pointer block p-3 rounded hover:bg-green-50">📊 Dashboard</a>
    <a onclick="view('movimientos')" class="cursor-pointer block p-3 rounded hover:bg-green-50">🔄 Movimientos</a>
    <a onclick="view('alertas')" class="cursor-pointer block p-3 rounded hover:bg-green-50">🚨 Alertas</a>
  </nav>
</div>

<!-- MAIN -->
<div class="flex-1 p-6 overflow-auto" id="main"></div>

</div>

<script>

/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyAEj22gE5UySwWVwIec6jpBiZ2nb1OBftM",
  authDomain: "agromaxgt-app.firebaseapp.com",
  projectId: "agromaxgt-app",
  storageBucket: "agromaxgt-app.firebasestorage.app",
  messagingSenderId: "648144313047",
  appId: "1:648144313047:web:118a67464d99f2d0462e92"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ================= CACHE ================= */
let productos = [];
let lastUpdate = 0;

/* ================= INIT ================= */
window.onload = () => {
  view("dashboard");

  db.collection("productos").onSnapshot(snap => {
    productos = snap.docs.map(d => ({
      id: d.id,
      ...d.data()
    }));

    lastUpdate = Date.now();
    renderDashboard();
  });
};

/* ================= NAV ================= */
function view(v){
  const main = document.getElementById("main");

  if(v==="dashboard") main.innerHTML = dashboardUI();
  if(v==="movimientos") main.innerHTML = movimientosUI();
  if(v==="alertas") main.innerHTML = alertasUI();
}

/* ================= DASHBOARD ================= */
function dashboardUI(){
return `
<h1 class="text-3xl font-bold mb-6">📦 Inventario PRO MAX</h1>

<div class="grid grid-cols-4 gap-4 mb-6">

<div class="bg-white p-4 rounded shadow">
Total
<h2 class="text-2xl font-bold">${productos.length}</h2>
</div>

<div class="bg-white p-4 rounded shadow">
Bajo Stock
<h2 class="text-2xl font-bold text-yellow-600">${countLow()}</h2>
</div>

<div class="bg-white p-4 rounded shadow">
Agotados
<h2 class="text-2xl font-bold text-red-600">${countEmpty()}</h2>
</div>

<div class="bg-white p-4 rounded shadow">
Valor
<h2 class="text-2xl font-bold text-blue-600">Q${totalValue()}</h2>
</div>

</div>

<div class="bg-white p-4 rounded shadow">
<h2 class="font-bold mb-3">⚡ Control rápido</h2>

<select id="prod" class="w-full border p-2 mb-2">
<option>Seleccionar producto</option>
${productos.map(p=>`<option value="${p.id}">${p.nombre}</option>`).join("")}
</select>

<input id="qty" type="number" class="w-full border p-2 mb-2" placeholder="Cantidad">

<div class="flex gap-2">
<button onclick="move('in')" class="bg-green-600 text-white px-4 py-2 rounded">Entrada</button>
<button onclick="move('out')" class="bg-red-600 text-white px-4 py-2 rounded">Salida</button>
<button onclick="move('set')" class="bg-blue-600 text-white px-4 py-2 rounded">Ajuste</button>
</div>

</div>
`;
}

/* ================= MOVIMIENTOS ================= */
function movimientosUI(){
return `<h2 class="text-2xl font-bold">Movimientos (optimizado)</h2>`;
}

/* ================= ALERTAS ================= */
function alertasUI(){
return `
<h2 class="text-2xl font-bold mb-4">🚨 Alertas de Stock</h2>

<div class="space-y-2">
${productos.filter(p=>p.stock<=5).map(p=>`
<div class="bg-red-100 p-3 rounded">
<b>${p.nombre}</b> - Stock crítico: ${p.stock}
</div>
`).join("")}
</div>
`;
}

/* ================= LOGIC OPTIMIZADA ================= */
async function move(type){

const id = document.getElementById("prod").value;
const qty = parseInt(document.getElementById("qty").value||0);

if(!id || qty<=0) return alert("Datos inválidos");

const ref = db.collection("productos").doc(id);
const doc = await ref.get();

if(!doc.exists) return;

let stock = doc.data().stock || 0;

let newStock = stock;

if(type==="in") newStock += qty;
if(type==="out") newStock -= qty;
if(type==="set") newStock = qty;

if(newStock < 0) return alert("❌ Stock negativo no permitido");

await ref.update({
stock: newStock,
updatedAt: firebase.firestore.FieldValue.serverTimestamp()
});

await db.collection("movimientos").add({
producto: doc.data().nombre,
tipo: type,
cantidad: qty,
fecha: firebase.firestore.FieldValue.serverTimestamp()
});

document.getElementById("qty").value="";
}

/* ================= STATS ================= */
function countLow(){
return productos.filter(p=>p.stock>0 && p.stock<10).length;
}

function countEmpty(){
return productos.filter(p=>p.stock===0).length;
}

function totalValue(){
return productos.reduce((a,p)=>a+(p.stock||0)*(p.precio||0),0).toFixed(2);
}

/* ================= RENDER ================= */
function renderDashboard(){
const el = document.getElementById("main");
if(el) el.innerHTML = dashboardUI();
}

</script>

</body>
</html>
