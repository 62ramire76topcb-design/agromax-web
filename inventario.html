<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGROMAXGTM - Inventario Oficial</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<style>
@media print {
  body * { visibility: hidden; }
  #printArea, #printArea * { visibility: visible; }
  #printArea { position:absolute; left:0; top:0; width:100%; }
}
</style>
</head>

<body class="bg-gray-100">
<div class="flex h-screen">

<!-- SIDEBAR -->
<div class="w-72 bg-white border-r shadow-xl">
  <div class="p-6 bg-green-700 text-white">
    <h1 class="text-2xl font-bold">AGROMAXGTM</h1>
    <p class="text-sm">Inventario Oficial</p>
  </div>

  <nav class="p-4 space-y-2">
    <a onclick="view('dashboard')" class="block p-3 hover:bg-green-50 rounded cursor-pointer">
      📦 Inventario
    </a>

    <a onclick="view('kardex')" class="block p-3 hover:bg-green-50 rounded cursor-pointer">
      📒 Kardex
    </a>

    <a onclick="view('report')" class="block p-3 hover:bg-green-50 rounded cursor-pointer">
      🧾 Reporte
    </a>
  </nav>
</div>

<!-- MAIN -->
<div class="flex-1 p-6 overflow-auto" id="main"></div>

</div>

<script>

/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyAEj22gE5UySwWVwIec6jpBiZ2nb1OBftM",
  authDomain: "agromaxgt-app.firebaseapp.com",
  projectId: "agromaxgt-app",
  storageBucket: "agromaxgt-app.firebasestorage.app",
  messagingSenderId: "648144313047",
  appId: "1:648144313047:web:118a67464d99f2d0462e92"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ================= ESTADO ================= */
let productos = [];
let kardex = [];

/* ================= INIT ================= */
window.onload = () => {
  view("dashboard");

  db.collection("productos").onSnapshot(snap => {
    productos = snap.docs.map(d => ({id:d.id,...d.data()}));
    render();
  });

  db.collection("movimientos")
    .orderBy("fecha","desc")
    .onSnapshot(snap => {
      kardex = snap.docs.map(d => d.data());
      renderKardex();
    });
};

/* ================= NAV ================= */
function view(v){
  const main = document.getElementById("main");

  if(v==="dashboard") main.innerHTML = dashboardUI();
  if(v==="kardex") main.innerHTML = kardexUI();
  if(v==="report") main.innerHTML = reportUI();
}

/* ================= DASHBOARD ================= */
function dashboardUI(){
return `
<h1 class="text-3xl font-bold mb-4">📦 Inventario Oficial</h1>

<div class="grid grid-cols-3 gap-3 mb-4">

<button onclick="movimiento('entrada')" class="bg-green-600 text-white p-3 rounded">
➕ Entrada
</button>

<button onclick="movimiento('salida')" class="bg-red-600 text-white p-3 rounded">
➖ Salida
</button>

<button onclick="movimiento('ajuste')" class="bg-blue-600 text-white p-3 rounded">
⚙ Ajuste
</button>

</div>

<input id="search" oninput="render()"
class="w-full p-2 border rounded mb-4"
placeholder="Buscar producto...">

<div id="list"></div>
`;
}

/* ================= KARDEX ================= */
function kardexUI(){
return `
<h1 class="text-2xl font-bold mb-4">📒 Kardex (Movimientos)</h1>

<div class="bg-white p-4 rounded shadow">
<table class="w-full">
<thead>
<tr>
<th>Fecha</th>
<th>Producto</th>
<th>Tipo</th>
<th>Cantidad</th>
<th>Stock Final</th>
</tr>
</thead>
<tbody id="kardexTable"></tbody>
</table>
</div>
`;
}

/* ================= REPORT ================= */
function reportUI(){
return `
<div id="printArea" class="bg-white p-6">
<h1 class="text-2xl font-bold">Reporte Oficial Inventario</h1>

<table class="w-full mt-4 border">
${productos.map(p=>`
<tr>
<td>${p.nombre}</td>
<td>${p.stock}</td>
<td>Q${p.precio}</td>
<td>Q${(p.stock||0)*(p.precio||0)}</td>
</tr>
`).join("")}
</table>

<h3 class="mt-4 font-bold">
Total: Q${total()}
</h3>
</div>
`;
}

/* ================= MOVIMIENTOS ================= */
async function movimiento(tipo){

const nombre = prompt("Producto:");
const cantidad = parseInt(prompt("Cantidad:"));

const p = productos.find(x=>x.nombre===nombre);

if(!p) return alert("Producto no existe");

let stock = p.stock || 0;

if(tipo==="entrada") stock += cantidad;
if(tipo==="salida") stock -= cantidad;
if(tipo==="ajuste") stock = cantidad;

await db.collection("productos").doc(p.id).update({
stock
});

await db.collection("movimientos").add({
producto:nombre,
tipo,
cantidad,
stockFinal:stock,
fecha:new Date()
});

alert("Movimiento registrado");
}

/* ================= RENDER ================= */
function render(){

const q = document.getElementById("search")?.value?.toLowerCase() || "";

const list = productos.filter(p=>
p.nombre?.toLowerCase().includes(q)
);

document.getElementById("list").innerHTML =
list.map(p=>`
<div class="bg-white p-3 mb-2 rounded shadow flex justify-between">
<div>
<b>${p.nombre}</b><br>
Stock: ${p.stock}
</div>
<div>
Q${p.precio}
</div>
</div>
`).join("");
}

/* ================= KARDEX RENDER ================= */
function renderKardex(){
const el = document.getElementById("kardexTable");
if(!el) return;

el.innerHTML = kardex.map(k=>`
<tr>
<td>${new Date(k.fecha?.seconds? k.fecha.seconds*1000 : k.fecha).toLocaleString()}</td>
<td>${k.producto}</td>
<td>${k.tipo}</td>
<td>${k.cantidad}</td>
<td>${k.stockFinal}</td>
</tr>
`).join("");
}

/* ================= TOTAL ================= */
function total(){
return productos.reduce((a,p)=>
a + (p.stock||0)*(p.precio||0),0).toFixed(2);
}

</script>

</body>
</html>
