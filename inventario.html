<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGROMAXGTM - Inventario</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body class="bg-gray-100 min-h-screen">

  <!-- Header -->
  <header class="bg-green-700 text-white p-4 shadow">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold">
        <i class="fa-solid fa-boxes-stacked"></i> Inventario AGROMAXGTM
      </h1>
      <button class="bg-white text-green-700 px-4 py-2 rounded hover:bg-gray-200">
        <i class="fa-solid fa-plus"></i> Nuevo producto
      </button>
    </div>
  </header>

  <!-- Contenido -->
  <main class="max-w-6xl mx-auto p-4">

    <!-- Filtros -->
    <div class="bg-white p-4 rounded shadow mb-4 flex flex-col md:flex-row gap-2">
      <input type="text" placeholder="Buscar producto..."
        class="w-full md:w-1/3 border p-2 rounded">

      <select class="w-full md:w-1/4 border p-2 rounded">
        <option value="">Categoría</option>
        <option>Fertilizantes</option>
        <option>Semillas</option>
        <option>Herramientas</option>
      </select>

      <button class="bg-green-700 text-white px-4 py-2 rounded hover:bg-green-800">
        <i class="fa-solid fa-filter"></i> Filtrar
      </button>
    </div>

    <!-- Tabla -->
    <div class="bg-white shadow rounded overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead class="bg-green-700 text-white">
          <tr>
            <th class="p-3">Código</th>
            <th class="p-3">Producto</th>
            <th class="p-3">Categoría</th>
            <th class="p-3">Stock</th>
            <th class="p-3">Precio</th>
            <th class="p-3">Acciones</th>
          </tr>
        </thead>

        <tbody>
          <tr class="border-b hover:bg-gray-50">
            <td class="p-3">A001</td>
            <td class="p-3">Fertilizante NPK</td>
            <td class="p-3">Fertilizantes</td>
            <td class="p-3 text-green-700 font-bold">120</td>
            <td class="p-3">$25.00</td>
            <td class="p-3 space-x-2">
              <button class="text-blue-600 hover:underline"><i class="fa fa-edit"></i></button>
              <button class="text-red-600 hover:underline"><i class="fa fa-trash"></i></button>
            </td>
          </tr>

          <tr class="border-b hover:bg-gray-50">
            <td class="p-3">B002</td>
            <td class="p-3">Semilla de Maíz</td>
            <td class="p-3">Semillas</td>
            <td class="p-3 text-yellow-600 font-bold">45</td>
            <td class="p-3">$12.00</td>
            <td class="p-3 space-x-2">
              <button class="text-blue-600 hover:underline"><i class="fa fa-edit"></i></button>
              <button class="text-red-600 hover:underline"><i class="fa fa-trash"></i></button>
            </td>
          </tr>

          <tr class="border-b hover:bg-gray-50">
            <td class="p-3">C003</td>
            <td class="p-3">Pala agrícola</td>
            <td class="p-3">Herramientas</td>
            <td class="p-3 text-red-600 font-bold">8</td>
            <td class="p-3">$18.50</td>
            <td class="p-3 space-x-2">
              <button class="text-blue-600 hover:underline"><i class="fa fa-edit"></i></button>
              <button class="text-red-600 hover:underline"><i class="fa fa-trash"></i></button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </main>

</body>
</html>
