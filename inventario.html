<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGROMAXGTM - Inventario</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>

<body class="bg-gray-100">
<div class="flex h-screen">

  <!-- SIDEBAR -->
  <div class="w-72 bg-white border-r shadow-xl">
    <div class="p-6 border-b bg-green-700 text-white">
      <h1 class="text-2xl font-bold">AGROMAXGTM</h1>
      <p class="text-sm opacity-90">Centro de Inventario</p>
    </div>

    <nav class="p-4 space-y-1">
      <a href="admin.html"
        class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50">
        <i class="fas fa-arrow-left"></i> Volver al Admin
      </a>

      <a onclick="mostrarSeccion('dashboard')"
        class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer">
        <i class="fas fa-boxes-stacked"></i> Centro de Inventario
      </a>

      <a onclick="mostrarSeccion('inventario-fisico')"
        class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer">
        <i class="fas fa-clipboard-list"></i> Inventario Físico
      </a>

      <a onclick="mostrarSeccion('ajustes')"
        class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer">
        <i class="fas fa-tools"></i> Ajustes
      </a>
    </nav>
  </div>

  <div class="flex-1 overflow-auto p-8" id="main-content"></div>

</div>

<script>

/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyAEj22gE5UySwWVwIec6jpBiZ2nb1OBftM",
  authDomain: "agromaxgt-app.firebaseapp.com",
  projectId: "agromaxgt-app",
  storageBucket: "agromaxgt-app.firebasestorage.app",
  messagingSenderId: "648144313047",
  appId: "1:648144313047:web:118a67464d99f2d0462e92"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ================= STATE OPTIMIZADO ================= */
let productosCache = new Map();
let movimientosCache = [];
let listenersStarted = false;

/* ================= INIT ================= */
window.onload = () => {
  mostrarSeccion("dashboard");
  iniciarListeners();
};

/* ================= LISTENERS OPTIMIZADOS ================= */
function iniciarListeners() {
  if (listenersStarted) return;
  listenersStarted = true;

  db.collection("productos").onSnapshot(snapshot => {
    let changed = false;

    snapshot.docChanges().forEach(change => {
      const data = { id: change.doc.id, ...change.doc.data() };

      if (change.type === "added" || change.type === "modified") {
        productosCache.set(change.doc.id, data);
        changed = true;
      }

      if (change.type === "removed") {
        productosCache.delete(change.doc.id);
        changed = true;
      }
    });

    if (changed) actualizarKPIs();
  });

  db.collection("movimientos")
    .limit(10)
    .onSnapshot(snapshot => {
      movimientosCache = snapshot.docs.map(d => d.data());
      renderMovimientos();
    });
}

/* ================= UI ================= */
function mostrarSeccion(seccion) {
  const content = document.getElementById("main-content");

  if (seccion === "dashboard") {
    content.innerHTML = renderDashboard();
    actualizarKPIs();
    renderMovimientos();
  }

  if (seccion === "inventario-fisico") {
    content.innerHTML = `
      <div class="bg-white p-8 rounded-2xl shadow">
        <h1 class="text-3xl font-bold mb-4">📋 Inventario Físico</h1>
        <p class="text-gray-600 mb-6">Exportación lista para PDF.</p>
        <button onclick="generarPDFInventario()"
          class="bg-green-600 text-white px-6 py-3 rounded-2xl hover:bg-green-700">
          Generar PDF
        </button>
      </div>
    `;
  }

  if (seccion === "ajustes") {
    content.innerHTML = `
      <div class="bg-white p-8 rounded-2xl shadow">
        <h1 class="text-3xl font-bold mb-4">⚙️ Ajustes</h1>
        <p class="text-gray-600">Sistema sincronizado en tiempo real.</p>
      </div>
    `;
  }
}

/* ================= DASHBOARD ================= */
function renderDashboard() {
  return `
    <h1 class="text-4xl font-bold text-green-700 mb-6">
      📦 Centro de Inventario AGROMAX
    </h1>

    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">

      <div class="bg-white p-6 rounded-2xl shadow">
        <span class="text-gray-500">Productos</span>
        <h2 id="kpi-productos" class="text-4xl font-bold mt-3">0</h2>
      </div>

      <div class="bg-white p-6 rounded-2xl shadow">
        <span class="text-gray-500">Stock Bajo</span>
        <h2 id="kpi-bajo" class="text-4xl font-bold mt-3 text-yellow-600">0</h2>
      </div>

      <div class="bg-white p-6 rounded-2xl shadow">
        <span class="text-gray-500">Agotados</span>
        <h2 id="kpi-agotados" class="text-4xl font-bold mt-3 text-red-600">0</h2>
      </div>

      <div class="bg-white p-6 rounded-2xl shadow">
        <span class="text-gray-500">Valor</span>
        <h2 id="kpi-valor" class="text-4xl font-bold mt-3 text-blue-600">Q0.00</h2>
      </div>

    </div>

    <div class="bg-white rounded-2xl shadow p-6">
      <h2 class="text-2xl font-bold mb-4">📊 Movimientos</h2>
      <table class="w-full">
        <tbody id="movimientos"></tbody>
      </table>
    </div>
  `;
}

/* ================= KPIs OPTIMIZADOS ================= */
function actualizarKPIs() {
  const productos = Array.from(productosCache.values());

  let total = productos.length;
  let bajo = 0;
  let agotados = 0;
  let valor = 0;

  for (let p of productos) {
    const stock = p.stock || 0;
    const precio = p.precio || 0;

    if (stock === 0) agotados++;
    else if (stock < 10) bajo++;

    valor += stock * precio;
  }

  setText("kpi-productos", total);
  setText("kpi-bajo", bajo);
  setText("kpi-agotados", agotados);
  setText("kpi-valor", "Q" + valor.toFixed(2));
}

/* ================= MOVIMIENTOS ================= */
function renderMovimientos() {
  const el = document.getElementById("movimientos");
  if (!el) return;

  if (!movimientosCache.length) {
    el.innerHTML = `<tr><td>Sin movimientos</td></tr>`;
    return;
  }

  el.innerHTML = movimientosCache.map(m => `
    <tr class="border-b">
      <td>${m.fecha || "-"}</td>
      <td>${m.producto || "-"}</td>
      <td>${m.tipo || "-"}</td>
      <td>${m.cantidad || 0}</td>
    </tr>
  `).join("");
}

/* ================= HELPERS ================= */
function setText(id, value) {
  const el = document.getElementById(id);
  if (el) el.innerText = value;
}

/* ================= PDF ================= */
function generarPDFInventario() {
  alert("📦 Listo para exportación PDF optimizada");
}
</script>

</body>
</html>
