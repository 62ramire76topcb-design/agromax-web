<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGROMAXGTM - Inventario PRO</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>

<body class="bg-gray-100">
<div class="flex h-screen">

<!-- SIDEBAR -->
<div class="w-72 bg-white border-r shadow-xl">
  <div class="p-6 bg-green-700 text-white">
    <h1 class="text-2xl font-bold">AGROMAXGTM</h1>
    <p class="text-sm">Inventario PRO</p>
  </div>

  <nav class="p-4 space-y-2">
    <a onclick="view('dashboard')" class="cursor-pointer block p-3 rounded-xl hover:bg-green-50">
      📊 Dashboard
    </a>
    <a onclick="view('movimientos')" class="cursor-pointer block p-3 rounded-xl hover:bg-green-50">
      🔄 Movimientos
    </a>
    <a onclick="view('ajustes')" class="cursor-pointer block p-3 rounded-xl hover:bg-green-50">
      ⚙️ Ajustes
    </a>
  </nav>
</div>

<!-- MAIN -->
<div class="flex-1 p-6 overflow-auto" id="main"></div>

</div>

<script>

/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyAEj22gE5UySwWVwIec6jpBiZ2nb1OBftM",
  authDomain: "agromaxgt-app.firebaseapp.com",
  projectId: "agromaxgt-app",
  storageBucket: "agromaxgt-app.firebasestorage.app",
  messagingSenderId: "648144313047",
  appId: "1:648144313047:web:118a67464d99f2d0462e92"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ================= STATE ================= */
let productos = [];
let selectedProduct = null;

/* ================= INIT ================= */
window.onload = () => {
  view("dashboard");

  db.collection("productos").onSnapshot(snap => {
    productos = snap.docs.map(d => ({id:d.id,...d.data()}));
    renderDashboard();
  });
};

/* ================= NAV ================= */
function view(v){
  const main = document.getElementById("main");

  if(v==="dashboard"){
    main.innerHTML = dashboardHTML();
    renderDashboard();
  }

  if(v==="movimientos"){
    main.innerHTML = movimientosHTML();
    loadMovimientos();
  }

  if(v==="ajustes"){
    main.innerHTML = `<h2 class="text-2xl font-bold">Ajustes</h2>`;
  }
}

/* ================= DASHBOARD ================= */
function dashboardHTML(){
return `
<h1 class="text-3xl font-bold mb-6">📦 Inventario PRO</h1>

<div class="grid grid-cols-4 gap-4 mb-6">
  <div class="bg-white p-4 rounded-xl shadow">Productos <h2 id="t1">0</h2></div>
  <div class="bg-white p-4 rounded-xl shadow">Bajo Stock <h2 id="t2">0</h2></div>
  <div class="bg-white p-4 rounded-xl shadow">Agotados <h2 id="t3">0</h2></div>
  <div class="bg-white p-4 rounded-xl shadow">Valor <h2 id="t4">Q0</h2></div>
</div>

<div class="bg-white p-4 rounded-xl shadow">
<h2 class="font-bold mb-4">⚡ Control de Stock</h2>

<select id="productSelect" onchange="selectProduct()" class="w-full p-2 border rounded mb-3">
<option>Seleccionar producto</option>
</select>

<input id="qty" type="number" placeholder="Cantidad" class="w-full p-2 border rounded mb-3">

<div class="flex gap-2">
<button onclick="entrada()" class="bg-green-600 text-white px-4 py-2 rounded">Entrada</button>
<button onclick="salida()" class="bg-red-600 text-white px-4 py-2 rounded">Salida</button>
<button onclick="ajuste()" class="bg-blue-600 text-white px-4 py-2 rounded">Ajuste</button>
</div>
</div>
`;
}

/* ================= MOVIMIENTOS ================= */
function movimientosHTML(){
return `
<h2 class="text-2xl font-bold mb-4">Movimientos</h2>
<div id="movs"></div>
`;
}

/* ================= RENDER DASHBOARD ================= */
function renderDashboard(){

const select = document.getElementById("productSelect");
if(select){
select.innerHTML = productos.map(p =>
`<option value="${p.id}">${p.nombre}</option>`).join("");
}

let total = productos.length;
let bajo = 0;
let agot = 0;
let valor = 0;

productos.forEach(p=>{
  let s = p.stock||0;
  let pr = p.precio||0;

  if(s===0) agot++;
  else if(s<10) bajo++;

  valor += s*pr;
});

set("t1",total);
set("t2",bajo);
set("t3",agot);
set("t4","Q"+valor.toFixed(2));
}

/* ================= SELECCIÓN ================= */
function selectProduct(){
selectedProduct = document.getElementById("productSelect").value;
}

/* ================= MOVIMIENTOS ================= */
async function entrada(){
await movimiento("entrada", +1);
}

async function salida(){
await movimiento("salida", -1);
}

async function ajuste(){
await movimiento("ajuste", 0);
}

/* ================= CORE LOGIC ================= */
async function movimiento(tipo, factor){

if(!selectedProduct) return alert("Selecciona producto");

let qty = parseInt(document.getElementById("qty").value || 0);
if(qty<=0) return alert("Cantidad inválida");

let ref = db.collection("productos").doc(selectedProduct);
let doc = await ref.get();

if(!doc.exists) return;

let stock = doc.data().stock || 0;

let nuevo = stock;

if(tipo==="entrada") nuevo += qty;
if(tipo==="salida") nuevo -= qty;
if(tipo==="ajuste") nuevo = qty;

if(nuevo < 0) return alert("❌ Stock no puede ser negativo");

await ref.update({stock:nuevo});

await db.collection("movimientos").add({
producto: doc.data().nombre,
tipo,
cantidad: qty,
fecha: new Date().toLocaleString()
});

document.getElementById("qty").value = "";
}

/* ================= LOAD MOVIMIENTOS ================= */
function loadMovimientos(){
db.collection("movimientos")
.orderBy("fecha","desc")
.limit(20)
.onSnapshot(snap=>{
let html="";
snap.forEach(d=>{
let m=d.data();
html+=`
<div class="bg-white p-3 mb-2 rounded shadow">
<b>${m.producto}</b> - ${m.tipo} - ${m.cantidad}
</div>`;
});
document.getElementById("movs").innerHTML=html;
});
}

/* ================= HELP ================= */
function set(id,val){
let el=document.getElementById(id);
if(el) el.innerText=val;
}

</script>

</body>
</html>
