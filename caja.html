<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Caja POS</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>

<body class="bg-gray-100">

<div class="p-6">

<h1 class="text-2xl font-bold mb-4">CAJA REGISTRADORA</h1>

<input id="scan"
class="w-full p-4 border"
placeholder="Escanear producto..."
onkeypress="if(event.key==='Enter') scan()">

<div id="venta" class="mt-6"></div>

<button onclick="finalizar()"
class="mt-6 bg-green-600 text-white px-4 py-2">
Finalizar Venta
</button>

</div>

<script>

firebase.initializeApp({
  apiKey:"TU_KEY",
  projectId:"TU_ID"
});

const db = firebase.firestore();

let venta = [];

/* ================= CARGAR VENTA ================= */
db.collection("caja")
.where("estado","==","en_caja")
.limit(1)
.onSnapshot(snap=>{

  snap.forEach(doc=>{
    venta = doc.data().productos || [];
    render();
  });

});

/* ================= ESCANEAR ================= */
function scan(){

  const code = document.getElementById("scan").value.toLowerCase();

  const item = venta.find(p=>p.nombre.toLowerCase().includes(code));

  if(!item){
    alert("NO pertenece a esta venta");
    return;
  }

  alert("Producto validado");
}

/* ================= RENDER ================= */
function render(){

  document.getElementById("venta").innerHTML =
  venta.map(p=>`
    <div class="p-2 border bg-white">
      ${p.nombre} x ${p.cantidad}
    </div>
  `).join("");
}

/* ================= FINALIZAR ================= */
async function finalizar(){

  for(const item of venta){

    const q = await db.collection("productos")
    .where("nombre","==",item.nombre).get();

    q.forEach(async doc=>{
      const stock = doc.data().stock || 0;

      await db.collection("productos").doc(doc.id).update({
        stock: stock - item.cantidad
      });
    });

  }

  await db.collection("ventas").add({
    fecha:new Date(),
    productos:venta,
    tipo:"CAJA FINAL",
    total:0
  });

  alert("Venta finalizada");

  venta = [];
}

</script>

</body>
</html>
