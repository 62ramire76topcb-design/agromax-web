<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGROMAXGTM - Caja Registradora</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100">

  <div class="flex h-screen">
    <div class="w-72 bg-white border-r shadow-xl overflow-y-auto">
      <div class="p-6 border-b bg-green-700 text-white">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-white rounded-2xl flex items-center justify-center text-green-700 text-3xl">🌱</div>
          <div>
            <h1 class="text-2xl font-bold">AGROMAXGTM</h1>
            <p class="text-xs">Caja Registradora</p>
          </div>
        </div>
      </div>
      <nav class="p-4 space-y-1">
        <a href="admin.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-arrow-left"></i> Volver al Admin</a>
        <a onclick="mostrarSeccion('nueva-venta')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-cash-register"></i> Nueva Venta</a>
        <a onclick="mostrarSeccion('pendientes')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-clock"></i> Ventas Pendientes</a>
        <a onclick="mostrarSeccion('historial')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-history"></i> Historial</a>
      </nav>
    </div>

    <div class="flex-1 overflow-auto p-8" id="main-content"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAEj22gE5UySwWVwIec6jpBiZ2nb1OBftM",
      authDomain: "agromaxgt-app.firebaseapp.com",
      projectId: "agromaxgt-app",
      storageBucket: "agromaxgt-app.firebasestorage.app",
      messagingSenderId: "648144313047",
      appId: "1:648144313047:web:118a67464d99f2d0462e92"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let carrito = [];

    async function verificarAuth() {
      return new Promise(resolve => {
        auth.onAuthStateChanged(user => {
          if (!user) window.location.href = "admin.html";
          else resolve(user);
        });
      });
    }

    async function mostrarSeccion(seccion) {
      await verificarAuth();
      const content = document.getElementById('main-content');

      if (seccion === 'nueva-venta') {
        content.innerHTML = `
          <h1 class="text-4xl font-bold mb-8">🛒 Caja Registradora</h1>
          <div class="grid grid-cols-12 gap-8">
            <!-- Escáner -->
            <div class="col-span-7 bg-white p-8 rounded-3xl shadow">
              <input id="barcode" placeholder="Escanea código de barras o escribe nombre..." 
                     class="w-full p-6 text-xl border-4 border-green-500 rounded-3xl focus:border-green-600" autofocus 
                     onkeypress="if(event.key==='Enter') procesarScan()">
              <div id="resultados" class="mt-6 max-h-96 overflow-auto border rounded-2xl"></div>
            </div>

            <!-- Carrito -->
            <div class="col-span-5 bg-white p-8 rounded-3xl shadow">
              <h2 class="text-2xl font-bold mb-6">Carrito</h2>
              <div id="lista-carrito" class="space-y-4 min-h-96"></div>
              <div class="mt-8 pt-6 border-t">
                <div class="flex justify-between text-3xl font-bold">
                  <span>Total:</span>
                  <span id="total-caja" class="text-green-600">Q0.00</span>
                </div>
              </div>
              <button onclick="finalizarVenta()" class="mt-8 w-full bg-green-700 hover:bg-green-800 text-white py-6 rounded-3xl text-2xl font-bold">
                💰 Finalizar Venta
              </button>
            </div>
          </div>`;
      } 
      else if (seccion === 'pendientes') {
        content.innerHTML = `<h1 class="text-4xl font-bold mb-8">📋 Ventas Pendientes</h1><div id="lista-pendientes" class="space-y-6"></div>`;
        cargarPendientes();
      } 
      else if (seccion === 'historial') {
        content.innerHTML = `<h1 class="text-3xl font-bold mb-8">Historial de Caja</h1><div id="historial-caja" class="space-y-6"></div>`;
        cargarHistorial();
      }
    }

    // ==================== ESCANER ====================
    async function procesarScan() {
      const input = document.getElementById('barcode').value.trim();
      if (!input) return;

      const snapshot = await db.collection('productos').get();
      let encontrado = false;

      snapshot.forEach(doc => {
        const p = doc.data();
        if (p.nombre && p.nombre.toLowerCase().includes(input.toLowerCase())) {
          agregarAlCarrito(p.nombre, p.precio || 0);
          encontrado = true;
        }
      });

      if (!encontrado) alert("Producto no encontrado");
      document.getElementById('barcode').value = '';
    }

    function agregarAlCarrito(nombre, precio) {
      const existe = carrito.find(i => i.nombre === nombre);
      if (existe) existe.cantidad++;
      else carrito.push({nombre, precio, cantidad: 1});
      renderCarrito();
    }

    function renderCarrito() {
      const container = document.getElementById('lista-carrito');
      let total = 0;
      let html = '';

      carrito.forEach((item, i) => {
        const subtotal = item.precio * item.cantidad;
        total += subtotal;
        html += `
          <div class="flex justify-between items-center bg-gray-50 p-4 rounded-2xl">
            <span>${item.nombre} × ${item.cantidad}</span>
            <span class="font-bold">Q${subtotal.toFixed(2)}</span>
            <button onclick="eliminarItem(${i})" class="text-red-600">Eliminar</button>
          </div>`;
      });

      container.innerHTML = html || '<p class="text-gray-400 py-12 text-center">Carrito vacío</p>';
      document.getElementById('total-caja').textContent = `Q${total.toFixed(2)}`;
    }

    function eliminarItem(i) {
      carrito.splice(i, 1);
      renderCarrito();
    }

    async function finalizarVenta() {
      if (carrito.length === 0) return alert("Carrito vacío");

      const total = carrito.reduce((sum, item) => sum + item.precio * item.cantidad, 0);

      if (confirm(`¿Finalizar venta por Q${total.toFixed(2)}?`)) {
        try {
          // Registrar venta
          await db.collection('ventas').add({
            fecha: new Date(),
            tipo: "Caja Registradora",
            productos: carrito,
            total,
            estado: "Completada"
          });

          // Actualizar stock
          for (let item of carrito) {
            const query = await db.collection('productos').where('nombre', '==', item.nombre).get();
            query.forEach(async (doc) => {
              const stock = doc.data().stock || 0;
              await db.collection('productos').doc(doc.id).update({ stock: Math.max(0, stock - item.cantidad) });
            });
          }

          alert("✅ Venta completada y stock actualizado");
          carrito = [];
          mostrarSeccion('nueva-venta');
        } catch (e) {
          alert("Error: " + e.message);
        }
      }
    }

    // ==================== VENTAS PENDIENTES ====================
    async function cargarPendientes() {
      const container = document.getElementById('lista-pendientes');
      db.collection('ventas_pendientes').where('estado', '==', 'Pendiente').orderBy('fecha', 'desc').onSnapshot(snapshot => {
        let html = '';
        snapshot.forEach(doc => {
          const v = doc.data();
          html += `
            <div class="bg-white rounded-3xl shadow p-6">
              <div class="flex justify-between">
                <div>
                  <p class="font-bold">${v.cliente}</p>
                  <p class="text-sm text-gray-500">${v.fecha.toDate().toLocaleString('es-GT')}</p>
                </div>
                <span class="px-4 py-1 bg-yellow-100 text-yellow-700 rounded-full">Pendiente</span>
              </div>
              <div class="mt-4 text-sm">
                ${v.productos.map(p => `${p.nombre} × ${p.cantidad}`).join(' • ')}
              </div>
              <button onclick="procesarPendiente('${doc.id}', ${JSON.stringify(v.productos)})" 
                      class="mt-6 w-full bg-green-600 text-white py-4 rounded-2xl">Procesar Pago</button>
            </div>`;
        });
        container.innerHTML = html || '<p class="text-center py-20 text-gray-400">No hay ventas pendientes</p>';
      });
    }

    async function procesarPendiente(id, productos) {
      if (confirm("¿Procesar pago y actualizar stock?")) {
        try {
          for (let item of productos) {
            const query = await db.collection('productos').where('nombre', '==', item.nombre).get();
            query.forEach(async (doc) => {
              const stock = doc.data().stock || 0;
              await db.collection('productos').doc(doc.id).update({
                stock: Math.max(0, stock - item.cantidad)
              });
            });
          }

          await db.collection('ventas_pendientes').doc(id).update({ estado: "Completada" });
          alert("✅ Pago procesado y stock actualizado");
          mostrarSeccion('pendientes');
        } catch (e) {
          alert("Error: " + e.message);
        }
      }
    }

    window.onload = () => mostrarSeccion('nueva-venta');
  </script>
</body>
</html>
