<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGROMAXGTM - Caja Registradora PRO</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>

<body class="bg-gray-100">

<div class="flex h-screen">

<!-- SIDEBAR -->
<div class="w-72 bg-white border-r shadow-xl overflow-y-auto">
  <div class="p-6 border-b bg-green-700 text-white">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-white rounded-2xl flex items-center justify-center text-green-700 text-3xl">🌱</div>
      <div>
        <h1 class="text-2xl font-bold">AGROMAXGTM</h1>
        <p class="text-xs">Caja Registradora PRO</p>
      </div>
    </div>
  </div>

  <nav class="p-4 space-y-2">
    <a href="admin.html" class="block p-3 hover:bg-green-50 rounded-xl">
      <i class="fas fa-arrow-left"></i> Volver al Admin
    </a>
    <a onclick="nuevaVenta()" class="block p-3 hover:bg-green-50 rounded-xl">
      <i class="fas fa-cash-register"></i> Nueva Venta
    </a>
    <a onclick="view('pendientes')" class="block p-3 hover:bg-green-50 rounded-xl">
      <i class="fas fa-clock"></i> Ventas Pendientes
    </a>
    <a onclick="view('historial')" class="block p-3 hover:bg-green-50 rounded-xl">
      <i class="fas fa-history"></i> Historial Caja
    </a>
  </nav>
</div>

<!-- MAIN CONTENT -->
<div class="flex-1 p-8 overflow-auto" id="app"></div>

</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyAEj22gE5UySwWVwIec6jpBiZ2nb1OBftM",
  authDomain: "agromaxgt-app.firebaseapp.com",
  projectId: "agromaxgt-app"
});

const db = firebase.firestore();
const auth = firebase.auth();

let carrito = [];
let clienteActual = "Cliente General";

/* ================= AUTH ================= */
auth.onAuthStateChanged(user => {
  if (!user) window.location.href = "admin.html";
});

/* ================= NUEVA VENTA ================= */
function nuevaVenta() {
  carrito = [];
  clienteActual = "Cliente General";
  view("venta");
}

/* ================= CAMBIAR VISTA ================= */
function view(v) {
  const app = document.getElementById("app");

  if (v === "venta") {
    app.innerHTML = `
      <div class="max-w-6xl mx-auto">
        <h1 class="text-4xl font-bold mb-2">🛒 Nueva Venta</h1>
        
        <input id="cliente" value="${clienteActual}" 
               class="w-full mb-6 p-5 border-2 border-gray-300 rounded-3xl text-lg focus:border-green-500" 
               placeholder="Nombre del cliente (opcional)" 
               onchange="clienteActual = this.value">

        <div class="grid grid-cols-12 gap-8">
          <!-- Buscador -->
          <div class="col-span-7 bg-white p-8 rounded-3xl shadow-xl">
            <input id="search" placeholder="Buscar producto por nombre..." 
                   class="w-full p-6 text-xl border-2 border-green-400 rounded-3xl focus:outline-none" 
                   autofocus onkeyup="if(event.key==='Enter') buscar()">
            <div id="results" class="mt-6 max-h-[65vh] overflow-auto pr-2"></div>
          </div>

          <!-- Carrito -->
          <div class="col-span-5 bg-white p-8 rounded-3xl shadow-xl">
            <h2 class="text-2xl font-bold mb-6">Carrito</h2>
            <div id="cart" class="min-h-[380px] max-h-[65vh] overflow-auto"></div>
            
            <div class="mt-8 pt-8 border-t border-gray-200">
              <div class="flex justify-between items-baseline text-4xl font-bold mb-8">
                <span>Total:</span>
                <span id="total" class="text-green-600">Q0.00</span>
              </div>
              
              <button onclick="guardarPendiente()" 
                      class="w-full mb-4 bg-yellow-500 hover:bg-yellow-600 py-6 rounded-3xl text-white font-bold text-xl">
                💾 Guardar como Pendiente
              </button>
              <button onclick="finalizarVenta()" 
                      class="w-full bg-green-700 hover:bg-green-800 py-6 rounded-3xl text-white font-bold text-xl">
                ✅ Finalizar Venta y Actualizar Stock
              </button>
            </div>
          </div>
        </div>
      </div>
    `;
    setTimeout(() => document.getElementById("search").focus(), 150);
  }

  if (v === "pendientes") cargarPendientes();
  if (v === "historial") cargarHistorial();
}

/* ================= BUSCAR PRODUCTO ================= */
async function buscar() {
  const term = document.getElementById("search").value.toLowerCase().trim();
  const box = document.getElementById("results");
  if (term.length < 2) {
    box.innerHTML = "";
    return;
  }

  const snap = await db.collection("productos").limit(30).get();
  let html = "";

  snap.forEach(doc => {
    const p = doc.data();
    if (p.nombre && p.nombre.toLowerCase().includes(term)) {
      html += `
        <div onclick="add('${doc.id}','${p.nombre}',${p.precio||0},${p.stock||0})" 
             class="p-5 hover:bg-green-50 rounded-2xl cursor-pointer flex justify-between items-center border-b">
          <span class="font-medium">${p.nombre}</span>
          <span class="text-green-600 font-bold">Q${p.precio||0} • Stock: ${p.stock||0}</span>
        </div>`;
    }
  });

  box.innerHTML = html || `<p class="p-8 text-center text-gray-400">No se encontró el producto</p>`;
}

/* ================= CARRITO ================= */
function add(id, nombre, precio, stock) {
  if (stock <= 0) return alert("❌ Sin stock disponible");
  
  let item = carrito.find(i => i.id === id);
  if (item) item.cantidad++;
  else carrito.push({id, nombre, precio, cantidad: 1});

  renderCarrito();
}

function renderCarrito() {
  const box = document.getElementById("cart");
  let total = 0;
  let html = "";

  carrito.forEach((item, i) => {
    const subtotal = item.precio * item.cantidad;
    total += subtotal;
    html += `
      <div class="flex justify-between items-center p-5 bg-gray-50 rounded-2xl mb-3">
        <div>
          <p class="font-medium">${item.nombre}</p>
          <p class="text-sm text-gray-500">Cantidad: ${item.cantidad}</p>
        </div>
        <div class="text-right">
          <p class="font-bold text-lg">Q${subtotal.toFixed(2)}</p>
          <button onclick="del(${i})" class="text-red-600 text-sm mt-1 hover:underline">Eliminar</button>
        </div>
      </div>`;
  });

  box.innerHTML = html || `<p class="text-center py-20 text-gray-400 text-xl">El carrito está vacío</p>`;
  if (document.getElementById("total")) document.getElementById("total").textContent = `Q${total.toFixed(2)}`;
}

function del(i) {
  carrito.splice(i, 1);
  renderCarrito();
}

/* ================= GUARDAR PENDIENTE ================= */
async function guardarPendiente() {
  if (carrito.length === 0) return alert("Carrito vacío");

  try {
    await db.collection("ventas_pendientes").add({
      fecha: firebase.firestore.FieldValue.serverTimestamp(),
      cliente: clienteActual,
      productos: carrito,
      estado: "pendiente",
      timestamp: Date.now()
    });

    alert("✅ Venta guardada como pendiente");
    nuevaVenta();
  } catch (e) {
    alert("Error al guardar pendiente: " + e.message);
  }
}

/* ================= FINALIZAR VENTA ================= */
async function finalizarVenta() {
  if (carrito.length === 0) return alert("Carrito vacío");
  if (!confirm("¿Finalizar venta y descontar del inventario?")) return;

  try {
    await db.runTransaction(async (tx) => {
      let total = 0;

      for (const item of carrito) {
        const prodRef = db.collection("productos").doc(item.id);
        const snap = await tx.get(prodRef);

        if (!snap.exists) throw "Producto no encontrado";
        const data = snap.data();

        if ((data.stock || 0) < item.cantidad) {
          throw `Stock insuficiente para ${item.nombre}`;
        }

        tx.update(prodRef, { stock: data.stock - item.cantidad });
        total += item.precio * item.cantidad;
      }

      tx.set(db.collection("ventas").doc(), {
        fecha: firebase.firestore.FieldValue.serverTimestamp(),
        cliente: clienteActual,
        productos: carrito,
        total: total,
        tipo: "CAJA"
      });
    });

    alert("🎉 Venta finalizada correctamente\nStock actualizado en inventario");
    nuevaVenta();

  } catch (e) {
    console.error(e);
    alert("Error: " + (e.message || e));
  }
}

/* ================= VENTAS PENDIENTES ================= */
function cargarPendientes() {
  document.getElementById("app").innerHTML = `
    <h1 class="text-4xl font-bold mb-8">📋 Ventas Pendientes</h1>
    <div id="pend-list" class="space-y-4"></div>
  `;

  db.collection("ventas_pendientes")
    .where("estado", "==", "pendiente")
    .orderBy("timestamp", "desc")
    .onSnapshot(snapshot => {
      let html = "";
      snapshot.forEach(doc => {
        const v = doc.data();
        html += `
          <div class="bg-white p-6 rounded-3xl shadow flex justify-between items-center">
            <div>
              <p class="font-bold">${v.cliente || 'Cliente General'}</p>
              <p class="text-sm text-gray-500">${v.fecha && v.fecha.toDate ? v.fecha.toDate().toLocaleString('es-GT') : 'Reciente'}</p>
            </div>
            <button onclick="abrirPendiente('${doc.id}')" 
                    class="bg-green-600 hover:bg-green-700 text-white px-8 py-4 rounded-2xl font-bold">Abrir Venta</button>
          </div>`;
      });
      document.getElementById("pend-list").innerHTML = html || 
        `<p class="text-center py-20 text-gray-400 text-xl">No hay ventas pendientes</p>`;
    });
}

async function abrirPendiente(id) {
  const doc = await db.collection("ventas_pendientes").doc(id).get();
  if (doc.exists) {
    carrito = doc.data().productos || [];
    clienteActual = doc.data().cliente || "Cliente General";
    view("venta");
    setTimeout(renderCarrito, 300);
  }
}

/* ================= HISTORIAL ================= */
function cargarHistorial() {
  document.getElementById("app").innerHTML = `
    <h1 class="text-4xl font-bold mb-8">Historial de Ventas</h1>
    <div id="hist-list" class="space-y-4"></div>
  `;

  db.collection("ventas")
    .orderBy("fecha", "desc")
    .onSnapshot(snapshot => {
      let html = "";
      snapshot.forEach(doc => {
        const v = doc.data();
        html += `
          <div class="bg-white p-6 rounded-3xl shadow">
            <p class="font-bold">${v.cliente || 'Cliente General'}</p>
            <p class="text-sm text-gray-500">${v.fecha && v.fecha.toDate ? v.fecha.toDate().toLocaleString('es-GT') : ''}</p>
            <p class="text-2xl font-bold text-green-600 mt-3">Total: Q${v.total || 0}</p>
          </div>`;
      });
      document.getElementById("hist-list").innerHTML = html || 
        `<p class="text-center py-20 text-gray-400 text-xl">Aún no hay ventas completadas</p>`;
    });
}

/* INICIO */
nuevaVenta();
</script>
</body>
</html>
