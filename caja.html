<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGROMAXGTM - Ventas PRO</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
</head>

<body class="bg-gray-100">

<div class="flex h-screen">

<!-- SIDEBAR -->
<div class="w-72 bg-white border-r shadow-xl">
  <div class="p-6 bg-green-700 text-white">
    <h1 class="text-xl font-bold">AGROMAX VENTAS</h1>
    <p class="text-xs">Pendientes → Caja</p>
  </div>

  <nav class="p-4 space-y-2">
    <a onclick="view('venta')" class="block p-3 hover:bg-green-50 rounded-xl">🛒 Nueva Venta</a>
    <a onclick="view('pendientes')" class="block p-3 hover:bg-green-50 rounded-xl">⏳ Ventas Pendientes</a>
  </nav>
</div>

<!-- MAIN -->
<div class="flex-1 p-8" id="app"></div>

</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyAEj22gE5UySwWVwIec6jpBiZ2nb1OBftM",
  authDomain:"agromaxgt-app.firebaseapp.com",
  projectId:"agromaxgt-app"
});

const db = firebase.firestore();

let carrito = [];

/* ================= VIEW ================= */
function view(v){
const app = document.getElementById("app");

if(v==="venta"){
app.innerHTML=`
<h1 class="text-3xl font-bold mb-6">Nueva Venta</h1>

<input id="search" onkeyup="buscar()"
class="w-full p-4 border rounded-xl mb-4"
placeholder="Buscar producto">

<div id="results"></div>

<div id="cart" class="mt-6"></div>

<button onclick="guardarPendiente()" 
class="bg-yellow-500 text-white p-4 rounded-xl w-full mt-4">
Guardar Pendiente
</button>

<button onclick="finalizarVenta()" 
class="bg-green-700 text-white p-4 rounded-xl w-full mt-2">
Finalizar → Caja
</button>
`;
}

if(v==="pendientes") cargarPendientes();
}

/* ================= BUSCAR ================= */
async function buscar(){
const t=document.getElementById("search").value.toLowerCase();
const box=document.getElementById("results");

const snap=await db.collection("productos").limit(30).get();

let html="";

snap.forEach(doc=>{
const p=doc.data();
if(p.nombre.toLowerCase().includes(t)){
html+=`
<div onclick="add('${doc.id}','${p.nombre}',${p.precio||0},${p.stock||0})"
class="p-2 bg-white border rounded mb-2 cursor-pointer">
${p.nombre} - Stock ${p.stock}
</div>`;
}
});

box.innerHTML=html;
}

/* ================= CART ================= */
function add(id,nombre,precio,stock){

if(stock<=0) return alert("Sin stock");

let item=carrito.find(p=>p.id===id);

if(item) item.cantidad++;
else carrito.push({id,nombre,precio,cantidad:1});

render();
}

function render(){
const box=document.getElementById("cart");
let html="";

carrito.forEach((p,i)=>{
html+=`
<div class="flex justify-between p-2 border-b">
${p.nombre} x ${p.cantidad}
<button onclick="del(${i})">X</button>
</div>`;
});

box.innerHTML=html;
}

function del(i){
carrito.splice(i,1);
render();
}

/* ================= PENDIENTE ================= */
async function guardarPendiente(){

if(carrito.length===0) return alert("Vacío");

await db.collection("ventas_pendientes").add({
fecha:new Date(),
productos:carrito,
estado:"pendiente"
});

carrito=[];
render();
alert("Guardado en pendientes");
}

/* ================= FINALIZAR ================= */
async function finalizarVenta(){

if(carrito.length===0) return;

const ventaRef=db.collection("ventas").doc();

await db.runTransaction(async(tx)=>{

let total=0;

for(let item of carrito){

const ref=db.collection("productos").doc(item.id);
const snap=await tx.get(ref);

let data=snap.data();

if(data.stock<item.cantidad)
throw "Sin stock";

tx.update(ref,{
stock:data.stock-item.cantidad
});

total+=item.precio*item.cantidad;
}

tx.set(ventaRef,{
fecha:new Date(),
productos:carrito,
total,
estado:"COMPLETADA"
});

});

alert("Venta enviada a caja");
carrito=[];
render();
}

/* ================= PENDIENTES ================= */
function cargarPendientes(){

const app=document.getElementById("app");

app.innerHTML=`<h2>Pendientes</h2><div id="list"></div>`;

db.collection("ventas_pendientes").onSnapshot(snap=>{

let html="";

snap.forEach(doc=>{
const v=doc.data();

html+=`
<div class="p-3 bg-white border mb-2">
<button onclick="abrirPendiente('${doc.id}')">
Abrir Venta
</button>
</div>`;
});

document.getElementById("list").innerHTML=html;
});
}

async function abrirPendiente(id){

const doc=await db.collection("ventas_pendientes").doc(id).get();

carrito=doc.data().productos;

view("venta");
setTimeout(render,200);
}

view("venta");
</script>

</body>
</html>
