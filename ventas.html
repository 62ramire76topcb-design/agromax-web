<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGROMAXGTM - VENTAS TRI MODE</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>

<body class="bg-gray-100">

<div class="flex h-screen">

<!-- SIDEBAR -->
<div class="w-72 bg-white border-r shadow-xl">
  <div class="p-6 bg-green-700 text-white">
    <h1 class="text-2xl font-bold">AGROMAX TRI</h1>
    <p class="text-xs">Ventas + Inventario + Kardex</p>
  </div>

  <nav class="p-4 space-y-2">
    <a onclick="view('venta')" class="block p-3 rounded-xl hover:bg-green-50 cursor-pointer">
      <i class="fas fa-cash-register"></i> Venta
    </a>

    <a onclick="view('historial')" class="block p-3 rounded-xl hover:bg-green-50 cursor-pointer">
      <i class="fas fa-history"></i> Historial
    </a>

    <a onclick="view('kardex')" class="block p-3 rounded-xl hover:bg-green-50 cursor-pointer">
      <i class="fas fa-boxes"></i> Kardex
    </a>
  </nav>
</div>

<!-- MAIN -->
<div class="flex-1 p-8 overflow-auto" id="app"></div>

</div>

<script>
/* ================= FIREBASE ================= */
firebase.initializeApp({
  apiKey: "TU_API",
  authDomain: "TU_AUTH",
  projectId: "TU_PROJECT"
});

const db = firebase.firestore();

/* ================= VARIABLES ================= */
let carrito = [];

/* ================= VISTA ================= */
function view(v){
  const app = document.getElementById("app");

  if(v === "venta"){
    app.innerHTML = `
      <h1 class="text-3xl font-bold mb-6">💰 Punto de Venta</h1>

      <div class="bg-white p-6 rounded-3xl shadow">

        <input id="buscar" onkeyup="buscarProducto()"
        class="w-full p-4 border rounded-2xl mb-4"
        placeholder="Buscar producto...">

        <div id="resultados" class="max-h-60 overflow-auto border rounded-2xl p-3 bg-gray-50"></div>

        <div id="carrito" class="mt-6 space-y-3"></div>

        <button onclick="finalizarVenta()"
        class="mt-6 w-full bg-green-700 text-white py-4 rounded-2xl font-bold">
          Finalizar Venta
        </button>

      </div>
    `;
  }

  if(v === "historial") cargarVentas();
  if(v === "kardex") cargarKardex();
}

/* ================= BUSCAR PRODUCTO ================= */
function buscarProducto(){

  const t = document.getElementById("buscar").value.toLowerCase().trim();
  const box = document.getElementById("resultados");

  if(t.length < 2){
    box.innerHTML = "";
    return;
  }

  let html = "";

  productosCache.forEach(p=>{

    if(p.nombre?.toLowerCase().includes(t)){

      html += `
        <div onclick="add('${p.id}','${p.nombre}',${p.precio||0},${p.stock||0})"
        class="p-3 hover:bg-white cursor-pointer flex justify-between rounded-xl">

          <span>${p.nombre}</span>
          <b>Stock: ${p.stock||0}</b>
        </div>
      `;
    }

  });

  box.innerHTML = html;
}  
/* ================= CARRITO ================= */
function add(id,nombre,precio,stock){

  if(stock <= 0){
    alert("Sin stock");
    return;
  }

  let item = carrito.find(p=>p.id===id);

  if(item){
    item.cantidad++;
  }else{
    carrito.push({id,nombre,precio,cantidad:1});
  }

  render();
}

function render(){
  document.getElementById("carrito").innerHTML =
  carrito.map((p,i)=>`
    <div class="flex justify-between bg-gray-100 p-3 rounded-2xl">
      <span>${p.nombre} x ${p.cantidad}</span>

      <div class="flex gap-3">
        <b>Q${(p.precio*p.cantidad).toFixed(2)}</b>
        <button onclick="del(${i})" class="text-red-600">X</button>
      </div>
    </div>
  `).join("");
}

function del(i){
  carrito.splice(i,1);
  render();
}

/* ================= FINALIZAR VENTA (TRI SINCRONIZADO) ================= */
async function finalizarVenta(){

  if(carrito.length === 0){
    alert("Carrito vacío");
    return;
  }

  try {

    await db.runTransaction(async (tx)=>{

      let total = 0;
      const ventaRef = db.collection("ventas").doc();

      const productos = [];

      for(const item of carrito){

        const ref = db.collection("productos").doc(item.id);
        const snap = await tx.get(ref);

        if(!snap.exists) throw "Producto no existe: " + item.nombre;

        const data = snap.data();
        const stock = data.stock || 0;

        if(stock < item.cantidad){
          throw "Stock insuficiente en " + item.nombre;
        }

        const nuevoStock = stock - item.cantidad;

        tx.update(ref,{ stock: nuevoStock });

        tx.set(db.collection("kardex").doc(),{
          productoId: item.id,
          producto: item.nombre,
          tipo: "SALIDA",
          cantidad: item.cantidad,
          motivo: "VENTA",
          stockFinal: nuevoStock,
          fecha: new Date()
        });

        total += item.precio * item.cantidad;

        productos.push(item);
      }

      tx.set(ventaRef,{
        fecha: new Date(),
        productos,
        total,
        tipo: "VENTA"
      });

    });

    carrito = [];

    alert("✅ Venta sincronizada (Inventario + Kardex + Ventas)");

    view("historial");

  } catch(e){
    alert("❌ Error: " + e);
  }
}

/* ================= HISTORIAL ================= */
function cargarVentas(){

  document.getElementById("app").innerHTML = `
    <h1 class="text-3xl font-bold mb-6">📊 Ventas</h1>
    <div id="lista"></div>
  `;

  db.collection("ventas")
  .orderBy("fecha","desc")
  .onSnapshot(snap=>{

    let html = "";

    snap.forEach(doc=>{
      const v = doc.data();

      html += `
        <div class="bg-white p-5 rounded-2xl shadow mb-3">
          <b>Total: Q${(v.total||0).toFixed(2)}</b>
        </div>
      `;
    });

    document.getElementById("lista").innerHTML = html;
  });
}

/* ================= KARDEX ================= */
function cargarKardex(){

  document.getElementById("app").innerHTML = `
    <h1 class="text-3xl font-bold mb-6">📦 Kardex en Tiempo Real</h1>
    <div id="kardex"></div>
  `;

  db.collection("kardex")
  .orderBy("fecha","desc")
  .onSnapshot(snap=>{

    let html = "";

    snap.forEach(doc=>{
      const k = doc.data();

      html += `
        <div class="bg-white p-4 rounded-xl shadow mb-2">
          <b>${k.producto}</b> - ${k.tipo}
          <div class="text-sm text-gray-500">
            ${k.cantidad} unidades
          </div>
        </div>
      `;
    });

    document.getElementById("kardex").innerHTML = html;
  });
}

/* INIT */
view("venta");
</script>

</body>
</html>
