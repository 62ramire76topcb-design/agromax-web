<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGROMAXGTM - Ventas</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>

<body class="bg-gray-100">

<div class="flex h-screen">

<!-- SIDEBAR -->
<div class="w-72 bg-white border-r shadow-xl overflow-y-auto">
  <div class="p-6 bg-green-700 text-white">
    <h1 class="text-2xl font-bold">AGROMAXGTM</h1>
    <p class="text-xs">Ventas + Caja + Inventario</p>
  </div>

  <nav class="p-4 space-y-2">
    <a href="admin.html" class="block p-3 hover:bg-green-50 rounded-xl cursor-pointer">
      <i class="fas fa-arrow-left"></i> Volver al Admin
    </a>

    <a onclick="mostrar('venta')" class="block p-3 hover:bg-green-50 rounded-xl cursor-pointer">
      🛒 Nueva Venta
    </a>

    <a onclick="mostrar('historial')" class="block p-3 hover:bg-green-50 rounded-xl cursor-pointer">
      📊 Historial
    </a>
  </nav>
</div>

<!-- MAIN -->
<div class="flex-1 p-8 overflow-auto" id="app"></div>

</div>

<script>
/* ================= FIREBASE ================= */
firebase.initializeApp({
  apiKey: "AIzaSyAEj22gE5UySwWVwIec6jpBiZ2nb1OBftM",
  authDomain: "agromaxgt-app.firebaseapp.com",
  projectId: "agromaxgt-app"
});

const auth = firebase.auth();
const db = firebase.firestore();

let carrito = [];
let userReady = false;

/* ================= ESPERAR AUTH (CLAVE DEL ARREGLO) ================= */
auth.onAuthStateChanged(user => {
  if (!user) {
    window.location.href = "admin.html";
    return;
  }
  userReady = true;
  mostrar("venta");
});

/* ================= VISTA ================= */
function mostrar(v){

  if(!userReady) return;

  const app = document.getElementById("app");

  if(v === "venta"){
    app.innerHTML = `
      <h1 class="text-3xl font-bold mb-6">🛒 Nueva Venta</h1>

      <input id="cliente"
        class="w-full p-4 border rounded-xl mb-4"
        placeholder="Cliente">

      <input id="buscar"
        class="w-full p-4 border rounded-xl"
        placeholder="Buscar producto..."
        onkeyup="buscar()">

      <div id="resultados" class="mt-4"></div>

      <div id="carrito" class="mt-6"></div>

      <button onclick="finalizar()"
        class="mt-6 w-full bg-green-700 text-white py-4 rounded-xl">
        Finalizar Venta
      </button>
    `;
  }

  if(v === "historial"){
    cargarHistorial();
  }
}

/* ================= BUSCAR ================= */
async function buscar(){

  const t = document.getElementById("buscar").value.toLowerCase();
  const box = document.getElementById("resultados");

  if(t.length < 2){
    box.innerHTML = "";
    return;
  }

  const snap = await db.collection("productos").get();

  let html = "";

  snap.forEach(doc=>{
    const p = doc.data();

    if(p.nombre?.toLowerCase().includes(t)){
      html += `
        <div onclick="add('${doc.id}','${p.nombre}',${p.precio||0})"
        class="p-3 bg-white mb-2 rounded-xl cursor-pointer flex justify-between">

          <span>${p.nombre}</span>
          <b>Q${p.precio||0}</b>
        </div>
      `;
    }
  });

  box.innerHTML = html;
}

/* ================= CARRITO ================= */
function add(id,nombre,precio){

  let item = carrito.find(p=>p.id===id);

  if(item){
    item.cantidad++;
  } else {
    carrito.push({id,nombre,precio,cantidad:1});
  }

  render();
}

function render(){
  document.getElementById("carrito").innerHTML =
  carrito.map((p,i)=>`
    <div class="flex justify-between bg-gray-100 p-3 rounded-xl mb-2">
      <span>${p.nombre} x ${p.cantidad}</span>
      <b>Q${(p.precio*p.cantidad).toFixed(2)}</b>
      <button onclick="del(${i})" class="text-red-600">X</button>
    </div>
  `).join("");
}

function del(i){
  carrito.splice(i,1);
  render();
}

/* ================= FINALIZAR ================= */
async function finalizar(){

  if(carrito.length === 0){
    alert("Carrito vacío");
    return;
  }

  try {

    await db.runTransaction(async (tx)=>{

      let total = 0;

      const ventaRef = db.collection("ventas").doc();
      const cajaRef = db.collection("caja").doc();

      for(const item of carrito){

        const ref = db.collection("productos").doc(item.id);
        const snap = await tx.get(ref);

        const stock = snap.data().stock || 0;

        if(stock < item.cantidad){
          throw "Stock insuficiente en " + item.nombre;
        }

        tx.update(ref,{
          stock: stock - item.cantidad
        });

        total += item.precio * item.cantidad;
      }

      const data = {
        fecha: new Date(),
        cliente: document.getElementById("cliente").value || "General",
        productos: carrito,
        total,
        usuario: auth.currentUser.uid
      };

      tx.set(ventaRef, data);

      tx.set(cajaRef, {
        ...data,
        tipo: "VENTA",
        estado: "PENDIENTE"
      });

    });

    carrito = [];

    alert("✅ Venta registrada + Caja sincronizada");

    mostrar("historial");

  } catch(e){
    alert("Error: " + e);
  }
}

/* ================= HISTORIAL ================= */
function cargarHistorial(){

  document.getElementById("app").innerHTML =
  `<h1 class="text-3xl font-bold mb-6">Historial</h1>
   <div id="lista"></div>`;

  db.collection("ventas")
  .orderBy("fecha","desc")
  .onSnapshot(snap=>{

    let html = "";

    snap.forEach(doc=>{
      const v = doc.data();

      html += `
        <div class="bg-white p-4 rounded-xl mb-3">
          <b>Q${v.total.toFixed(2)}</b><br>
          ${v.cliente}
        </div>
      `;
    });

    document.getElementById("lista").innerHTML = html;
  });
}
</script>

</body>
</html>
