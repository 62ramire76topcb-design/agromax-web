  <!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGROMAX - Ventas</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>

<body class="bg-gray-100">

<div class="flex h-screen">

<!-- SIDEBAR -->
<div class="w-72 bg-white border-r p-4">
  <h1 class="font-bold text-xl mb-6">AGROMAX</h1>

  <button onclick="view('venta')" class="block w-full text-left p-3 hover:bg-gray-100">
    🛒 Nueva Venta
  </button>

  <button onclick="view('pendientes')" class="block w-full text-left p-3 hover:bg-gray-100">
    🟡 Ventas Pendientes
  </button>
</div>

<!-- MAIN -->
<div class="flex-1 p-6" id="app"></div>

</div>

<script>
firebase.initializeApp({
  apiKey:"TU_KEY",
  projectId:"TU_ID"
});

const db = firebase.firestore();

let carrito = [];

/* ================= VIEW ================= */
function view(v){

  const app = document.getElementById("app");

  if(v === "venta"){
    app.innerHTML = `
      <h2 class="text-2xl font-bold mb-4">Nueva Venta</h2>

      <input id="search"
        onkeyup="buscar()"
        class="w-full p-3 border mb-4"
        placeholder="Buscar producto">

      <div id="results"></div>

      <div id="cart" class="mt-6"></div>

      <button onclick="guardarPendiente()"
        class="mt-4 bg-yellow-500 text-white px-4 py-2">
        Guardar Pendiente
      </button>
    `;
  }

  if(v === "pendientes") cargarPendientes();
}

/* ================= BUSCAR ================= */
async function buscar(){

  const t = document.getElementById("search").value.toLowerCase();
  const box = document.getElementById("results");

  if(t.length < 2){ box.innerHTML=""; return; }

  const snap = await db.collection("productos").limit(20).get();

  let html = "";

  snap.forEach(doc=>{
    const p = doc.data();

    if(p.nombre.toLowerCase().includes(t)){
      html += `
        <div onclick="add('${doc.id}','${p.nombre}',${p.precio||0},${p.stock||0})"
        class="p-2 bg-white border mb-2 cursor-pointer">

          ${p.nombre} - Q${p.precio} (Stock: ${p.stock})

        </div>
      `;
    }
  });

  box.innerHTML = html;
}

/* ================= CART ================= */
function add(id,nombre,precio,stock){

  if(stock <= 0) return alert("Sin stock");

  let item = carrito.find(p=>p.id===id);

  if(item) item.cantidad++;
  else carrito.push({id,nombre,precio,cantidad:1});

  render();
}

function render(){

  let box = document.getElementById("cart");
  if(!box) return;

  let html = "";

  carrito.forEach((p,i)=>{
    html += `
      <div class="flex justify-between p-2 border">
        ${p.nombre} x ${p.cantidad}
        <button onclick="del(${i})">X</button>
      </div>
    `;
  });

  box.innerHTML = html;
}

function del(i){
  carrito.splice(i,1);
  render();
}

/* ================= PENDIENTE ================= */
async function guardarPendiente(){

  if(carrito.length===0) return alert("Vacío");

  await db.collection("ventas_pendientes").add({
    fecha:new Date(),
    productos:carrito,
    estado:"pendiente"
  });

  carrito=[];
  render();

  alert("Guardado en pendientes");
}

/* ================= PENDIENTES ================= */
function cargarPendientes(){

  const app = document.getElementById("app");

  app.innerHTML = `<h2 class="text-2xl font-bold">Pendientes</h2><div id="list"></div>`;

  db.collection("ventas_pendientes")
  .orderBy("fecha","desc")
  .onSnapshot(snap=>{

    let html="";

    snap.forEach(doc=>{
      html+=`
        <div class="bg-white p-3 border mb-2">
          Venta pendiente

          <button onclick="enviar('${doc.id}')"
          class="bg-green-600 text-white px-3 py-1">
            Enviar a Caja
          </button>
        </div>
      `;
    });

    document.getElementById("list").innerHTML = html;

  });
}

/* ================= ENVIAR A CAJA ================= */
async function enviar(id){

  const doc = await db.collection("ventas_pendientes").doc(id).get();

  await db.collection("caja").add({
    ...doc.data(),
    estado:"en_caja"
  });

  await db.collection("ventas_pendientes").doc(id).delete();

  alert("Enviado a caja");
}

view("venta");
</script>

</body>
</html>
