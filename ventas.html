<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGROMAXGTM - Ventas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100">

  <div class="flex h-screen">
    <div class="w-72 bg-white border-r shadow-xl overflow-y-auto">
      <div class="p-6 border-b bg-green-700 text-white">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-white rounded-2xl flex items-center justify-center text-green-700 text-3xl">🌱</div>
          <div>
            <h1 class="text-2xl font-bold">AGROMAXGTM</h1>
            <p class="text-xs">Módulo de Ventas</p>
          </div>
        </div>
      </div>
      <nav class="p-4 space-y-1">
        <a href="admin.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-arrow-left"></i> Volver al Admin</a>
        <a onclick="mostrarSeccion('nueva-venta')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-plus"></i> Nueva Venta</a>
        <a onclick="mostrarSeccion('historial')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-history"></i> Historial de Ventas</a>
      </nav>
    </div>

    <div class="flex-1 overflow-auto p-8" id="main-content"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAEj22gE5UySwWVwIec6jpBiZ2nb1OBftM",
      authDomain: "agromaxgt-app.firebaseapp.com",
      projectId: "agromaxgt-app",
      storageBucket: "agromaxgt-app.firebasestorage.app",
      messagingSenderId: "648144313047",
      appId: "1:648144313047:web:118a67464d99f2d0462e92"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let productosVenta = [];

    async function verificarAuth() {
      return new Promise(resolve => {
        auth.onAuthStateChanged(user => {
          if (!user) window.location.href = "admin.html";
          else resolve(user);
        });
      });
    }

    async function mostrarSeccion(seccion) {
      await verificarAuth();
      const content = document.getElementById('main-content');

      if (seccion === 'nueva-venta') {
        content.innerHTML = `
          <h1 class="text-4xl font-bold mb-8">🛒 Nueva Venta en Tienda</h1>
          <div class="grid grid-cols-12 gap-8">
            <!-- Búsqueda -->
            <div class="col-span-7 bg-white p-8 rounded-3xl shadow">
              <input id="buscar" placeholder="Buscar producto o escanear código..." 
                     class="w-full p-6 text-xl border-2 border-green-400 rounded-3xl focus:border-green-600" 
                     autofocus onkeyup="if(event.key==='Enter') buscarProducto()">
              <div id="resultados" class="mt-6 max-h-96 overflow-auto border rounded-2xl"></div>
            </div>

            <!-- Carrito -->
            <div class="col-span-5 bg-white p-8 rounded-3xl shadow">
              <h2 class="text-2xl font-bold mb-6">Carrito</h2>
              <div id="lista-venta" class="space-y-4 min-h-96"></div>
              
              <div class="mt-8 pt-6 border-t">
                <div class="flex justify-between text-3xl font-bold mb-6">
                  <span>Total:</span>
                  <span id="total-venta" class="text-green-600">Q0.00</span>
                </div>
                <button onclick="guardarVenta()" 
                        class="w-full bg-green-700 hover:bg-green-800 text-white py-6 rounded-3xl text-2xl font-bold">
                  💰 Finalizar Venta
                </button>
              </div>
            </div>
          </div>`;
      } 
      else if (seccion === 'historial') {
        content.innerHTML = `<h1 class="text-3xl font-bold mb-8">Historial de Ventas</h1><div id="lista-historial" class="space-y-6"></div>`;
        cargarHistorial();
      }
    }

    // Buscar producto
    async function buscarProducto() {
      const term = document.getElementById('buscar').value.toLowerCase().trim();
      const container = document.getElementById('resultados');
      if (term.length < 2) return container.innerHTML = '';

      const snapshot = await db.collection('productos').get();
      let html = '';
      snapshot.forEach(doc => {
        const p = doc.data();
        if (p.nombre.toLowerCase().includes(term)) {
          html += `
            <div onclick="agregarProductoVenta('${p.nombre}', ${p.precio || 0})" 
                 class="p-5 hover:bg-green-50 rounded-2xl cursor-pointer flex justify-between border-b">
              <span class="font-medium">${p.nombre}</span>
              <span class="font-bold text-green-600">Q${p.precio || 0}</span>
            </div>`;
        }
      });
      container.innerHTML = html || '<p class="p-8 text-gray-500">No se encontraron productos</p>';
    }

    function agregarProductoVenta(nombre, precio) {
      const cantidad = parseInt(prompt(`Cantidad de ${nombre}:`, "1")) || 1;
      productosVenta.push({nombre, cantidad, precio});
      renderCarrito();
    }

    function renderCarrito() {
      const container = document.getElementById('lista-venta');
      let total = 0;
      let html = '';

      productosVenta.forEach((p, i) => {
        const subtotal = p.precio * p.cantidad;
        total += subtotal;
        html += `
          <div class="flex justify-between items-center bg-gray-50 p-5 rounded-2xl">
            <div>
              <p>${p.nombre}</p>
              <p class="text-sm text-gray-500">${p.cantidad} × Q${p.precio}</p>
            </div>
            <div class="text-right">
              <p class="font-bold">Q${subtotal.toFixed(2)}</p>
              <button onclick="eliminarDeVenta(${i})" class="text-red-600 text-sm mt-1">Eliminar</button>
            </div>
          </div>`;
      });

      container.innerHTML = html || '<p class="text-gray-400 py-12 text-center">El carrito está vacío</p>';
      document.getElementById('total-venta').textContent = `Q${total.toFixed(2)}`;
    }

    function eliminarDeVenta(i) {
      productosVenta.splice(i, 1);
      renderCarrito();
    }

    async function guardarVenta() {
      if (productosVenta.length === 0) return alert("Agrega al menos un producto");

      const total = productosVenta.reduce((sum, p) => sum + p.precio * p.cantidad, 0);
      const cliente = document.getElementById('cliente') ? document.getElementById('cliente').value : "Cliente General";

      try {
        // Registrar venta
        await db.collection('ventas').add({
          fecha: new Date(),
          cliente: cliente || "Cliente General",
          productos: productosVenta,
          total,
          tipo: "Tienda Física"
        });

        // Actualizar stock
        for (let item of productosVenta) {
          const query = await db.collection('productos').where('nombre', '==', item.nombre).get();
          query.forEach(async (doc) => {
            const stockActual = doc.data().stock || 0;
            await db.collection('productos').doc(doc.id).update({
              stock: Math.max(0, stockActual - item.cantidad)
            });
          });
        }

        alert("✅ Venta registrada correctamente\nStock actualizado");
        productosVenta = [];
        mostrarSeccion('historial');
      } catch (e) {
        alert("Error: " + e.message);
      }
    }

    async function cargarHistorial() {
      const container = document.getElementById('lista-historial');
      db.collection('ventas').orderBy('fecha', 'desc').onSnapshot(snapshot => {
        let html = '';
        snapshot.forEach(doc => {
          const v = doc.data();
          html += `
            <div class="bg-white rounded-3xl shadow p-6">
              <div class="flex justify-between">
                <div>
                  <p class="font-bold">${v.cliente}</p>
                  <p class="text-sm text-gray-500">${v.fecha.toDate().toLocaleString('es-GT')}</p>
                </div>
                <span class="font-bold text-green-600 text-xl">Q${v.total.toFixed(2)}</span>
              </div>
              <div class="mt-4 text-sm">
                ${v.productos.map(p => `${p.nombre} × ${p.cantidad}`).join(' • ')}
              </div>
            </div>`;
        });
        container.innerHTML = html || '<p class="text-center py-12 text-gray-400">No hay ventas registradas</p>';
      });
    }
    async function finalizar(){

  if(carrito.length === 0){
    alert("Carrito vacío");
    return;
  }

  try {

    await db.runTransaction(async (tx)=>{

      let total = 0;
      const ventaRef = db.collection("ventas").doc();
      const cajaRef = db.collection("caja").doc(); // 🆕 CAJA

      for(const item of carrito){

        const ref = db.collection("productos").doc(item.id);
        const snap = await tx.get(ref);

        const stock = snap.data().stock || 0;

        if(stock < item.cantidad){
          throw "Stock insuficiente en " + item.nombre;
        }

        tx.update(ref,{
          stock: stock - item.cantidad
        });

        total += item.precio * item.cantidad;
      }

      const ventaData = {
        fecha: new Date(),
        cliente: document.getElementById("cliente").value || "General",
        productos: carrito,
        total,
        origen: "VENTA"
      };

      // 1️⃣ guardar venta
      tx.set(ventaRef, ventaData);

      // 2️⃣ enviar a caja automáticamente
      tx.set(cajaRef, {
        ...ventaData,
        tipo: "VENTA",
        estado: "PENDIENTE",
        fechaCaja: new Date()
      });

    });

    carrito = [];

    alert("✅ Venta registrada y enviada a CAJA");

    mostrar("historial");

  } catch(e){
    alert("Error: " + e);
  }
}
    window.onload = () => mostrarSeccion('nueva-venta');
  </script>
</body>
</html>
