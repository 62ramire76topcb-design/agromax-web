<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGROMAXGTM - Caja Mostrador</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="./ticket.js"></script>
</head>

<body class="bg-gray-100">

<div class="flex h-screen">

<div class="w-72 bg-white border-r shadow-xl overflow-y-auto">
  <div class="p-6 border-b bg-green-700 text-white">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-white rounded-2xl flex items-center justify-center text-green-700 text-3xl">🌱</div>
      <div>
        <h1 class="text-2xl font-bold">AGROMAXGTM</h1>
        <p class="text-xs">Caja Registradora - Mostrador</p>
      </div>
    </div>
  </div>

  <nav class="p-4 space-y-2">
    <a onclick="view('venta')" class="block p-3 hover:bg-green-50 rounded-xl">
      <i class="fas fa-cash-register"></i> Nueva Venta
    </a>
    <a onclick="view('pendientes')" class="block p-3 hover:bg-green-50 rounded-xl">
      <i class="fas fa-clock"></i> Ventas Pendientes
    </a>
    <a onclick="view('historial')" class="block p-3 hover:bg-green-50 rounded-xl">
      <i class="fas fa-history"></i> Historial Caja
    </a>
  </nav>
</div>

<div class="flex-1 p-8 overflow-auto" id="app"></div>

</div>

<!-- Scripts modulares -->
<script src="./js/firebase-config.js"></script>
<script src="./js/pos.js"></script>
</body>
</html>
