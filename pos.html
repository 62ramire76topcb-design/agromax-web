<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGROMAXGTM - Caja Mostrador</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>

<body class="bg-gray-100">

<div class="flex h-screen">

<div class="w-72 bg-white border-r shadow-xl overflow-y-auto">
  <div class="p-6 border-b bg-green-700 text-white">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-white rounded-2xl flex items-center justify-center text-green-700 text-3xl">🌱</div>
      <div>
        <h1 class="text-2xl font-bold">AGROMAXGTM</h1>
        <p class="text-xs">Caja Registradora - Mostrador</p>
      </div>
    </div>
  </div>

  <nav class="p-4 space-y-2">
    <a onclick="view('venta')" class="block p-3 hover:bg-green-50 rounded-xl">
      <i class="fas fa-cash-register"></i> Nueva Venta
    </a>
    <a onclick="view('pendientes')" class="block p-3 hover:bg-green-50 rounded-xl">
      <i class="fas fa-clock"></i> Ventas Pendientes
    </a>
    <a onclick="view('historial')" class="block p-3 hover:bg-green-50 rounded-xl">
      <i class="fas fa-history"></i> Historial Caja
    </a>
  </nav>
</div>

<div class="flex-1 p-8 overflow-auto" id="app"></div>

</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyAEj22gE5UySwWVwIec6jpBiZ2nb1OBftM",
  authDomain: "agromaxgt-app.firebaseapp.com",
  projectId: "agromaxgt-app"
});

const db = firebase.firestore();
const auth = firebase.auth();

let carrito = [];
let listenersInit = false;

/* ================= LISTENERS SOLO 1 VEZ ================= */
function initListeners(){
  if(listenersInit) return;
  listenersInit = true;

  document.addEventListener("change", function(e){
    if(e.target && e.target.id === "metodoPago"){
      const box = document.getElementById("efectivoBox");

      if(!box) return;

      if(e.target.value === "Efectivo"){
        box.classList.remove("hidden");
      } else {
        box.classList.add("hidden");
        const m = document.getElementById("montoRecibido");
        const c = document.getElementById("cambioTexto");
        if(m) m.value = "";
        if(c) c.innerText = "Q0.00";
      }
    }
  });

  document.addEventListener("input", function(e){
    if(e.target && e.target.id === "montoRecibido"){
      const total = carrito.reduce((sum, p) => sum + (p.precio * p.cantidad), 0);
      const recibido = parseFloat(e.target.value) || 0;
      const cambio = recibido - total;

      const c = document.getElementById("cambioTexto");
      if(c){
        c.innerText = "Q" + (cambio >= 0 ? cambio.toFixed(2) : "0.00");
      }
    }
  });
}
initListeners();

/* ================= AUTH ================= */
auth.onAuthStateChanged(user => {
  if (!user) mostrarLoginPOS();
  else view("venta");
});

function mostrarLoginPOS() {
  document.getElementById("app").innerHTML = `
    <div class="min-h-screen flex items-center justify-center bg-gray-100">
      <div class="bg-white p-10 rounded-3xl shadow-2xl max-w-md w-full">
        <div class="flex justify-center mb-6">
          <div class="w-20 h-20 bg-green-700 rounded-3xl flex items-center justify-center text-white text-6xl">🖨️</div>
        </div>
        <h1 class="text-3xl font-bold text-center mb-2">Caja AGROMAXGTM</h1>
        <p class="text-center text-green-600 mb-8">Iniciar Sesión - Mostrador</p>

        <input id="email" type="email" class="w-full p-4 border rounded-2xl mb-4">
        <input id="password" type="password" class="w-full p-4 border rounded-2xl mb-6">

        <button onclick="loginPOS()" class="w-full bg-green-600 text-white py-4 rounded-2xl font-bold text-lg">
          Ingresar a Caja
        </button>
      </div>
    </div>`;
}

async function loginPOS(){
  try{
    await auth.signInWithEmailAndPassword(
      document.getElementById("email").value,
      document.getElementById("password").value
    );
  }catch(e){
    alert(e.message);
  }
}

/* ================= VIEW ================= */
function view(v){
  const app = document.getElementById("app");

  if(v === "venta"){
    app.innerHTML = `
      <h1 class="text-3xl font-bold mb-6">🛒 Nueva Venta</h1>

      <div class="grid grid-cols-12 gap-6">

        <div class="col-span-7 bg-white p-6 rounded-3xl shadow">
          <input id="search" placeholder="Buscar producto..."
          class="w-full p-4 border rounded-2xl"
          onkeyup="buscar()">

          <div id="results" class="mt-4"></div>
        </div>

        <div class="col-span-5 bg-white p-6 rounded-3xl shadow">
          <h2 class="text-xl font-bold mb-4">Carrito</h2>
          <div id="cart"></div>

          <div id="efectivoBox" class="mt-4 hidden">
            <input id="montoRecibido" type="number" class="w-full p-3 border rounded-xl">
            <div class="mt-2">Cambio: <b id="cambioTexto">Q0.00</b></div>
          </div>

          <select id="metodoPago" class="w-full p-3 border rounded-xl mt-4">
            <option value="">Seleccione método</option>
            <option value="Efectivo">Efectivo</option>
            <option value="Tarjeta">Tarjeta</option>
          </select>

          <button onclick="finalizarVenta()" class="w-full mt-4 bg-green-700 text-white py-4 rounded-xl font-bold">
            Finalizar Venta
          </button>
        </div>

      </div>`;
  }

  if(v === "pendientes") cargarPendientes();
  if(v === "historial") cargarHistorial();
}

/* ================= SEARCH ================= */
async function buscar(){
  const t = document.getElementById("search").value.toLowerCase();
  const box = document.getElementById("results");

  const snap = await db.collection("productos").limit(20).get();

  let html = "";
  snap.forEach(doc=>{
    const p = doc.data();
    if(p.nombre.toLowerCase().includes(t)){
      html += `<div onclick="add('${doc.id}','${p.nombre}',${p.precio||0},${p.stock||0})"
      class="p-2 bg-gray-100 rounded-xl">${p.nombre}</div>`;
    }
  });

  box.innerHTML = html;
}

/* ================= CART ================= */
function add(id,nombre,precio,stock){
  if(stock<=0) return alert("Sin stock");

  let i = carrito.find(p=>p.id===id);
  if(i) i.cantidad++;
  else carrito.push({id,nombre,precio,cantidad:1});

  render();
}

function render(){
  const box = document.getElementById("cart");
  if(!box) return;

  let html = "";
  let total = 0;

  carrito.forEach((p,i)=>{
    total += p.precio*p.cantidad;
    html += `
      <div class="flex justify-between p-2">
        ${p.nombre} x${p.cantidad}
        <b>Q${(p.precio*p.cantidad).toFixed(2)}</b>
      </div>`;
  });

  box.innerHTML = html;
}

/* ================= FINALIZAR ================= */
async function finalizarVenta(){

  if(carrito.length===0) return alert("Carrito vacío");

  const carritoSnapshot = JSON.parse(JSON.stringify(carrito));
  const totalFinal = carritoSnapshot.reduce((s,p)=>s+(p.precio*p.cantidad),0);

  const metodo = document.getElementById("metodoPago").value;

  await db.runTransaction(async(tx)=>{
    for(const item of carritoSnapshot){
      const ref = db.collection("productos").doc(item.id);
      const snap = await tx.get(ref);

      const data = snap.data();
      if(data.stock < item.cantidad) throw "Sin stock";

      tx.update(ref,{stock:data.stock-item.cantidad});
    }

    tx.set(db.collection("ventas").doc(),{
      fecha:new Date(),
      productos:carritoSnapshot,
      total:totalFinal,
      metodoPago:metodo
    });
  });

  if(typeof abrirTicket === "function"){
    abrirTicket(carritoSnapshot,totalFinal);
  }

  carrito = [];
  render();
  view("venta");
}

/* ================= INIT ================= */
view("venta");
</script>
</body>
</html>
