<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGROMAXGTM - Caja Mostrador</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="./ticket.js"></script>
</head>

<body class="bg-gray-100">

<div class="flex h-screen">

<div class="w-64 md:w-72 bg-white border-r shadow-xl overflow-y-auto shrink-0">
  <div class="p-5 border-b bg-green-700 text-white">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-white rounded-2xl flex items-center justify-center text-green-700 text-2xl">🌱</div>
      <div>
        <h1 class="text-xl font-bold">AGROMAXGTM</h1>
        <p class="text-xs opacity-90">Caja - Mostrador</p>
      </div>
    </div>
  </div>

  <nav class="p-3 space-y-1 text-sm">
    <a onclick="view('venta')" class="block p-3 hover:bg-green-50 rounded-xl cursor-pointer">
      <i class="fas fa-cash-register w-5"></i> Nueva Venta
    </a>
    <a onclick="view('productos-pos')" class="block p-3 hover:bg-green-50 rounded-xl cursor-pointer">
      <i class="fas fa-boxes w-5"></i> Productos
    </a>
    <a onclick="view('clientes-pos')" class="block p-3 hover:bg-green-50 rounded-xl cursor-pointer">
      <i class="fas fa-users w-5"></i> Clientes
    </a>
    <a onclick="view('pendientes')" class="block p-3 hover:bg-green-50 rounded-xl cursor-pointer">
      <i class="fas fa-clock w-5"></i> Ventas Pendientes
    </a>
    <a onclick="view('historial')" class="block p-3 hover:bg-green-50 rounded-xl cursor-pointer">
      <i class="fas fa-history w-5"></i> Mi historial
    </a>
    <a onclick="view('dashboard-caja')" class="block p-3 hover:bg-green-50 rounded-xl cursor-pointer">
      <i class="fas fa-chart-line w-5"></i> Dashboard caja
    </a>
    <a onclick="view('vencer')" class="block p-3 hover:bg-amber-50 text-amber-800 rounded-xl cursor-pointer">
      <i class="fas fa-hourglass-half w-5"></i> Próximos a vencer
    </a>
    <a onclick="imprimirCorteDia()" class="block p-3 hover:bg-indigo-50 text-indigo-700 rounded-xl cursor-pointer">
      <i class="fas fa-file-alt w-5"></i> Documento del día
    </a>
    <a onclick="cerrarTurnoCaja()" class="block p-3 hover:bg-red-50 text-red-600 rounded-xl cursor-pointer mt-4">
      <i class="fas fa-lock w-5"></i> Cerrar turno
    </a>
    <a onclick="cambiarCajero()" class="block p-3 hover:bg-gray-100 text-gray-600 rounded-xl cursor-pointer">
      <i class="fas fa-sign-out-alt w-5"></i> Cerrar sesión
    </a>
    <p class="px-3 pt-4 text-[10px] text-gray-400 leading-relaxed">
      F2 = Finalizar venta<br>
      Cajero = usuario logueado<br>
      Jornada: 1:00 a.m. → 12:00 a.m.
    </p>
  </nav>
</div>

<div class="flex-1 p-3 md:p-8 overflow-auto" id="app"></div>

</div>

<script src="./js/firebase-config.js"></script>
<script src="./js/pos-turno.js"></script>
<script src="./js/pos.js"></script>
<script src="./js/pos-extras.js"></script>
<script src="./js/pos-modulos.js"></script>
<script src="./js/pos-auth-user.js"></script>
<script src="./js/pos-bonif.js"></script>
<script src="./js/pos-descuento-venta.js"></script>
</body>
</html>
