<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGROMAXGTM - Caja Mostrador</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>

<body class="bg-gray-100">

<div class="flex h-screen">

<div class="w-72 bg-white border-r shadow-xl overflow-y-auto">
  <div class="p-6 border-b bg-green-700 text-white">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-white rounded-2xl flex items-center justify-center text-green-700 text-3xl">🌱</div>
      <div>
        <h1 class="text-2xl font-bold">AGROMAXGTM</h1>
        <p class="text-xs">Caja Registradora - Mostrador</p>
      </div>
    </div>
  </div>

  <nav class="p-4 space-y-2">
    <a onclick="view('venta')" class="block p-3 hover:bg-green-50 rounded-xl">
      <i class="fas fa-cash-register"></i> Nueva Venta
    </a>
    <a onclick="view('pendientes')" class="block p-3 hover:bg-green-50 rounded-xl">
      <i class="fas fa-clock"></i> Ventas Pendientes
    </a>
    <a onclick="view('historial')" class="block p-3 hover:bg-green-50 rounded-xl">
      <i class="fas fa-history"></i> Historial Caja
    </a>
  </nav>
</div>

<div class="flex-1 p-8 overflow-auto" id="app"></div>

</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyAEj22gE5UySwWVwIec6jpBiZ2nb1OBftM",
  authDomain: "agromaxgt-app.firebaseapp.com",
  projectId: "agromaxgt-app"
});

const db = firebase.firestore();
const auth = firebase.auth();

let carrito = [];

/* AUTH - Mejorado para POS */
auth.onAuthStateChanged(user => {
  if (!user) {
    // En vez de redirigir a admin.html, mostramos login dentro del POS
    mostrarLoginPOS();
  } else {
    view("venta");
  }
});

function mostrarLoginPOS() {
  document.getElementById("app").innerHTML = `
    <div class="min-h-screen flex items-center justify-center bg-gray-100">
      <div class="bg-white p-10 rounded-3xl shadow-2xl max-w-md w-full">
        <div class="flex justify-center mb-6">
          <div class="w-20 h-20 bg-green-700 rounded-3xl flex items-center justify-center text-white text-6xl">🌱</div>
        </div>
        <h1 class="text-3xl font-bold text-center mb-2">Caja AGROMAXGTM</h1>
        <p class="text-center text-green-600 mb-8">Iniciar Sesión - Mostrador</p>
        
        <input id="email" type="email" placeholder="Correo" class="w-full p-4 border rounded-2xl mb-4">
        <input id="password" type="password" placeholder="Contraseña" class="w-full p-4 border rounded-2xl mb-6">
        
        <button onclick="loginPOS()" class="w-full bg-green-600 hover:bg-green-700 text-white py-4 rounded-2xl font-bold text-lg">
          Ingresar a Caja
        </button>
        <p class="text-center text-xs text-gray-500 mt-6">Solo para personal de mostrador</p>
      </div>
    </div>`;
}

async function loginPOS() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  try {
    await auth.signInWithEmailAndPassword(email, password);
  } catch (e) {
    alert("Error de inicio de sesión: " + e.message);
  }
}

/* ================= VIEWS ================= */
function view(v){
  const app = document.getElementById("app");

  if(v === "venta"){
    app.innerHTML = `
      <h1 class="text-3xl font-bold mb-6">🛒 Nueva Venta</h1>

      <div class="grid grid-cols-12 gap-6">

        <div class="col-span-7 bg-white p-6 rounded-3xl shadow">
          <input id="search" placeholder="Buscar producto..."
          class="w-full p-4 border rounded-2xl"
          onkeyup="buscar()">

          <div id="results" class="mt-4"></div>
        </div>

        <div class="col-span-5 bg-white p-6 rounded-3xl shadow">
          <h2 class="text-xl font-bold mb-4">Carrito</h2>
          <div id="cart"></div>

          <button onclick="guardarPendiente()"
          class="w-full mt-6 bg-yellow-500 py-3 rounded-xl text-white font-bold">
            Guardar como Pendiente
          </button>

          <button onclick="finalizarVenta()"
          class="w-full mt-3 bg-green-700 py-4 rounded-xl text-white font-bold">
            Finalizar Venta (Descontar Stock)
          </button>
        </div>

      </div>
    `;
  }

  if(v === "pendientes") cargarPendientes();
  if(v === "historial") cargarHistorial();
}

/* ================= SEARCH ================= */
async function buscar(){
  const t = document.getElementById("search").value.toLowerCase();
  const box = document.getElementById("results");

  if(t.length < 2){
    box.innerHTML = "";
    return;
  }

  const snap = await db.collection("productos").limit(20).get();

  let html = "";
  snap.forEach(doc=>{
    const p = doc.data();
    if(p.nombre && p.nombre.toLowerCase().includes(t)){
      html += `
        <div onclick="add('${doc.id}','${p.nombre}',${p.precio||0},${p.stock||0})"
        class="p-3 bg-gray-50 rounded-xl cursor-pointer flex justify-between">
          <span>${p.nombre}</span>
          <b>Stock: ${p.stock||0}</b>
        </div>
      `;
    }
  });
  box.innerHTML = html || "<p class='p-3 text-gray-500'>No encontrado</p>";
}

/* ================= CART ================= */
function add(id, nombre, precio, stock){
  if(stock <= 0) return alert("Sin stock disponible");

  let item = carrito.find(p=>p.id===id);
  if(item) item.cantidad++;
  else carrito.push({id, nombre, precio, cantidad:1});

  render();
}

function render(){
  const box = document.getElementById("cart");
  if(!box) return;

  let html = "";
  let total = 0;

  carrito.forEach((p,i)=>{
    total += p.precio * p.cantidad;
    html += `
      <div class="flex justify-between p-3 bg-gray-100 rounded-xl mb-2">
        <div>${p.nombre} × ${p.cantidad}</div>
        <div>
          Q${(p.precio*p.cantidad).toFixed(2)}
          <button onclick="del(${i})" class="text-red-600 ml-3">X</button>
        </div>
      </div>
    `;
  });

  box.innerHTML = html || "<p class='text-gray-400 py-8 text-center'>Carrito vacío</p>";
}

function del(i){
  carrito.splice(i,1);
  render();
}

/* ================= GUARDAR PENDIENTE ================= */
async function guardarPendiente(){
  if(carrito.length===0) return alert("Carrito vacío");

  await db.collection("ventas_pendientes").add({
    fecha: new Date(),
    productos: carrito,
    estado: "pendiente"
  });

  alert("✅ Venta guardada como pendiente");
  carrito = [];
  render();
}

/* ================= FINALIZAR VENTA + DESCONTAR STOCK ================= */
async function finalizarVenta(){
  if(carrito.length===0) return alert("Carrito vacío");

  if(!confirm("¿Finalizar venta y descontar stock?")) return;

  try {
    await db.runTransaction(async (tx) => {
      let total = 0;

      for(const item of carrito){
        const prodRef = db.collection("productos").doc(item.id);
        const snap = await tx.get(prodRef);

        if(!snap.exists) throw "Producto no encontrado: " + item.nombre;

        const data = snap.data();
        if((data.stock || 0) < item.cantidad){
          throw "Stock insuficiente para " + item.nombre;
        }

        tx.update(prodRef, { stock: data.stock - item.cantidad });
        total += item.precio * item.cantidad;
      }

      // Guardar la venta completada
      const ventaRef = db.collection("ventas").doc();
      tx.set(ventaRef, {
        fecha: new Date(),
        productos: carrito,
        total: total,
        tipo: "CAJA"
      });
    });

    alert("✅ Venta finalizada y stock actualizado correctamente");
    carrito = [];
    render();
    view("venta"); // Recargar vista

  } catch(e){
    console.error(e);
    alert("Error: " + (e.message || e));
  }
}

/* ================= PENDIENTES & HISTORIAL (sin cambios) ================= */
function cargarPendientes(){
  document.getElementById("app").innerHTML = `
    <h1 class="text-3xl font-bold mb-6">Ventas Pendientes</h1>
    <div id="pend"></div>
  `;

  db.collection("ventas_pendientes")
  .where("estado", "==", "pendiente")
  .onSnapshot(snap=>{
    let html = "";
    snap.forEach(doc=>{
      const v = doc.data();
      html += `
        <div class="bg-white p-4 rounded-xl shadow mb-3 flex justify-between items-center">
          <div>
            <b>${v.fecha.toDate ? v.fecha.toDate().toLocaleString() : ""}</b>
          </div>
          <button onclick="cargarPendiente('${doc.id}')" 
          class="bg-green-600 text-white px-4 py-2 rounded-xl">Abrir</button>
        </div>
      `;
    });
    document.getElementById("pend").innerHTML = html || "<p class='text-gray-400 py-12 text-center'>No hay ventas pendientes</p>";
  });
}

async function cargarPendiente(id){
  const doc = await db.collection("ventas_pendientes").doc(id).get();
  carrito = doc.data().productos || [];
  view("venta");
  setTimeout(render, 300);
}

function cargarHistorial(){
  document.getElementById("app").innerHTML = `
    <h1 class="text-3xl font-bold mb-6">Historial Caja</h1>
    <div id="hist"></div>
  `;

  db.collection("ventas")
  .orderBy("fecha","desc")
  .onSnapshot(snap=>{
    let html = "";
    snap.forEach(doc=>{
      const v = doc.data();
      html += `
        <div class="bg-white p-4 rounded-xl shadow mb-3">
          <b>Total: Q${v.total || 0}</b> - ${v.fecha?.toDate ? v.fecha.toDate().toLocaleString() : ''}
        </div>
      `;
    });
    document.getElementById("hist").innerHTML = html || "<p class='text-gray-400 py-12 text-center'>Sin historial</p>";
  });
}

/* INIT */
view("venta");

</script>
</body>
</html>





<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGROMAXGTM - Inventario PRO MAX</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<style>
@media print {
  body * {
    visibility: hidden;
  }
  #printArea, #printArea * {
    visibility: visible;
  }
  #printArea {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
  }
}
</style>

</head>

<body class="bg-gray-100">
<div class="flex h-screen">

<!-- SIDEBAR -->
<div class="w-72 bg-white border-r shadow-xl">
  <div class="p-6 bg-green-700 text-white">
    <h1 class="text-2xl font-bold">AGROMAXGTM</h1>
    <p class="text-sm">Inventario PRO MAX</p>
  </div>

  <nav class="p-4 space-y-2">
    <a onclick="view('dashboard')" class="cursor-pointer block p-3 hover:bg-green-50 rounded">📦 Dashboard</a>
    <a onclick="view('report')" class="cursor-pointer block p-3 hover:bg-green-50 rounded">🧾 Reportes</a>
    <a onclick="view('mov')" class="cursor-pointer block p-3 hover:bg-green-50 rounded">🔄 Movimientos</a>
  </nav>
</div>

<!-- MAIN -->
<div class="flex-1 p-6 overflow-auto" id="main"></div>

</div>

<script>

/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyAEj22gE5UySwWVwIec6jpBiZ2nb1OBftM",
  authDomain: "agromaxgt-app.firebaseapp.com",
  projectId: "agromaxgt-app",
  storageBucket: "agromaxgt-app.firebasestorage.app",
  messagingSenderId: "648144313047",
  appId: "1:648144313047:web:118a67464d99f2d0462e92"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ================= STATE ================= */
let productos = [];

/* ================= INIT ================= */
window.onload = () => {
  view("dashboard");

  db.collection("productos").onSnapshot(snap => {
    productos = snap.docs.map(d => ({id:d.id,...d.data()}));
    render();
  });
};

/* ================= NAV ================= */
function view(v){
  const main = document.getElementById("main");

  if(v==="dashboard") main.innerHTML = dashboardUI();
  if(v==="report") main.innerHTML = reportUI();
  if(v==="mov") main.innerHTML = `<h2 class="text-2xl font-bold">Movimientos</h2>`;
}

/* ================= DASHBOARD ================= */
function dashboardUI(){
return `
<h1 class="text-3xl font-bold mb-4">📦 Inventario PRO MAX</h1>

<div class="flex gap-2 mb-4">
<button onclick="printInventory()" class="bg-green-600 text-white px-4 py-2 rounded">
🧾 Imprimir Inventario
</button>

<button onclick="exportCSV()" class="bg-blue-600 text-white px-4 py-2 rounded">
⬇ Exportar CSV
</button>
</div>

<input id="search" oninput="render()" placeholder="Buscar producto..."
class="w-full p-2 border rounded mb-4">

<div id="list"></div>
`;
}

/* ================= REPORT ================= */
function reportUI(){
return `
<div id="printArea" class="bg-white p-8">

<h1 class="text-2xl font-bold mb-4">📊 Reporte de Inventario AGROMAXGTM</h1>

<p>Fecha: ${new Date().toLocaleString()}</p>

<table class="w-full mt-4 border">
<thead>
<tr>
<th>Producto</th>
<th>Stock</th>
<th>Precio</th>
<th>Total</th>
</tr>
</thead>

<tbody>
${productos.map(p=>`
<tr>
<td>${p.nombre}</td>
<td>${p.stock}</td>
<td>Q${p.precio}</td>
<td>Q${(p.stock||0)*(p.precio||0)}</td>
</tr>
`).join("")}
</tbody>
</table>

<br>

<h3>Total inventario: Q${total()}</h3>

</div>
`;
}

/* ================= RENDER LIST ================= */
function render(){

const q = document.getElementById("search")?.value?.toLowerCase() || "";

const filtered = productos.filter(p =>
p.nombre?.toLowerCase().includes(q)
);

const el = document.getElementById("list");
if(!el) return;

el.innerHTML = filtered.map(p=>`
<div class="bg-white p-3 mb-2 rounded shadow flex justify-between">
<div>
<b>${p.nombre}</b><br>
Stock: ${p.stock}
</div>

<div class="text-right">
Q${p.precio}
</div>
</div>
`).join("");
}

/* ================= PRINT ================= */
function printInventory(){
window.print();
}

/* ================= CSV ================= */
function exportCSV(){
let csv = "Producto,Stock,Precio\n";

productos.forEach(p=>{
csv += `${p.nombre},${p.stock},${p.precio}\n`;
});

const blob = new Blob([csv], {type:"text/csv"});
const url = URL.createObjectURL(blob);

const a = document.createElement("a");
a.href = url;
a.download = "inventario.csv";
a.click();
}

/* ================= TOTAL ================= */
function total(){
return productos.reduce((a,p)=>
a + (p.stock||0)*(p.precio||0),0).toFixed(2);
}

</script>

</body>
</html>
