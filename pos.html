<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGROMAXGTM - Caja Mostrador</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>

<body class="bg-gray-100">

<div class="flex h-screen">

<!-- SIDEBAR -->
<div class="w-72 bg-white border-r shadow-xl overflow-y-auto">
  <div class="p-6 border-b bg-green-700 text-white">
    <h1 class="text-2xl font-bold">AGROMAXGTM</h1>
    <p class="text-xs">Caja Registradora</p>
  </div>

  <nav class="p-4 space-y-2">
    <a onclick="view('venta')" class="block p-3 hover:bg-green-50 rounded-xl">🛒 Nueva Venta</a>
    <a onclick="view('pendientes')" class="block p-3 hover:bg-green-50 rounded-xl">⏳ Pendientes</a>
    <a onclick="view('historial')" class="block p-3 hover:bg-green-50 rounded-xl">📊 Historial</a>
  </nav>
</div>

<!-- APP -->
<div class="flex-1 p-8 overflow-auto" id="app"></div>

</div>

<script>
/* ================= FIREBASE ================= */
firebase.initializeApp({
  apiKey: "AIzaSyAEj22gE5UySwWVwIec6jpBiZ2nb1OBftM",
  authDomain: "agromaxgt-app.firebaseapp.com",
  projectId: "agromaxgt-app"
});

const db = firebase.firestore();
const auth = firebase.auth();

/* ================= VARIABLES ================= */
let carrito = [];

/* ================= AUTH ================= */
auth.onAuthStateChanged(user=>{
  if(!user){
    mostrarLogin();
  } else {
    view("venta");
  }
});

function mostrarLogin(){
  document.getElementById("app").innerHTML = `
    <div class="flex items-center justify-center h-full">
      <div class="bg-white p-10 rounded-2xl shadow w-96">
        <h2 class="text-xl font-bold mb-4">Login Caja</h2>
        <input id="email" class="w-full border p-2 mb-3" placeholder="Correo">
        <input id="pass" type="password" class="w-full border p-2 mb-3" placeholder="Contraseña">
        <button onclick="login()" class="w-full bg-green-600 text-white p-2 rounded">
          Entrar
        </button>
      </div>
    </div>
  `;
}

async function login(){
  try{
    await auth.signInWithEmailAndPassword(
      document.getElementById("email").value,
      document.getElementById("pass").value
    );
  } catch(e){
    alert(e.message);
  }
}

/* ================= VIEW ================= */
function view(v){
  const app = document.getElementById("app");

  if(v === "venta"){
    app.innerHTML = `
      <h1 class="text-2xl font-bold mb-4">Nueva Venta</h1>

      <input id="search" onkeyup="buscar()" class="w-full border p-2 mb-4" placeholder="Buscar">

      <div id="results"></div>

      <hr class="my-4">

      <div id="cart"></div>

      <div class="mt-4">
        <label>Método de Pago</label>
        <select id="metodoPago" class="w-full border p-2">
          <option value="">Seleccione</option>
          <option value="Efectivo">Efectivo</option>
          <option value="Tarjeta">Tarjeta</option>
          <option value="Transferencia">Transferencia</option>
        </select>
      </div>

      <div id="efectivoBox" class="hidden mt-3">
        <input id="montoRecibido" class="w-full border p-2" placeholder="Monto recibido">
        <p>Cambio: <b id="cambioTexto">Q0.00</b></p>
      </div>

      <button onclick="finalizarVenta()" class="w-full bg-green-600 text-white p-3 mt-4">
        Finalizar Venta
      </button>
    `;
  }

  if(v==="historial") cargarHistorial();
  if(v==="pendientes") cargarPendientes();

  /* EVENTOS SOLO 1 VEZ */
  setTimeout(()=>{
    const mp = document.getElementById("metodoPago");
    if(mp){
      mp.onchange = ()=>{
        const box = document.getElementById("efectivoBox");
        box.style.display = mp.value==="Efectivo"?"block":"none";
      }
    }

    const monto = document.getElementById("montoRecibido");
    if(monto){
      monto.oninput = ()=>{
        const total = carrito.reduce((s,p)=>s+p.precio*p.cantidad,0);
        const recibido = parseFloat(monto.value)||0;
        const cambio = recibido - total;
        document.getElementById("cambioTexto").innerText =
        "Q"+(cambio>0?cambio.toFixed(2):"0.00");
      }
    }
  },200);
}

/* ================= SEARCH ================= */
async function buscar(){
  const t = document.getElementById("search").value.toLowerCase();
  const box = document.getElementById("results");

  if(t.length<2){ box.innerHTML=""; return; }

  const snap = await db.collection("productos").get();

  let html="";
  snap.forEach(doc=>{
    const p = doc.data();
    if(p.nombre.toLowerCase().includes(t)){
      html += `
        <div class="p-2 border mb-2 cursor-pointer"
        onclick="add('${doc.id}','${p.nombre}',${p.precio},${p.stock})">
          ${p.nombre} - Q${p.precio}
        </div>
      `;
    }
  });

  box.innerHTML = html;
}

/* ================= CART ================= */
function add(id,nombre,precio,stock){
  let f = carrito.find(p=>p.id===id);
  if(f) f.cantidad++;
  else carrito.push({id,nombre,precio,cantidad:1});

  render();
}

function render(){
  const box = document.getElementById("cart");
  if(!box) return;

  let html="";
  let total=0;

  carrito.forEach((p,i)=>{
    total += p.precio*p.cantidad;
    html += `
      <div class="flex justify-between border p-2 mb-2">
        ${p.nombre} x${p.cantidad}
        <b>Q${p.precio*p.cantidad}</b>
        <button onclick="del(${i})">X</button>
      </div>
    `;
  });

  box.innerHTML = html + `<hr>Total: Q${total}`;
}

function del(i){
  carrito.splice(i,1);
  render();
}

/* ================= FINALIZAR ================= */
async function finalizarVenta(){

  if(carrito.length===0) return alert("Carrito vacío");

  const metodoPago = document.getElementById("metodoPago").value;
  const montoRecibido = parseFloat(document.getElementById("montoRecibido")?.value)||0;

  const total = carrito.reduce((s,p)=>s+p.precio*p.cantidad,0);
  const cambio = montoRecibido - total;

  if(metodoPago==="Efectivo" && montoRecibido < total){
    return alert("Monto insuficiente");
  }

  await db.collection("ventas").add({
    carrito,
    total,
    metodoPago,
    montoRecibido,
    cambio,
    fecha:new Date()
  });

  abrirTicket({carrito,total,metodoPago,montoRecibido,cambio});

  carrito=[];
  render();
  view("venta");
}

/* ================= TICKET ================= */
function abrirTicket(d){
  const w = window.open();
  w.document.write(`
    <h2>AGROMAXGTM</h2>
    ${d.carrito.map(p=>`<p>${p.nombre} x${p.cantidad}</p>`).join("")}
    <hr>
    <p>Total: Q${d.total}</p>
    <p>Método: ${d.metodoPago}</p>
    <p>Cambio: Q${d.cambio}</p>
  `);
  w.print();
}

/* ================= HISTORIAL ================= */
function cargarHistorial(){
  document.getElementById("app").innerHTML = `<h2>Historial</h2>`;
}

/* ================= PENDIENTES ================= */
function cargarPendientes(){
  document.getElementById("app").innerHTML = `<h2>Pendientes</h2>`;
}

/* INIT */
view("venta");
</script>

</body>
</html>
