<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seguimiento de pedido | AGROMAXGTM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 min-h-screen">

  <header class="bg-white border-b border-slate-100">
    <div class="max-w-lg mx-auto px-4 py-4 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2 font-bold text-green-800">
        <span class="text-2xl">🌱</span> AGROMAXGTM
      </a>
      <a href="/" class="text-sm text-slate-500 hover:text-green-700">Catálogo</a>
    </div>
  </header>

  <main class="max-w-lg mx-auto px-4 py-8">
    <h1 class="text-2xl font-extrabold text-slate-900 mb-1">Seguimiento de pedido</h1>
    <p class="text-sm text-slate-500 mb-6">Ingresa tu código de seguimiento (ej. AGM-A1B2C3)</p>

    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 mb-6 flex gap-2">
      <input id="codigo" type="text" placeholder="AGM-XXXXXX"
             class="flex-1 p-3 border border-slate-200 rounded-xl text-sm uppercase focus:outline-none focus:ring-2 focus:ring-green-500"
             onkeydown="if(event.key==='Enter') buscarSeguimiento()">
      <button onclick="buscarSeguimiento()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-3 rounded-xl font-semibold text-sm">
        Buscar
      </button>
    </div>

    <div id="resultado" class="hidden"></div>
    <p id="error" class="hidden text-center text-red-600 text-sm"></p>
  </main>

  <script src="./js/firebase-config.js"></script>
  <script>
    let unsub = null;

    const pasos = ['Pagado', 'En proceso', 'En camino', 'Entregado'];

    function estadoIndex(estado) {
      const e = estado || 'Pendiente';
      if (e === 'Pendiente') return 0;
      if (e === 'Pagado') return 0;
      if (e === 'En proceso') return 1;
      if (e === 'En camino') return 2;
      if (e === 'Entregado') return 3;
      if (e === 'Cancelado') return -1;
      return 0;
    }

    function renderPedido(p) {
      const idx = estadoIndex(p.estado);
      const fechaEst = p.fechaEstimada && p.fechaEstimada.toDate
        ? p.fechaEstimada.toDate().toLocaleDateString('es-GT', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })
        : (p.fechaEstimadaTexto || 'Por confirmar');

      const fechaPedido = p.fecha && p.fecha.toDate
        ? p.fecha.toDate().toLocaleString('es-GT')
        : '';

      const timeline = pasos.map((paso, i) => {
        const done = idx >= i && idx >= 0;
        const current = idx === i;
        return `
          <div class="flex gap-3 items-start">
            <div class="flex flex-col items-center">
              <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold ${done ? 'bg-green-600 text-white' : 'bg-slate-200 text-slate-500'}">
                ${done ? '<i class="fas fa-check text-xs"></i>' : (i + 1)}
              </div>
              ${i < pasos.length - 1 ? `<div class="w-0.5 h-8 ${idx > i ? 'bg-green-600' : 'bg-slate-200'}"></div>` : ''}
            </div>
            <div class="pt-1 pb-4">
              <p class="font-semibold text-sm ${current ? 'text-green-700' : 'text-slate-700'}">${paso}</p>
            </div>
          </div>`;
      }).join('');

      const productos = (p.productos || []).map(i =>
        `<div class="flex justify-between text-sm"><span>${i.nombre} × ${i.cantidad}</span><span>Q${(i.precio * i.cantidad).toFixed(2)}</span></div>`
      ).join('');

      document.getElementById('resultado').innerHTML = `
        <div class="bg-white rounded-3xl shadow-sm border border-slate-100 p-5 sm:p-6 space-y-5">
          <div class="flex justify-between items-start gap-3">
            <div>
              <p class="text-xs text-slate-500">Código de seguimiento</p>
              <p class="text-xl font-extrabold text-green-800 tracking-wide">${p.trackingCode}</p>
            </div>
            <span class="px-3 py-1 rounded-full text-xs font-semibold ${p.estado === 'Entregado' ? 'bg-green-100 text-green-700' : p.estado === 'Cancelado' ? 'bg-red-100 text-red-700' : 'bg-blue-100 text-blue-700'}">
              ${p.estado || 'Pendiente'}
            </span>
          </div>

          <div class="bg-green-50 border border-green-100 rounded-2xl p-4">
            <p class="text-xs text-green-700 font-medium mb-1"><i class="fas fa-calendar-alt mr-1"></i> Fecha estimada de llegada</p>
            <p class="font-bold text-green-900 capitalize">${fechaEst}</p>
            <p class="text-xs text-green-700/80 mt-1">Puede variar según zona y disponibilidad</p>
          </div>

          <div>
            <p class="text-sm font-bold text-slate-800 mb-3">Estado del envío</p>
            ${p.estado === 'Cancelado'
              ? '<p class="text-red-600 text-sm">Este pedido fue cancelado. Contáctanos por WhatsApp.</p>'
              : timeline}
          </div>

          <div class="border-t pt-4 space-y-1">
            <p class="text-sm font-bold mb-2">Productos</p>
            ${productos}
            <p class="font-bold text-green-700 pt-2">Total: Q${Number(p.total || 0).toFixed(2)}</p>
          </div>

          <div class="border-t pt-4 text-sm text-slate-600 space-y-1">
            <p><b>Cliente:</b> ${p.cliente || ''}</p>
            ${p.direccion ? `<p><b>Dirección:</b> ${p.direccion}</p>` : ''}
            ${fechaPedido ? `<p class="text-xs text-slate-400">Pedido: ${fechaPedido}</p>` : ''}
          </div>

          <a href="https://wa.me/50242664744?text=${encodeURIComponent('Hola, consulto mi pedido ' + p.trackingCode)}"
             class="block text-center bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-2xl">
            <i class="fab fa-whatsapp mr-1"></i> Consultar por WhatsApp
          </a>
        </div>`;
      document.getElementById('resultado').classList.remove('hidden');
    }

    async function buscarSeguimiento() {
      const codigo = (document.getElementById('codigo').value || '').trim().toUpperCase();
      const err = document.getElementById('error');
      err.classList.add('hidden');
      document.getElementById('resultado').classList.add('hidden');

      if (!codigo) {
        err.textContent = 'Ingresa un código de seguimiento';
        err.classList.remove('hidden');
        return;
      }

      if (unsub) { unsub(); unsub = null; }

      try {
        const snap = await db.collection('pedidos').where('trackingCode', '==', codigo).limit(1).get();
        if (snap.empty) {
          err.textContent = 'No encontramos un pedido con ese código';
          err.classList.remove('hidden');
          return;
        }

        const doc = snap.docs[0];
        // Tiempo real: escuchar cambios de estado
        unsub = db.collection('pedidos').doc(doc.id).onSnapshot(s => {
          if (s.exists) renderPedido({ id: s.id, ...s.data() });
        });

        // Guardar en URL
        const url = new URL(window.location.href);
        url.searchParams.set('codigo', codigo);
        history.replaceState(null, '', url);
      } catch (e) {
        console.error(e);
        err.textContent = 'Error al buscar. Intenta de nuevo.';
        err.classList.remove('hidden');
      }
    }

    window.onload = function () {
      const params = new URLSearchParams(window.location.search);
      const c = params.get('codigo');
      if (c) {
        document.getElementById('codigo').value = c;
        buscarSeguimiento();
      }
    };
  </script>
</body>
</html>
