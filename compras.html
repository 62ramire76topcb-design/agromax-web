<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGROMAXGTM - Compras</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100">

  <div class="flex h-screen">
    <div class="w-72 bg-white border-r shadow-xl overflow-y-auto">
      <div class="p-6 border-b bg-green-700 text-white">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-white rounded-2xl flex items-center justify-center text-green-700 text-3xl">🌱</div>
          <div>
            <h1 class="text-2xl font-bold">AGROMAXGTM</h1>
            <p class="text-xs">Módulo de Compras</p>
          </div>
        </div>
      </div>
      <nav class="p-4 space-y-1">
        <a href="admin.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-arrow-left"></i> Volver al Admin</a>
        <a onclick="mostrarSeccion('nueva-orden')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-plus"></i> Nueva Orden</a>
        <a onclick="mostrarSeccion('ordenes')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-list"></i> Mis Órdenes</a>
        <a onclick="mostrarSeccion('proveedores')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-truck"></i> Proveedores</a>
      </nav>
    </div>

    <div class="flex-1 overflow-auto p-8" id="main-content"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAEj22gE5UySwWVwIec6jpBiZ2nb1OBftM",
      authDomain: "agromaxgt-app.firebaseapp.com",
      projectId: "agromaxgt-app",
      storageBucket: "agromaxgt-app.firebasestorage.app",
      messagingSenderId: "648144313047",
      appId: "1:648144313047:web:118a67464d99f2d0462e92"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let productosOrden = [];

    async function verificarAuth() {
      return new Promise(resolve => {
        auth.onAuthStateChanged(user => {
          if (!user) window.location.href = "admin.html";
          else resolve(user);
        });
      });
    }

    async function mostrarSeccion(seccion) {
      await verificarAuth();
      const content = document.getElementById('main-content');

      if (seccion === 'nueva-orden') {
        await cargarProveedoresParaSelect();
        content.innerHTML = `... (código de nueva orden anterior) ...`; // Mantengo el anterior
      } 
      else if (seccion === 'ordenes') {
        content.innerHTML = `
          <h1 class="text-3xl font-bold mb-8">Mis Órdenes de Compra</h1>
          <div id="lista-ordenes" class="space-y-6"></div>`;
        cargarOrdenes();
      } 
      else if (seccion === 'proveedores') {
        // ... código de proveedores
      }
    }

    // ==================== MIS ÓRDENES CON ESTADO, EDITAR Y ELIMINAR ====================
    async function cargarOrdenes() {
      const container = document.getElementById('lista-ordenes');
      
      db.collection('ordenes_compra').orderBy('fecha', 'desc').onSnapshot(snapshot => {
        let html = '';
        snapshot.forEach(doc => {
          const o = doc.data();
          const estadoColor = o.estado === "Pendiente" ? "bg-yellow-100 text-yellow-700" : 
                             o.estado === "Recibida" ? "bg-green-100 text-green-700" : "bg-gray-100 text-gray-700";
          
          html += `
            <div class="bg-white rounded-3xl shadow p-6">
              <div class="flex justify-between items-start">
                <div>
                  <p class="font-bold text-lg">${o.proveedor}</p>
                  <p class="text-sm text-gray-500">${o.fecha.toDate().toLocaleString('es-GT')}</p>
                </div>
                <span class="px-4 py-1 rounded-full text-sm font-medium ${estadoColor}">${o.estado}</span>
              </div>
              <div class="mt-4 text-sm">
                ${o.productos.map(p => `${p.nombre} × ${p.cantidad}`).join(' • ')}
              </div>
              <div class="mt-6 pt-4 border-t flex justify-between items-center">
                <span class="font-bold">Total: Q${o.total ? o.total.toFixed(2) : '0.00'}</span>
                <div>
                  <button onclick="cambiarEstado('${doc.id}')" class="text-blue-600 hover:text-blue-700 mr-4">Cambiar Estado</button>
                  <button onclick="eliminarOrden('${doc.id}')" class="text-red-600 hover:text-red-700">Eliminar</button>
                </div>
              </div>
            </div>`;
        });
        container.innerHTML = html || '<p class="text-center py-12 text-gray-400">No hay órdenes registradas</p>';
      });
    }

    async function cambiarEstado(id) {
      const nuevoEstado = prompt("Nuevo estado (Pendiente / Enviada / Recibida):", "Recibida");
      if (!nuevoEstado) return;
      
      try {
        await db.collection('ordenes_compra').doc(id).update({ estado: nuevoEstado });
        alert("Estado actualizado");
      } catch (e) {
        alert("Error: " + e.message);
      }
    }

    async function eliminarOrden(id) {
      if (confirm("¿Eliminar esta orden permanentemente?")) {
        try {
          await db.collection('ordenes_compra').doc(id).delete();
          alert("Orden eliminada");
        } catch (e) {
          alert("Error: " + e.message);
        }
      }
    }

    // Mantén las demás funciones (nueva-orden, proveedores, etc.)

    window.onload = () => mostrarSeccion('ordenes');
  </script>
</body>
</html>
