<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGROMAXGTM - Módulo de Compras</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100">

  <div class="flex h-screen">
    <div class="w-72 bg-white border-r shadow-xl overflow-y-auto">
      <div class="p-6 border-b bg-green-700 text-white">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-white rounded-2xl flex items-center justify-center text-green-700 text-3xl">🌱</div>
          <div>
            <h1 class="text-2xl font-bold">AGROMAXGTM</h1>
            <p class="text-xs">Módulo de Compras + Stock</p>
          </div>
        </div>
      </div>
      <nav class="p-4 space-y-1">
        <a href="admin.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-arrow-left"></i> Volver al Panel Principal</a>
        <a onclick="mostrarSeccion('nueva-orden')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-plus"></i> Nueva Orden</a>
        <a onclick="mostrarSeccion('ordenes')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-list"></i> Órdenes</a>
        <a onclick="mostrarSeccion('recepciones')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-boxes"></i> Recepción + Stock</a>
        <a onclick="mostrarSeccion('proveedores')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-truck"></i> Proveedores</a>
      </nav>
    </div>

    <div class="flex-1 overflow-auto p-8" id="main-content"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAEj22gE5UySwWVwIec6jpBiZ2nb1OBftM",
      authDomain: "agromaxgt-app.firebaseapp.com",
      projectId: "agromaxgt-app",
      storageBucket: "agromaxgt-app.firebasestorage.app",
      messagingSenderId: "648144313047",
      appId: "1:648144313047:web:118a67464d99f2d0462e92"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let productosOrden = [];

    async function verificarAuth() {
      return new Promise(resolve => {
        auth.onAuthStateChanged(user => {
          if (!user) window.location.href = "admin.html";
          else resolve(user);
        });
      });
    }

    async function mostrarSeccion(seccion) {
      await verificarAuth();
      const content = document.getElementById('main-content');

      if (seccion === 'nueva-orden') {
        // ... (código anterior de nueva orden)
      } 
      else if (seccion === 'recepciones') {
        content.innerHTML = `
          <h1 class="text-3xl font-bold mb-8">Recepción de Mercancía + Actualización de Stock</h1>
          <div id="lista-ordenes-pendientes" class="space-y-6"></div>`;
        cargarOrdenesParaRecepcion();
      } 
      // ... otras secciones
    }

    // ==================== RECEPCIÓN CON ACTUALIZACIÓN DE STOCK ====================
    async function cargarOrdenesParaRecepcion() {
      const container = document.getElementById('lista-ordenes-pendientes');
      
      db.collection('ordenes_compra').where('estado', '==', 'Pendiente').onSnapshot(snapshot => {
        let html = '';
        snapshot.forEach(doc => {
          const o = doc.data();
          html += `
            <div class="bg-white rounded-3xl shadow p-6">
              <div class="flex justify-between">
                <div>
                  <p class="font-bold">${o.proveedor}</p>
                  <p class="text-sm text-gray-500">${o.fecha.toDate().toLocaleString('es-GT')}</p>
                </div>
                <button onclick="recibirOrden('${doc.id}', ${JSON.stringify(o.productos)})" 
                        class="bg-green-600 text-white px-6 py-2 rounded-2xl">Recibir Mercancía</button>
              </div>
              <div class="mt-4 text-sm">
                ${o.productos.map(p => `${p.nombre} × ${p.cantidad}`).join(' • ')}
              </div>
            </div>`;
        });
        container.innerHTML = html || `<p class="text-center py-12 text-gray-400">No hay órdenes pendientes de recepción</p>`;
      });
    }

    async function recibirOrden(ordenId, productos) {
      if (!confirm("¿Confirmar recepción de esta orden y actualizar stock?")) return;

      try {
        for (let item of productos) {
          // Buscar producto por nombre y actualizar stock
          const query = await db.collection('productos').where('nombre', '==', item.nombre).get();
          query.forEach(async (doc) => {
            const currentStock = doc.data().stock || 0;
            await db.collection('productos').doc(doc.id).update({
              stock: currentStock + item.cantidad
            });
          });
        }

        // Cambiar estado de la orden
        await db.collection('ordenes_compra').doc(ordenId).update({ estado: "Recibida" });

        alert("✅ Mercancía recibida y stock actualizado en tiempo real");
      } catch (e) {
        alert("Error: " + e.message);
      }
    }

    // Mantén las demás funciones (nueva-orden, proveedores, etc.)

    window.onload = () => mostrarSeccion('recepciones');
  </script>
</body>
</html>
