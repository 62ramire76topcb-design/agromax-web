<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGROMAXGTM - Compras</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100">

  <div class="flex h-screen">
    <!-- Sidebar -->
    <div class="w-72 bg-white border-r shadow-xl overflow-y-auto">
      <div class="p-6 border-b bg-green-700 text-white">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-white rounded-2xl flex items-center justify-center text-green-700 text-3xl">🌱</div>
          <div>
            <h1 class="text-2xl font-bold">AGROMAXGTM</h1>
            <p class="text-xs">Módulo de Compras</p>
          </div>
        </div>
      </div>
      <nav class="p-4 space-y-1">
        <a href="admin.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-arrow-left"></i> Volver al Admin</a>
        <a onclick="mostrarSeccion('nueva-orden')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-plus"></i> Nueva Orden</a>
        <a onclick="mostrarSeccion('ordenes')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-list"></i> Mis Órdenes</a>
        <a onclick="mostrarSeccion('proveedores')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-truck"></i> Proveedores</a>
        <a onclick="mostrarSeccion('recepciones')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-boxes"></i> Recepción y Stock</a>
      </nav>
    </div>

    <div class="flex-1 overflow-auto p-8" id="main-content"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAEj22gE5UySwWVwIec6jpBiZ2nb1OBftM",
      authDomain: "agromaxgt-app.firebaseapp.com",
      projectId: "agromaxgt-app",
      storageBucket: "agromaxgt-app.firebasestorage.app",
      messagingSenderId: "648144313047",
      appId: "1:648144313047:web:118a67464d99f2d0462e92"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let productosOrden = [];
    let allProductos = [];

    async function verificarAuth() {
      return new Promise(resolve => {
        auth.onAuthStateChanged(user => {
          if (!user) {
            alert("Debes iniciar sesión");
            window.location.href = "admin.html";
          } else resolve(user);
        });
      });
    }

    async function mostrarSeccion(seccion) {
      await verificarAuth();
      const content = document.getElementById('main-content');

      if (seccion === 'nueva-orden') {
        await cargarProveedores();
        await cargarTodosProductos();
        content.innerHTML = `
          <h1 class="text-3xl font-bold mb-8">Nueva Orden de Compra</h1>
          <div class="max-w-4xl bg-white p-8 rounded-3xl shadow">
            <select id="proveedor-select" class="w-full p-4 border rounded-2xl mb-6"></select>
            <input id="fecha" type="date" class="w-full p-4 border rounded-2xl mb-6">
            <textarea id="notas" placeholder="Notas..." class="w-full p-4 border rounded-2xl h-32"></textarea>

            <div class="mt-8">
              <h3 class="font-bold mb-4">Buscar Producto</h3>
              <input id="buscar" placeholder="Escribe nombre del producto..." class="w-full p-4 border rounded-2xl mb-4" onkeyup="filtrarProductos()">
              <div id="resultados" class="max-h-80 overflow-auto border rounded-2xl p-3 bg-gray-50"></div>
            </div>

            <div id="lista-orden" class="mt-10 space-y-3"></div>

            <button onclick="guardarOrden()" class="mt-8 w-full bg-green-700 text-white py-4 rounded-3xl font-bold">Guardar Orden de Compra</button>
          </div>`;
      } 
      else if (seccion === 'ordenes') {
        content.innerHTML = `<h1 class="text-3xl font-bold mb-8">Órdenes de Compra</h1><div id="lista-ordenes" class="space-y-6"></div>`;
        cargarOrdenes();
      } 
      else if (seccion === 'proveedores') {
        content.innerHTML = `
          <h1 class="text-3xl font-bold mb-8">Proveedores</h1>
          <div class="max-w-lg bg-white p-8 rounded-3xl shadow">
            <input id="nom-prov" class="w-full p-4 border rounded-2xl mb-4" placeholder="Nombre">
            <input id="tel-prov" class="w-full p-4 border rounded-2xl mb-4" placeholder="Teléfono WhatsApp">
            <input id="cod-prov" class="w-full p-4 border rounded-2xl mb-6" placeholder="Código">
            <button onclick="agregarProveedor()" class="w-full bg-green-600 text-white py-4 rounded-2xl">Agregar Proveedor</button>
          </div>
          <div id="lista-provs" class="mt-8 grid grid-cols-1 gap-4"></div>`;
        cargarProveedoresLista();
      } 
      else if (seccion === 'recepciones') {
        content.innerHTML = `<h1 class="text-3xl font-bold mb-8">Recepción de Mercancía</h1><div id="lista-recepcion" class="space-y-6"></div>`;
        cargarRecepciones();
      }
    }

    // ==================== BUSQUEDA Y ORDEN ====================
    async function cargarTodosProductos() {
      const snap = await db.collection('productos').get();
      allProductos = snap.docs.map(d => ({id: d.id, ...d.data()}));
    }

    function filtrarProductos() {
      const term = document.getElementById('buscar').value.toLowerCase();
      const cont = document.getElementById('resultados');
      if (term.length < 2) { cont.innerHTML = ''; return; }

      const res = allProductos.filter(p => p.nombre.toLowerCase().includes(term));
      cont.innerHTML = res.map(p => `
        <div onclick="agregarAOrden('${p.nombre}', ${p.precio})" class="p-4 hover:bg-white rounded-xl cursor-pointer flex justify-between">
          <span>${p.nombre}</span>
          <span class="font-bold text-green-600">Q${p.precio}</span>
        </div>
      `).join('');
    }

    function agregarAOrden(nombre, precio) {
      const cant = parseInt(prompt("Cantidad:", 10)) || 10;
      productosOrden.push({nombre, cantidad: cant, precio});
      renderOrdenActual();
    }

    function renderOrdenActual() {
      document.getElementById('lista-orden').innerHTML = productosOrden.map((p,i) => `
        <div class="flex justify-between bg-gray-50 p-4 rounded-2xl">
          <span>${p.nombre} × ${p.cantidad}</span>
          <span class="font-bold">Q${(p.precio*p.cantidad).toFixed(2)}</span>
          <button onclick="productosOrden.splice(${i},1);renderOrdenActual()" class="text-red-600">Eliminar</button>
        </div>
      `).join('');
    }

    async function guardarOrden() {
      const prov = document.getElementById('proveedor-select').value;
      if (!prov || productosOrden.length === 0) return alert("Faltan datos");

      const total = productosOrden.reduce((a,p)=>a + p.precio*p.cantidad, 0);

      await db.collection('ordenes_compra').add({
        proveedor: prov,
        fecha: new Date(),
        productos: productosOrden,
        total,
        estado: "Pendiente"
      });

      alert("✅ Orden guardada");
      productosOrden = [];
      mostrarSeccion('ordenes');
    }

    // ==================== OTRAS FUNCIONES (Proveedores, Recepciones, etc.) ====================
    async function agregarProveedor() {
      const nombre = document.getElementById('nom-prov').value.trim();
      const telefono = document.getElementById('tel-prov').value.trim();
      if (!nombre) return alert("Nombre obligatorio");

      await db.collection('proveedores').add({nombre, telefono, fecha: new Date()});
      alert("Proveedor agregado");
      cargarProveedoresLista();
    }

    async function cargarProveedoresLista() {
      // ... (implementación similar a anterior)
      const snap = await db.collection('proveedores').get();
      let html = '';
      snap.forEach(d => {
        const p = d.data();
        html += `<div class="bg-white p-6 rounded-3xl"><p class="font-bold">${p.nombre}</p><p onclick="window.open('https://wa.me/502${p.telefono}','_blank')" class="text-green-600 cursor-pointer">📱 ${p.telefono}</p></div>`;
      });
      document.getElementById('lista-provs').innerHTML = html || 'Sin proveedores';
    }

    async function cargarProveedores() {
      const sel = document.getElementById('proveedor-select');
      const snap = await db.collection('proveedores').get();
      sel.innerHTML = '<option value="">Seleccionar Proveedor</option>';
      snap.forEach(d => {
        const p = d.data();
        const opt = document.createElement('option');
        opt.value = p.nombre;
        opt.textContent = p.nombre;
        sel.appendChild(opt);
      });
    }

    async function cargarOrdenes() {
      // implementación básica
      document.getElementById('lista-ordenes').innerHTML = `<p class="text-gray-500">Cargando órdenes...</p>`;
    }

    async function cargarRecepciones() {
      // implementación básica de recepción
      document.getElementById('lista-recepcion').innerHTML = `<p class="text-gray-500">Cargando recepción...</p>`;
    }

    window.onload = () => mostrarSeccion('nueva-orden');
  </script>
</body>
</html>
