<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGROMAXGTM - Módulo de Compras</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100">

  <div class="flex h-screen">
    <div class="w-72 bg-white border-r shadow-xl overflow-y-auto">
      <div class="p-6 border-b bg-green-700 text-white">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-white rounded-2xl flex items-center justify-center text-green-700 text-3xl">🌱</div>
          <div>
            <h1 class="text-2xl font-bold">AGROMAXGTM</h1>
            <p class="text-xs">Módulo de Compras</p>
          </div>
        </div>
      </div>
      <nav class="p-4 space-y-1">
        <a href="admin.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-arrow-left"></i> Volver al Panel Principal</a>
        <a onclick="mostrarSeccion('nueva-orden')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-plus"></i> Nueva Orden de Compra</a>
        <a onclick="mostrarSeccion('ordenes')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-list"></i> Órdenes de Compra</a>
        <a onclick="mostrarSeccion('proveedores')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-truck"></i> Proveedores</a>
        <a onclick="mostrarSeccion('recepciones')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-boxes"></i> Recepción de Mercancía</a>
      </nav>
    </div>

    <div class="flex-1 overflow-auto p-8" id="main-content"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAEj22gE5UySwWVwIec6jpBiZ2nb1OBftM",
      authDomain: "agromaxgt-app.firebaseapp.com",
      projectId: "agromaxgt-app",
      storageBucket: "agromaxgt-app.firebasestorage.app",
      messagingSenderId: "648144313047",
      appId: "1:648144313047:web:118a67464d99f2d0462e92"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let productosOrden = [];
    let allProductos = [];

    async function verificarAuth() {
      return new Promise(resolve => {
        auth.onAuthStateChanged(user => {
          if (!user) window.location.href = "admin.html";
          else resolve(user);
        });
      });
    }

    async function mostrarSeccion(seccion) {
      await verificarAuth();
      const content = document.getElementById('main-content');

      if (seccion === 'nueva-orden') {
        await cargarProveedores();
        await cargarTodosProductos();
        content.innerHTML = `
          <h1 class="text-3xl font-bold mb-8">Nueva Orden de Compra</h1>
          <div class="max-w-4xl bg-white p-8 rounded-3xl shadow">
            <select id="proveedor-select" class="w-full p-4 border rounded-2xl mb-6"></select>
            <input id="fecha" type="date" class="w-full p-4 border rounded-2xl mb-6">
            <textarea id="notas" placeholder="Notas o condiciones" class="w-full p-4 border rounded-2xl h-32"></textarea>
            
            <div class="mt-8">
              <h3 class="font-bold mb-4">Buscar Producto del Catálogo</h3>
              <input id="buscar-producto" placeholder="Buscar por nombre..." 
                     class="w-full p-4 border rounded-2xl mb-4" onkeyup="filtrarProductos()">
              <div id="resultados-busqueda" class="max-h-80 overflow-y-auto border rounded-2xl p-4 bg-gray-50"></div>
            </div>

            <div class="mt-10">
              <h3 class="font-bold mb-4">Productos en esta Orden</h3>
              <div id="lista-productos-orden" class="space-y-4"></div>
            </div>

            <button onclick="guardarOrdenCompra()" class="mt-10 w-full bg-green-700 text-white py-4 rounded-3xl font-bold text-lg">Guardar Orden de Compra</button>
          </div>`;
      } 
      else if (seccion === 'ordenes') {
        content.innerHTML = `<h1 class="text-3xl font-bold mb-8">Órdenes de Compra</h1><div id="lista-ordenes" class="space-y-6"></div>`;
        cargarOrdenes();
      } 
      else if (seccion === 'proveedores') {
        // ... (código anterior de proveedores)
      }
    }

    // Cargar todos los productos para búsqueda
    async function cargarTodosProductos() {
      const snapshot = await db.collection('productos').get();
      allProductos = [];
      snapshot.forEach(doc => {
        allProductos.push({id: doc.id, ...doc.data()});
      });
    }

    function filtrarProductos() {
      const termino = document.getElementById('buscar-producto').value.toLowerCase().trim();
      const container = document.getElementById('resultados-busqueda');
      
      if (termino.length < 2) {
        container.innerHTML = '';
        return;
      }

      const resultados = allProductos.filter(p => 
        p.nombre.toLowerCase().includes(termino)
      );

      let html = '';
      resultados.forEach(p => {
        html += `
          <div onclick="agregarProductoDesdeCatalogo('${p.nombre}', ${p.precio})" 
               class="flex justify-between items-center p-4 hover:bg-white rounded-2xl cursor-pointer border-b">
            <span>${p.nombre}</span>
            <span class="font-bold text-green-600">Q${p.precio}</span>
          </div>`;
      });

      container.innerHTML = html || '<p class="text-gray-500">No se encontraron productos</p>';
    }

    function agregarProductoDesdeCatalogo(nombre, precio) {
      const cantidad = parseInt(prompt(`Cantidad de ${nombre}:`, "10")) || 10;
      productosOrden.push({nombre, cantidad, precio});
      renderProductosOrden();
      document.getElementById('buscar-producto').value = '';
      document.getElementById('resultados-busqueda').innerHTML = '';
    }

    function renderProductosOrden() {
      const container = document.getElementById('lista-productos-orden');
      container.innerHTML = productosOrden.map((p, i) => `
        <div class="flex justify-between items-center bg-gray-50 p-4 rounded-2xl">
          <span>${p.nombre} × ${p.cantidad}</span>
          <span class="font-bold">Q${(p.precio * p.cantidad).toFixed(2)}</span>
          <button onclick="eliminarProductoOrden(${i})" class="text-red-600">Eliminar</button>
        </div>
      `).join('');
    }

    function eliminarProductoOrden(i) {
      productosOrden.splice(i, 1);
      renderProductosOrden();
    }

    // Resto de funciones (cargarProveedores, guardarOrdenCompra, cargarOrdenes, etc.)
    async function cargarProveedores() {
      const select = document.getElementById('proveedor-select');
      const snapshot = await db.collection('proveedores').get();
      select.innerHTML = '<option value="">Seleccionar Proveedor</option>';
      snapshot.forEach(doc => {
        const p = doc.data();
        const opt = document.createElement('option');
        opt.value = p.nombre;
        opt.textContent = p.nombre;
        select.appendChild(opt);
      });
    }

    async function guardarOrdenCompra() {
      const proveedor = document.getElementById('proveedor-select').value;
      if (!proveedor || productosOrden.length === 0) {
        return alert("❌ Selecciona un proveedor y agrega productos");
      }

      const total = productosOrden.reduce((sum, p) => sum + p.precio * p.cantidad, 0);

      try {
        await db.collection('ordenes_compra').add({
          proveedor, 
          fecha: new Date(), 
          productos: productosOrden, 
          total, 
          estado: "Pendiente",
          notas: document.getElementById('notas').value || ""
        });
        alert("✅ Orden guardada correctamente");
        productosOrden = [];
        mostrarSeccion('ordenes');
      } catch (e) {
        alert("Error: " + e.message);
      }
    }

    // ... (mantén las funciones de cargarOrdenes y proveedores)

    window.onload = () => mostrarSeccion('nueva-orden');
  </script>
</body>
</html>
