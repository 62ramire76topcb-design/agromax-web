<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGROMAXGTM - Módulo de Compras</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100">

  <div class="flex h-screen">
    <div class="w-72 bg-white border-r shadow-xl overflow-y-auto">
      <div class="p-6 border-b bg-green-700 text-white">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-white rounded-2xl flex items-center justify-center text-green-700 text-3xl">🌱</div>
          <div>
            <h1 class="text-2xl font-bold">AGROMAXGTM</h1>
            <p class="text-xs">Módulo de Compras</p>
          </div>
        </div>
      </div>
      <nav class="p-4 space-y-1">
        <a href="admin.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-arrow-left"></i> Volver al Panel Principal</a>
        <a onclick="mostrarSeccion('nueva-orden')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-plus"></i> Nueva Orden de Compra</a>
        <a onclick="mostrarSeccion('ordenes')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-list"></i> Órdenes de Compra</a>
        <a onclick="mostrarSeccion('proveedores')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-truck"></i> Proveedores</a>
        <a onclick="mostrarSeccion('recepciones')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-boxes"></i> Recepción de Mercancía</a>
      </nav>
    </div>

    <div class="flex-1 overflow-auto p-8" id="main-content"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAEj22gE5UySwWVwIec6jpBiZ2nb1OBftM",
      authDomain: "agromaxgt-app.firebaseapp.com",
      projectId: "agromaxgt-app",
      storageBucket: "agromaxgt-app.firebasestorage.app",
      messagingSenderId: "648144313047",
      appId: "1:648144313047:web:118a67464d99f2d0462e92"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let productosOrden = [];

    function mostrarSeccion(seccion) {
      const content = document.getElementById('main-content');
      
      if (seccion === 'nueva-orden') {
        content.innerHTML = `
          <h1 class="text-3xl font-bold mb-8">Nueva Orden de Compra</h1>
          <div class="max-w-4xl bg-white p-8 rounded-3xl shadow">
            <div class="grid grid-cols-2 gap-6">
              <input id="proveedor" placeholder="Nombre del Proveedor" class="w-full p-4 border rounded-2xl">
              <input id="fecha" type="date" class="w-full p-4 border rounded-2xl">
            </div>
            <textarea id="notas" placeholder="Notas o condiciones" class="w-full p-4 border rounded-2xl mt-6 h-32"></textarea>
            
            <div class="mt-8">
              <h3 class="font-bold mb-4">Productos</h3>
              <button onclick="agregarProductoOrden()" class="bg-green-600 text-white px-6 py-3 rounded-2xl">+ Agregar Producto</button>
            </div>
            
            <div id="lista-productos-orden" class="mt-6 space-y-4"></div>
            
            <button onclick="guardarOrdenCompra()" class="mt-10 w-full bg-green-700 text-white py-4 rounded-3xl font-bold text-lg">Guardar Orden de Compra</button>
          </div>`;
      } else if (seccion === 'ordenes') {
        content.innerHTML = `<h1 class="text-3xl font-bold mb-8">Órdenes de Compra</h1><div id="lista-ordenes" class="space-y-6"></div>`;
        cargarOrdenes();
      } else if (seccion === 'proveedores') {
        content.innerHTML = `<h1 class="text-3xl font-bold mb-8">Proveedores</h1><p>Base de datos de proveedores (próximamente)</p>`;
      } else if (seccion === 'recepciones') {
        content.innerHTML = `<h1 class="text-3xl font-bold mb-8">Recepción de Mercancía</h1><p>Funcionalidad en desarrollo</p>`;
      }
    }

    function agregarProductoOrden() {
      const nombre = prompt("Nombre del producto:");
      if (!nombre) return;
      const cantidad = parseInt(prompt("Cantidad:", "10")) || 10;
      const precio = parseFloat(prompt("Precio unitario Q:", "50")) || 50;

      productosOrden.push({nombre, cantidad, precio});
      renderProductosOrden();
    }

    function renderProductosOrden() {
      const container = document.getElementById('lista-productos-orden');
      container.innerHTML = productosOrden.map((p, i) => `
        <div class="flex justify-between items-center bg-gray-50 p-4 rounded-2xl">
          <span class="font-medium">${p.nombre} × ${p.cantidad}</span>
          <span class="font-bold">Q${(p.precio * p.cantidad).toFixed(2)}</span>
          <button onclick="eliminarProductoOrden(${i})" class="text-red-600 hover:text-red-700">Eliminar</button>
        </div>
      `).join('');
    }

    function eliminarProductoOrden(index) {
      productosOrden.splice(index, 1);
      renderProductosOrden();
    }

    async function guardarOrdenCompra() {
      const proveedor = document.getElementById('proveedor').value.trim();
      if (!proveedor || productosOrden.length === 0) {
        return alert("❌ Debes agregar un proveedor y al menos un producto");
      }

      const total = productosOrden.reduce((sum, p) => sum + (p.precio * p.cantidad), 0);

      try {
        await db.collection('ordenes_compra').add({
          proveedor: proveedor,
          fecha: new Date(),
          productos: productosOrden,
          total: total,
          estado: "Pendiente",
          notas: document.getElementById('notas').value || ""
        });
        
        alert("✅ Orden de compra guardada correctamente");
        productosOrden = [];
        mostrarSeccion('ordenes');
      } catch (e) {
        console.error(e);
        alert("Error: " + e.message + "\n\nVerifica las reglas de Firebase");
      }
    }

    async function cargarOrdenes() {
      const container = document.getElementById('lista-ordenes');
      
      db.collection('ordenes_compra').orderBy('fecha', 'desc').onSnapshot(snapshot => {
        let html = '';
        snapshot.forEach(doc => {
          const o = doc.data();
          html += `
            <div class="bg-white rounded-3xl shadow p-6">
              <div class="flex justify-between items-start">
                <div>
                  <p class="font-bold text-lg">${o.proveedor}</p>
                  <p class="text-sm text-gray-500">${o.fecha.toDate().toLocaleString('es-GT')}</p>
                </div>
                <span class="px-4 py-1 rounded-full bg-yellow-100 text-yellow-700 text-sm">${o.estado}</span>
              </div>
              <div class="mt-4 text-sm space-y-1">
                ${o.productos.map(p => `<div>${p.nombre} × ${p.cantidad} → Q${(p.precio * p.cantidad).toFixed(2)}</div>`).join('')}
              </div>
              <div class="mt-6 pt-4 border-t font-bold flex justify-between">
                <span>Total:</span>
                <span>Q${o.total.toFixed(2)}</span>
              </div>
            </div>`;
        });
        container.innerHTML = html || `<p class="text-center py-12 text-gray-400">No hay órdenes registradas todavía</p>`;
      });
    }

    window.onload = () => mostrarSeccion('nueva-orden');
  </script>
</body>
</html>
