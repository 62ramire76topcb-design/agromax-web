<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGROMAXGTM - Compras</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100">

  <div class="flex h-screen">
    <div class="w-72 bg-white border-r shadow-xl overflow-y-auto">
      <div class="p-6 border-b bg-green-700 text-white">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-white rounded-2xl flex items-center justify-center text-green-700 text-3xl">🌱</div>
          <div>
            <h1 class="text-2xl font-bold">AGROMAXGTM</h1>
            <p class="text-xs">Módulo de Compras</p>
          </div>
        </div>
      </div>
      <nav class="p-4 space-y-1">
        <a href="admin.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-arrow-left"></i> Volver al Admin</a>
        <a onclick="mostrarSeccion('nueva-orden')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-plus"></i> Nueva Orden</a>
        <a onclick="mostrarSeccion('ordenes')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-list"></i> Mis Órdenes</a>
        <a onclick="mostrarSeccion('proveedores')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-truck"></i> Proveedores</a>
        <a onclick="mostrarSeccion('recepciones')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-boxes"></i> Recepción</a>
      </nav>
    </div>

    <div class="flex-1 overflow-auto p-8" id="main-content"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAEj22gE5UySwWVwIec6jpBiZ2nb1OBftM",
      authDomain: "agromaxgt-app.firebaseapp.com",
      projectId: "agromaxgt-app",
      storageBucket: "agromaxgt-app.firebasestorage.app",
      messagingSenderId: "648144313047",
      appId: "1:648144313047:web:118a67464d99f2d0462e92"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let productosOrden = [];

    async function verificarAuth() {
      return new Promise(resolve => {
        auth.onAuthStateChanged(user => {
          if (!user) window.location.href = "admin.html";
          else resolve(user);
        });
      });
    }

    async function mostrarSeccion(seccion) {
      await verificarAuth();
      const content = document.getElementById('main-content');

      if (seccion === 'nueva-orden') {
        await cargarProveedores();
        content.innerHTML = `
          <h1 class="text-3xl font-bold mb-8">Nueva Orden de Compra</h1>
          <div class="max-w-4xl bg-white p-8 rounded-3xl shadow">
            <select id="proveedor-select" class="w-full p-4 border rounded-2xl mb-6"></select>
            <input id="fecha" type="date" class="w-full p-4 border rounded-2xl mb-6">
            <textarea id="notas" placeholder="Notas..." class="w-full p-4 border rounded-2xl h-32"></textarea>

            <div class="mt-8">
              <h3 class="font-bold mb-4">Buscar Producto</h3>
              <input id="buscar" placeholder="Buscar producto..." class="w-full p-4 border rounded-2xl" onkeyup="filtrarProductos()">
              <div id="resultados" class="max-h-80 overflow-auto border rounded-2xl mt-3 p-3 bg-gray-50"></div>
            </div>

            <div id="lista-orden" class="mt-10 space-y-4"></div>
            <button onclick="guardarOrdenCompra()" class="mt-10 w-full bg-green-700 text-white py-4 rounded-3xl font-bold">Guardar Orden de Compra</button>
          </div>`;
      } 
      else if (seccion === 'ordenes') {
        content.innerHTML = `<h1 class="text-3xl font-bold mb-8">Órdenes de Compra</h1><div id="lista-ordenes" class="space-y-6"></div>`;
        cargarOrdenes();
      } 
      else if (seccion === 'proveedores') {
        content.innerHTML = `
          <h1 class="text-3xl font-bold mb-8">Gestión de Proveedores</h1>
          <div class="max-w-2xl bg-white p-8 rounded-3xl shadow mb-8">
            <input id="empresa" placeholder="Nombre de la Empresa" class="w-full p-4 border rounded-2xl mb-4">
            <input id="nombre-contacto" placeholder="Nombre del Contacto" class="w-full p-4 border rounded-2xl mb-4">
            <input id="telefono" placeholder="Teléfono WhatsApp" class="w-full p-4 border rounded-2xl mb-4">
            <input id="correo" type="email" placeholder="Correo Electrónico" class="w-full p-4 border rounded-2xl mb-4">
            <input id="direccion" placeholder="Dirección" class="w-full p-4 border rounded-2xl mb-6">
            <button onclick="agregarProveedor()" class="w-full bg-green-600 text-white py-4 rounded-2xl font-bold">Agregar Proveedor</button>
          </div>
          <div id="lista-proveedores" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>`;
        cargarListaProveedores();
      } 
      else if (seccion === 'recepciones') {
        content.innerHTML = `<h1 class="text-3xl font-bold mb-8">Recepción de Mercancía</h1><div id="lista-recepcion" class="space-y-6"></div>`;
        cargarRecepciones();
      }
    }

    // ==================== PROVEEDORES ====================
    async function agregarProveedor() {
      const empresa = document.getElementById('empresa').value.trim();
      if (!empresa) return alert("Nombre de empresa es obligatorio");

      await db.collection('proveedores').add({
        empresa,
        nombreContacto: document.getElementById('nombre-contacto').value,
        telefono: document.getElementById('telefono').value,
        correo: document.getElementById('correo').value,
        direccion: document.getElementById('direccion').value,
        fecha: new Date()
      });

      alert("✅ Proveedor agregado");
      cargarListaProveedores();
    }

    async function cargarListaProveedores() {
      const container = document.getElementById('lista-proveedores');
      const snapshot = await db.collection('proveedores').get();
      let html = '';
      snapshot.forEach(doc => {
        const p = doc.data();
        html += `
          <div class="bg-white p-6 rounded-3xl shadow">
            <p class="font-bold text-lg">${p.empresa}</p>
            <p>${p.nombreContacto || ''}</p>
            <p class="text-green-600 cursor-pointer" onclick="window.open('https://wa.me/502${p.telefono}','_blank')">📱 ${p.telefono}</p>
            <p>${p.correo || ''}</p>
            <p class="text-sm text-gray-500">${p.direccion || ''}</p>
            <div class="mt-4">
              <button onclick="editarProveedor('${doc.id}')" class="text-blue-600 mr-4">Editar</button>
              <button onclick="eliminarProveedor('${doc.id}')" class="text-red-600">Eliminar</button>
            </div>
          </div>`;
      });
      container.innerHTML = html || '<p class="text-gray-500">No hay proveedores registrados</p>';
    }

    async function eliminarProveedor(id) {
      if (confirm("¿Eliminar este proveedor?")) {
        await db.collection('proveedores').doc(id).delete();
        cargarListaProveedores();
      }
    }

    // ==================== NUEVA ORDEN ====================
    async function cargarProveedores() {
      const select = document.getElementById('proveedor-select');
      const snapshot = await db.collection('proveedores').get();
      select.innerHTML = '<option value="">Seleccionar Proveedor</option>';
      snapshot.forEach(doc => {
        const p = doc.data();
        const opt = document.createElement('option');
        opt.value = p.empresa;
        opt.textContent = p.empresa;
        select.appendChild(opt);
      });
    }

    async function filtrarProductos() {
      // Implementación de búsqueda (puedes expandirla más)
      const term = document.getElementById('buscar').value.toLowerCase();
      // ... (mantengo lógica anterior)
    }

    async function guardarOrdenCompra() {
      const proveedor = document.getElementById('proveedor-select').value;
      if (!proveedor || productosOrden.length === 0) return alert("Faltan datos");

      const total = productosOrden.reduce((sum, p) => sum + p.precio * p.cantidad, 0);

      try {
        await db.collection('ordenes_compra').add({
          proveedor,
          fecha: new Date(),
          productos: productosOrden,
          total,
          estado: "Pendiente"
        });
        alert("✅ Orden guardada correctamente");
        productosOrden = [];
        mostrarSeccion('ordenes');
      } catch (e) {
        alert("Error: " + e.message);
      }
    }

    async function cargarOrdenes() {
      const container = document.getElementById('lista-ordenes');
      db.collection('ordenes_compra').orderBy('fecha', 'desc').onSnapshot(snapshot => {
        let html = '';
        snapshot.forEach(doc => {
          const o = doc.data();
          html += `
            <div class="bg-white rounded-3xl shadow p-6">
              <p class="font-bold">${o.proveedor}</p>
              <p class="text-sm text-gray-500">${o.fecha.toDate().toLocaleString('es-GT')}</p>
              <p class="font-bold mt-2">Total: Q${o.total.toFixed(2)}</p>
              <span class="inline-block mt-2 px-4 py-1 bg-yellow-100 text-yellow-700 rounded-full">${o.estado}</span>
            </div>`;
        });
        container.innerHTML = html || '<p class="text-gray-500">No hay órdenes registradas</p>';
      });
    }

    window.onload = () => mostrarSeccion('proveedores');
  </script>
</body>
</html>
