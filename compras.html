<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGROMAXGTM - Compras</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100">

  <div class="flex h-screen">
    <div class="w-72 bg-white border-r shadow-xl overflow-y-auto">
      <div class="p-6 border-b bg-green-700 text-white">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-white rounded-2xl flex items-center justify-center text-green-700 text-3xl">🌱</div>
          <div>
            <h1 class="text-2xl font-bold">AGROMAXGTM</h1>
            <p class="text-xs">Módulo de Compras</p>
          </div>
        </div>
      </div>
      <nav class="p-4 space-y-1">
        <a href="admin.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-arrow-left"></i> Volver al Admin</a>
        <a onclick="mostrarSeccion('nueva-orden')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-plus"></i> Nueva Orden</a>
        <a onclick="mostrarSeccion('ordenes')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-list"></i> Mis Órdenes</a>
        <a onclick="mostrarSeccion('proveedores')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-green-50 cursor-pointer"><i class="fas fa-truck"></i> Proveedores</a>
      </nav>
    </div>

    <div class="flex-1 overflow-auto p-8" id="main-content"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAEj22gE5UySwWVwIec6jpBiZ2nb1OBftM",
      authDomain: "agromaxgt-app.firebaseapp.com",
      projectId: "agromaxgt-app",
      storageBucket: "agromaxgt-app.firebasestorage.app",
      messagingSenderId: "648144313047",
      appId: "1:648144313047:web:118a67464d99f2d0462e92"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let productosOrden = [];

    async function verificarAuth() {
      return new Promise(resolve => {
        auth.onAuthStateChanged(user => {
          if (!user) {
            alert("Debes iniciar sesión primero");
            window.location.href = "admin.html";
          } else resolve(user);
        });
      });
    }

    async function mostrarSeccion(seccion) {
      await verificarAuth();
      const content = document.getElementById('main-content');

      if (seccion === 'nueva-orden') {
        await cargarProveedores();
        content.innerHTML = `
          <h1 class="text-3xl font-bold mb-8">Nueva Orden de Compra</h1>
          <div class="max-w-4xl bg-white p-8 rounded-3xl shadow">
            <select id="proveedor-select" class="w-full p-4 border rounded-2xl mb-6"></select>
            <input id="fecha" type="date" class="w-full p-4 border rounded-2xl mb-6">
            <textarea id="notas" placeholder="Notas o condiciones" class="w-full p-4 border rounded-2xl h-32"></textarea>

            <div class="mt-8">
              <h3 class="font-bold mb-4">Buscar Producto</h3>
              <input id="buscar" placeholder="Escribe nombre del producto..." class="w-full p-4 border rounded-2xl mb-4" onkeyup="filtrarProductos()">
              <div id="resultados" class="max-h-80 overflow-auto border rounded-2xl p-3 bg-gray-50"></div>
            </div>

            <div id="lista-orden" class="mt-10 space-y-4"></div>

            <button onclick="guardarOrdenCompra()" class="mt-10 w-full bg-green-700 text-white py-4 rounded-3xl font-bold text-lg">Guardar Orden de Compra</button>
          </div>`;
      } else if (seccion === 'ordenes') {
        content.innerHTML = `<h1 class="text-3xl font-bold mb-8">Órdenes de Compra</h1><div id="lista-ordenes" class="space-y-6"></div>`;
        cargarOrdenes();
      } else if (seccion === 'proveedores') {
        content.innerHTML = `<h1 class="text-3xl font-bold mb-8">Proveedores</h1><p>Ya funciona correctamente</p>`;
      }
    }

    // Cargar proveedores
    async function cargarProveedores() {
      const select = document.getElementById('proveedor-select');
      try {
        const snapshot = await db.collection('proveedores').get();
        select.innerHTML = '<option value="">Seleccionar Proveedor</option>';
        snapshot.forEach(doc => {
          const p = doc.data();
          const opt = document.createElement('option');
          opt.value = p.empresa || p.nombre;
          opt.textContent = p.empresa || p.nombre;
          select.appendChild(opt);
        });
      } catch(e) {
        console.error(e);
      }
    }

    // Búsqueda de productos
    let allProductos = [];
    async function cargarTodosProductos() {
      const snap = await db.collection('productos').get();
      allProductos = snap.docs.map(d => ({id: d.id, ...d.data()}));
    }

    async function filtrarProductos() {
      await cargarTodosProductos();
      const term = document.getElementById('buscar').value.toLowerCase().trim();
      const container = document.getElementById('resultados');
      if (term.length < 2) {
        container.innerHTML = '';
        return;
      }
      const res = allProductos.filter(p => p.nombre.toLowerCase().includes(term));
      container.innerHTML = res.map(p => `
        <div onclick="agregarProducto('${p.nombre}', ${p.precio || 0})" class="p-4 hover:bg-white rounded-xl cursor-pointer flex justify-between border-b">
          <span>${p.nombre}</span>
          <span class="font-bold text-green-600">Q${p.precio || 0}</span>
        </div>
      `).join('');
    }

    function agregarProducto(nombre, precio) {
      const cantidad = parseInt(prompt(`Cantidad de ${nombre}:`, "10")) || 10;
      productosOrden.push({nombre, cantidad, precio});
      renderOrden();
    }

    function renderOrden() {
      const container = document.getElementById('lista-orden');
      container.innerHTML = productosOrden.map((p, i) => `
        <div class="flex justify-between items-center bg-gray-50 p-4 rounded-2xl">
          <span>${p.nombre} × ${p.cantidad}</span>
          <span class="font-bold">Q${(p.precio * p.cantidad).toFixed(2)}</span>
          <button onclick="eliminarProducto(${i})" class="text-red-600">Eliminar</button>
        </div>
      `).join('');
    }

    function eliminarProducto(i) {
      productosOrden.splice(i, 1);
      renderOrden();
    }

    async function guardarOrdenCompra() {
      const proveedor = document.getElementById('proveedor-select').value;
      if (!proveedor || productosOrden.length === 0) {
        return alert("❌ Selecciona un proveedor y agrega productos");
      }

      const total = productosOrden.reduce((sum, p) => sum + p.precio * p.cantidad, 0);

      try {
        await db.collection('ordenes_compra').add({
          proveedor,
          fecha: new Date(),
          productos: productosOrden,
          total,
          estado: "Pendiente",
          notas: document.getElementById('notas').value || ""
        });
        alert("✅ Orden guardada correctamente");
        productosOrden = [];
        mostrarSeccion('ordenes');
      } catch (e) {
        console.error(e);
        alert("Error: " + e.message + "\n\nRevisa las reglas de Firebase");
      }
    }

    async function cargarOrdenes() {
      const container = document.getElementById('lista-ordenes');
      db.collection('ordenes_compra').orderBy('fecha', 'desc').onSnapshot(snapshot => {
        let html = '';
        snapshot.forEach(doc => {
          const o = doc.data();
          html += `
            <div class="bg-white rounded-3xl shadow p-6">
              <p class="font-bold">${o.proveedor}</p>
              <p class="text-sm text-gray-500">${o.fecha.toDate().toLocaleString('es-GT')}</p>
              <p class="font-bold mt-2">Total: Q${o.total ? o.total.toFixed(2) : '0.00'}</p>
              <span class="inline-block mt-3 px-4 py-1 bg-yellow-100 text-yellow-700 rounded-full">${o.estado}</span>
            </div>`;
        });
        container.innerHTML = html || '<p class="text-center py-12 text-gray-400">No hay órdenes registradas</p>';
      });
    }

    window.onload = () => mostrarSeccion('nueva-orden');
  </script>
</body>
</html>
